<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebXR Local GLB Loader - Meta Quest 3</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
      // Componente per gestire il caricamento del file locale
      AFRAME.registerComponent('local-glb-loader', {
        init: function () {
          const el = this.el;
          const fileInput = document.querySelector('#file-input');

          fileInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
              // Creiamo un URL temporaneo locale per il file .glb scelto
              const blobUrl = URL.createObjectURL(file);
              console.log("File caricato:", file.name);
              
              // Assegniamo il file all'attributo gltf-model dell'entità
              el.setAttribute('gltf-model', blobUrl);
            }
          });
        }
      });
    </script>
  </head>
  
  <body>
    <!-- Interfaccia HTML fluttuante per selezionare il file -->
    <div style="position: absolute; top: 10px; left: 10px; z-index: 999; background: white; padding: 10px; border-radius: 8px;">
      <label for="file-input" style="color: black; font-family: sans-serif; font-weight: bold;">Scegli il tuo file .glb:</label><br>
      <input type="file" id="file-input" accept=".glb" style="margin-top: 5px; color: black;">
    </div>

    <a-scene>
      <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
      <a-light type="directional" position="-1 2 1" intensity="0.5"></a-light>

      <!-- Rig del giocatore -->
      <a-entity id="player-rig" position="0 0 0">
        <a-camera id="head-camera" position="0 1.6 0" look-controls></a-camera>
        <a-entity id="left-hand" hand-tracking-controls="hand: left"></a-entity>
        <a-entity id="right-hand" hand-tracking-controls="hand: right"></a-entity>
      </a-entity>

      <!-- Entità che riceverà il modello .glb caricato -->
      <a-entity 
        id="avatar" 
        position="0 0 -1.5" 
        rotation="0 0 0" 
        scale="1 1 1"
        local-glb-loader>
      </a-entity>

      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
