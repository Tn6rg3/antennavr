<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PC Sender - Alta Qualità</title>
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background: #222; color: white; }
    button { padding: 20px; font-size: 20px; background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 10px; }
    video { width: 80%; max-width: 800px; margin-top: 20px; border: 4px solid #555; border-radius: 10px; background: #000; }
  </style>
</head>
<body>
  <h1>Trasmetti al Meta Quest (HD 1080p 60fps)</h1>
  <button id="start">Condividi Schermo al Quest</button>
  <h3 id="status" style="color: #aaa;">In attesa...</h3>
  <video id="mioSchermo" autoplay muted></video>

  <script>
    document.getElementById('start').addEventListener('click', async () => {
      try {
        // FORZATURA ALTA QUALITÀ VIDEO
        const streamSchermo = await navigator.mediaDevices.getDisplayMedia({ 
          video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } }, 
          audio: false 
        });
        document.getElementById('mioSchermo').srcObject = streamSchermo;
        document.getElementById('status').innerText = "Elaborazione in corso...";
        
        const peerPC = new Peer();
        peerPC.on('open', () => {
          const call = peerPC.call('quest-italia-pro-847291', streamSchermo);
          document.getElementById('status').innerText = "✅ In trasmissione Alta Qualità! Guarda nel visore.";
          document.getElementById('status').style.color = "#00FF00";
        });
      } catch (err) { alert("Errore. Riprova."); }
    });
  </script>
</body>
</html>
