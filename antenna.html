<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore Copertura RF 3D (Viewshed)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100vw; height: 100vh; cursor: crosshair; }
        
        /* Pannello UI */
        #ui-panel {
            position: absolute; top: 1rem; left: 1rem; width: 340px; max-height: 95vh; overflow-y: auto;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); color: #f8fafc; z-index: 10;
        }
        
        input[type="number"], select {
            background: rgba(30, 41, 59, 0.8); border: 1px solid #475569;
            color: #e2e8f0; border-radius: 6px; padding: 6px 10px; width: 100%;
            transition: border-color 0.2s; font-family: monospace;
        }
        input[type="number"]:focus, select:focus { outline: none; border-color: #38bdf8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 3px; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-panel" class="p-5 flex flex-col gap-3">
    <h2 class="text-sm font-bold text-sky-400 uppercase tracking-wider flex items-center gap-2 border-b border-slate-700 pb-2">
        <i class="fa-solid fa-satellite-dish"></i> Simulatore RF 3D
    </h2>

    <div class="bg-amber-900/30 border-l-2 border-amber-500 p-2.5 text-[11px] text-amber-200 rounded shadow-inner leading-relaxed">
        <b>Istruzioni:</b><br>
        1. Clicca sulla mappa per spostare l'antenna.<br>
        2. Clicca su un edificio 3D per cambiarne l'altezza.
    </div>

    <!-- Controlli -->
    <div class="grid grid-cols-2 gap-3 text-xs mt-2">
        <div>
            <label class="block text-slate-400 font-bold uppercase mb-1">Alt. Antenna (m)</label>
            <input type="number" id="inp-h-ant" value="15" min="0" step="1">
        </div>
        <div>
            <label class="block text-slate-400 font-bold uppercase mb-1">Elevazione (°)</label>
            <input type="number" id="inp-angle" value="5" min="0" max="89" step="1" title="Angolo di take-off">
        </div>
        <div class="col-span-2">
            <label class="block text-slate-400 font-bold uppercase mb-1">Raggio Download Edifici (m)</label>
            <select id="inp-radius">
                <option value="300">300 m (Veloce)</option>
                <option value="500" selected>500 m (Consigliato)</option>
                <option value="1000">1000 m (Ampio)</option>
                <option value="2000">2000 m (Lento)</option>
            </select>
        </div>
    </div>
    
    <div class="text-[10px] text-sky-300 font-mono mt-1" id="status-log">
        Coordinate Antenna: In attesa...
    </div>

    <div class="flex flex-col gap-2 mt-2">
        <button id="btn-load" onclick="estraiEdifici()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded uppercase tracking-wider text-xs transition-colors shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-city"></i> 1. Estrai Edifici OSM
        </button>

        <button id="btn-calc" onclick="calcolaCopertura()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded uppercase tracking-wider text-xs transition-colors shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-radar"></i> 2. Calcola Copertura
        </button>
    </div>
</div>

<script>
    // --- Variabili Globali ---
    let antennaPos = null; // [lng, lat]
    let buildingsGeoJSON = { type: 'FeatureCollection', features: [] };
    
    // Array ottimizzato per la fisica: { id, coords: [[]], height, minX, minY, maxX, maxY }
    let physicsBuildings = []; 

    // --- Inizializzazione Mappa ---
    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: {
                'esri-satellite': {
                    type: 'raster',
                    tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                    tileSize: 256
                }
            },
            layers: [{ id: 'sat-layer', type: 'raster', source: 'esri-satellite' }]
        },
        center: [11.2366, 46.0655], // Pergine Valsugana
        zoom: 15,
        pitch: 65,
        bearing: -20
    });

    map.on('load', () => {
        // Terreno (Esagerazione a 1.0 per corrispondenza matematica perfetta)
        map.addSource('aws-terrain', {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            encoding: 'terrarium',
            tileSize: 256
        });
        map.setTerrain({ source: 'aws-terrain', exaggeration: 1.0 });

        // Layer Edifici 3D
        map.addSource('buildings-src', { type: 'geojson', data: buildingsGeoJSON });
        map.addLayer({
            'id': '3d-buildings',
            'type': 'fill-extrusion',
            'source': 'buildings-src',
            'paint': {
                'fill-extrusion-color': '#e2e8f0', // Grigio chiaro
                'fill-extrusion-height': ['get', 'top_z'],
                'fill-extrusion-base': ['get', 'base_z'],
                'fill-extrusion-opacity': 0.85
            }
        });

        // Layer Antenna 3D
        map.addSource('antenna-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': '3d-antenna',
            'type': 'fill-extrusion',
            'source': 'antenna-src',
            'paint': {
                'fill-extrusion-color': '#ef4444', // Rosso
                'fill-extrusion-height': ['get', 'top_z'],
                'fill-extrusion-base': ['get', 'base_z'],
                'fill-extrusion-opacity': 1
            }
        });

        // Layer Copertura RF (Viewshed)
        map.addSource('coverage-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': 'rf-coverage',
            'type': 'fill',
            'source': 'coverage-src',
            'paint': {
                'fill-color': '#ef4444',
                'fill-opacity': 0.5,
                'fill-outline-color': '#fca5a5'
            }
        });

        // Cursor pointer sugli edifici
        map.on('mouseenter', '3d-buildings', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', '3d-buildings', () => map.getCanvas().style.cursor = 'crosshair');
    });

    // --- Interazioni Mappa ---
    map.on('click', (e) => {
        // 1. Controlla se abbiamo cliccato su un edificio
        const features = map.queryRenderedFeatures(e.point, { layers: ['3d-buildings'] });
        
        if (features.length > 0) {
            gestisciModificaEdificio(features[0]);
            return; // Ferma esecuzione per non spostare l'antenna
        }

        // 2. Nessun edificio: Posiziona l'Antenna
        antennaPos = [e.lngLat.lng, e.lngLat.lat];
        disegnaAntenna3D();
        
        // Pulisce l'area di copertura
        map.getSource('coverage-src').setData({ type: 'FeatureCollection', features: [] });
    });

    function disegnaAntenna3D() {
        if (!antennaPos) return;

        const hAnt = parseFloat(document.getElementById('inp-h-ant').value) || 10;
        const zBase = map.queryTerrainElevation(antennaPos) || 0;
        
        // Disegna un piccolo quadrato (che estruso diventa un palo)
        const rad = 0.000015;
        const polyCoords = [
            [antennaPos[0]-rad, antennaPos[1]-rad], [antennaPos[0]+rad, antennaPos[1]-rad],
            [antennaPos[0]+rad, antennaPos[1]+rad], [antennaPos[0]-rad, antennaPos[1]+rad],
            [antennaPos[0]-rad, antennaPos[1]-rad]
        ];

        map.getSource('antenna-src').setData({
            type: 'FeatureCollection',
            features: [{
                type: 'Feature',
                properties: { base_z: zBase, top_z: zBase + hAnt },
                geometry: { type: 'Polygon', coordinates: [polyCoords] }
            }]
        });

        document.getElementById('status-log').innerText = `Origine: ${antennaPos[0].toFixed(4)}, ${antennaPos[1].toFixed(4)}\nQuota Base: ${zBase.toFixed(1)}m slm`;
    }

    // Ridisegna antenna se si cambia l'altezza nell'input
    document.getElementById('inp-h-ant').addEventListener('change', disegnaAntenna3D);

    // --- Modifica Edifici ---
    function gestisciModificaEdificio(feature) {
        const id = feature.properties.id;
        const currentH = feature.properties.height;
        
        const userInput = prompt(`Edificio OSM (ID: ${id})\nAltezza attuale: ${currentH} m.\nInserisci nuova altezza in metri:`, currentH);
        
        if (userInput !== null && !isNaN(userInput) && userInput.trim() !== '') {
            const newHeight = parseFloat(userInput);
            
            // Aggiorna GeoJSON Visuale
            const geoF = buildingsGeoJSON.features.find(f => f.properties.id === id);
            if (geoF) {
                geoF.properties.height = newHeight;
                geoF.properties.top_z = geoF.properties.base_z + newHeight;
                map.getSource('buildings-src').setData(buildingsGeoJSON);
            }
            
            // Aggiorna Motore Fisico
            const physB = physicsBuildings.find(b => b.id === id);
            if (physB) {
                physB.height = newHeight;
            }

            document.getElementById('status-log').innerText = `Edificio modificato a ${newHeight}m.`;
            
            // Se c'è una copertura calcolata, ricalcola automaticamente
            if (antennaPos) calcolaCopertura();
        }
    }

    // --- Download Edifici (OSM) ---
    async function estraiEdifici() {
        if (!antennaPos) { alert("Clicca sulla mappa per posizionare l'antenna prima di estrarre."); return; }
        
        const btn = document.getElementById('btn-load');
        const radius = parseFloat(document.getElementById('inp-radius').value) || 500;
        
        btn.innerHTML = '<i class="fa-solid fa-circle-notch loading-spin"></i> Download...';
        btn.disabled = true;

        const query = `
            [out:json][timeout:25];
            (
              way["building"](around:${radius}, ${antennaPos[1]}, ${antennaPos[0]});
              relation["building"](around:${radius}, ${antennaPos[1]}, ${antennaPos[0]});
            );
            out body; >; out skel qt;
        `;

        try {
            const response = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query });
            if (!response.ok) throw new Error("API Error");
            
            const data = await response.json();
            
            let nodes = {};
            data.elements.forEach(el => { if (el.type === 'node') nodes[el.id] = [el.lon, el.lat]; });
            
            buildingsGeoJSON.features = [];
            physicsBuildings = [];
            
            data.elements.forEach((el, index) => {
                if (el.type === 'way' && el.tags && el.tags.building) {
                    let coords = el.nodes.map(n => nodes[n]).filter(c => c);
                    if (coords.length > 2) {
                        // Chiudi il poligono
                        if (coords[0][0] !== coords[coords.length-1][0] || coords[0][1] !== coords[coords.length-1][1]) {
                            coords.push([...coords[0]]);
                        }
                        
                        let height = el.tags.height ? parseFloat(el.tags.height) : (el.tags['building:levels'] ? parseInt(el.tags['building:levels']) * 3.5 : 8);
                        let uniqueId = Date.now() + index;

                        // Calcolo Bounding Box per la fisica
                        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                        for(let pt of coords) {
                            if(pt[0] < minX) minX = pt[0];
                            if(pt[1] < minY) minY = pt[1];
                            if(pt[0] > maxX) maxX = pt[0];
                            if(pt[1] > maxY) maxY = pt[1];
                        }

                        // Otteniamo la quota del terreno al centro (circa) dell'edificio
                        let baseZ = map.queryTerrainElevation(coords[0]) || map.queryTerrainElevation(antennaPos) || 0;

                        // Inserimento per Rendering
                        buildingsGeoJSON.features.push({
                            type: 'Feature',
                            properties: { id: uniqueId, height: height, base_z: baseZ, top_z: baseZ + height },
                            geometry: { type: 'Polygon', coordinates: [coords] }
                        });
                        
                        // Inserimento per Fisica Fast Raycast
                        physicsBuildings.push({
                            id: uniqueId,
                            coords: coords,
                            height: height,
                            baseZ: baseZ,
                            minX: minX, minY: minY, maxX: maxX, maxY: maxY
                        });
                    }
                }
            });
            
            map.getSource('buildings-src').setData(buildingsGeoJSON);
            document.getElementById('status-log').innerText = `Letti ${buildingsGeoJSON.features.length} edifici reali.`;
            
        } catch (error) {
            console.error(error);
            alert("Errore Server OpenStreetMap. Riprova tra poco.");
        } finally {
            btn.innerHTML = '<i class="fa-solid fa-city"></i> 1. Estrai Edifici OSM';
            btn.disabled = false;
        }
    }

    // --- FAST MATH UTILS ---
    // Destinazione Haversine (velocissima)
    function getDestination(lon, lat, distance, bearingDeg) {
        const R = 6378137;
        const brng = bearingDeg * Math.PI / 180;
        const latRad = lat * Math.PI / 180;
        const dx = distance * Math.sin(brng);
        const dy = distance * Math.cos(brng);
        const newLat = lat + (dy / R) * (180 / Math.PI);
        const newLon = lon + (dx / (R * Math.cos(latRad))) * (180 / Math.PI);
        return [newLon, newLat];
    }

    // Algoritmo PIP (Point in Polygon)
    function pointInPolygon(point, vs) {
        let x = point[0], y = point[1];
        let inside = false;
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
            let xi = vs[i][0], yi = vs[i][1];
            let xj = vs[j][0], yj = vs[j][1];
            let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    // --- PHYSICS ENGINE: CALCOLO COPERTURA ---
    function calcolaCopertura() {
        if (!antennaPos) { alert("Posiziona l'antenna!"); return; }

        const btn = document.getElementById('btn-calc');
        btn.innerHTML = '<i class="fa-solid fa-radar loading-spin"></i> Raycasting 3D in corso...';
        btn.disabled = true;

        setTimeout(() => {
            const hAnt = parseFloat(document.getElementById('inp-h-ant').value) || 0;
            const angoloDeg = parseFloat(document.getElementById('inp-angle').value) || 0;
            
            // PARAMETRI FISICA
            const stepMeters = 5; // PASSO: 5 metri per non saltare edifici sottili (MOLTO IMPORTANTE)
            const maxDistance = 3000; // 3 km
            
            const elevAngleRad = angoloDeg * (Math.PI / 180);
            const tanElev = Math.tan(elevAngleRad);
            
            // ORIGINE Z (Base Terreno + Altezza Antenna)
            const terrainZBase = map.queryTerrainElevation(antennaPos) || 0;
            const originZ = terrainZBase + hAnt;

            let coveragePolygon = [];

            // LOOP 360 Raggi
            for (let az = 0; az < 360; az++) {
                let hitPoint = [...antennaPos]; // Default all'origine se sbatte subito
                
                for (let dist = stepMeters; dist <= maxDistance; dist += stepMeters) {
                    
                    // Calcolo nuova posizione x,y
                    const stepPos = getDestination(antennaPos[0], antennaPos[1], dist, az);
                    
                    // Calcolo quota Z matematica del raggio
                    const rayZ = originZ + dist * tanElev;
                    
                    // Quota Z del terreno a quella distanza
                    // Se queryTerrainElevation fallisce (tile non renderizzata), fallback alla base
                    let terrainZ = map.queryTerrainElevation(stepPos);
                    if (terrainZ === null) terrainZ = terrainZBase; 

                    // 1. COLLISIONE MONTAGNA / TERRENO
                    if (rayZ <= terrainZ) {
                        hitPoint = stepPos;
                        break; 
                    }

                    // 2. COLLISIONE EDIFICI
                    let hitBuilding = false;
                    for (let i = 0; i < physicsBuildings.length; i++) {
                        const b = physicsBuildings[i];
                        
                        // Controllo veloce Bounding Box
                        if (stepPos[0] >= b.minX && stepPos[0] <= b.maxX && stepPos[1] >= b.minY && stepPos[1] <= b.maxY) {
                            
                            // Controllo preciso Geometrico
                            if (pointInPolygon(stepPos, b.coords)) {
                                
                                // Il tetto dell'edificio si calcola dalla quota terreno locale
                                const buildingTopZ = terrainZ + b.height;
                                
                                if (rayZ <= buildingTopZ) {
                                    hitBuilding = true;
                                    break; // Ferma ciclo edifici
                                }
                            }
                        }
                    }

                    if (hitBuilding) {
                        hitPoint = stepPos;
                        break; // Ferma il raggio
                    }

                    // Nessuna collisione, aggiorna l'ultimo punto valido
                    hitPoint = stepPos;
                }
                
                // Salva il punto d'impatto (o il punto massimo a 3km)
                coveragePolygon.push(hitPoint);
            }

            // Chiudi il poligono per GeoJSON
            coveragePolygon.push(coveragePolygon[0]);

            // Disegna Copertura sulla Mappa
            map.getSource('coverage-src').setData({
                type: 'FeatureCollection',
                features: [{
                    type: 'Feature',
                    geometry: { type: 'Polygon', coordinates: [coveragePolygon] },
                    properties: {}
                }]
            });

            // Ripristina UI
            btn.innerHTML = '<i class="fa-solid fa-radar"></i> 2. Calcola Copertura';
            btn.disabled = false;
            
        }, 50); // Piccolo ritardo per permettere il render del pulsante in stato "Loading"
    }
</script>

</body>
</html>
