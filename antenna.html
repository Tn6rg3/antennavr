<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore Propagazione RF 3D - Intersezione Analitica</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100vw; height: 100vh; cursor: crosshair; }
        
        #ui-panel {
            position: absolute; top: 1rem; left: 1rem; width: 360px; max-height: 95vh; overflow-y: auto;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); color: #f8fafc; z-index: 10;
        }
        
        input[type="text"], input[type="number"], select {
            background: rgba(30, 41, 59, 0.8); border: 1px solid #475569;
            color: #e2e8f0; border-radius: 6px; padding: 8px; width: 100%;
            transition: border-color 0.2s; font-family: monospace; font-size: 13px;
        }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 3px; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-panel" class="p-5 flex flex-col gap-3">
    <h2 class="text-sm font-bold text-sky-400 uppercase tracking-wider flex items-center gap-2 border-b border-slate-700 pb-2">
        <i class="fa-solid fa-satellite-dish"></i> RF Sim: Precisione Assoluta
    </h2>

    <div class="bg-amber-900/30 border-l-2 border-amber-500 p-2.5 text-[11px] text-amber-200 rounded shadow-inner leading-relaxed">
        <b>Istruzioni:</b><br>
        1. Clicca sulla mappa o usa le coordinate per l'antenna.<br>
        2. Clicca su un edificio 3D per cambiarne l'altezza.
    </div>

    <div class="mt-2">
        <label class="block text-slate-400 font-bold uppercase mb-1 text-xs">Coordinate Antenna (Lat, Lon)</label>
        <div class="flex gap-2">
            <input type="text" id="inp-coords" placeholder="es. 46.0610, 11.2400" title="Inserisci Latitudine, Longitudine">
            <button onclick="posizionaDaCoordinate()" class="bg-sky-600 hover:bg-sky-500 text-white px-3 rounded font-bold transition-colors shadow flex items-center gap-1">
                <i class="fa-solid fa-location-crosshairs"></i> Vai
            </button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-3 text-xs mt-2">
        <div>
            <label class="block text-slate-400 font-bold uppercase mb-1">Alt. Antenna (m)</label>
            <input type="number" id="inp-h-ant" value="10" min="0" step="1">
        </div>
        <div>
            <label class="block text-slate-400 font-bold uppercase mb-1">Elevazione (°)</label>
            <input type="number" id="inp-angle" value="5" min="0" max="89" step="1">
        </div>
        <div class="col-span-2">
            <label class="block text-sky-400 font-bold uppercase mb-1">Distanza max copertura (m)</label>
            <input type="number" id="inp-dist" value="3000" min="500" max="10000" step="100">
        </div>
        <div class="col-span-2">
            <label class="block text-indigo-400 font-bold uppercase mb-1">Raggio estrazione OSM (m)</label>
            <input type="number" id="inp-osm-rad" value="500" min="100" max="3000" step="100">
        </div>
    </div>
    
    <div class="text-[10px] text-sky-300 font-mono mt-1" id="status-log">
        Pronto. In attesa di posizionamento...
    </div>

    <div class="flex flex-col gap-2 mt-2">
        <button id="btn-load" onclick="estraiEdifici()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded uppercase tracking-wider text-xs transition-colors shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-city"></i> 1. Estrai Edifici OSM
        </button>

        <button id="btn-calc" onclick="calcolaCopertura()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded uppercase tracking-wider text-xs transition-colors shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-radar"></i> 2. Calcola Copertura
        </button>
    </div>
</div>

<script>
    let antennaPos = null; // [lng, lat] internally for maplibre
    let buildingsGeoJSON = { type: 'FeatureCollection', features: [] };
    let physicsBuildings = []; // Used for physics: { id, coords: [[]], height, base_z }
    const EARTH_RADIUS = 6378137;

    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: {
                'esri-satellite': {
                    type: 'raster',
                    tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                    tileSize: 256
                }
            },
            layers: [{ id: 'sat-layer', type: 'raster', source: 'esri-satellite' }]
        },
        center: [11.2366, 46.0655], // Pergine Default
        zoom: 15,
        pitch: 65,
        bearing: -20
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    map.on('load', () => {
        map.addSource('aws-terrain', {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            encoding: 'terrarium',
            tileSize: 256
        });
        map.setTerrain({ source: 'aws-terrain', exaggeration: 1.0 }); // MUST be 1.0 for exact physics math

        map.addSource('buildings-src', { type: 'geojson', data: buildingsGeoJSON });
        map.addLayer({
            'id': '3d-buildings',
            'type': 'fill-extrusion',
            'source': 'buildings-src',
            'paint': {
                'fill-extrusion-color': '#e2e8f0',
                'fill-extrusion-height': ['+', ['get', 'base_z'], ['get', 'height']],
                'fill-extrusion-base': ['get', 'base_z'],
                'fill-extrusion-opacity': 0.85
            }
        });

        map.addSource('antenna-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': '3d-antenna',
            'type': 'fill-extrusion',
            'source': 'antenna-src',
            'paint': {
                'fill-extrusion-color': '#ef4444',
                'fill-extrusion-height': ['get', 'top_z'],
                'fill-extrusion-base': ['get', 'base_z'],
                'fill-extrusion-opacity': 1
            }
        });

        map.addSource('coverage-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': 'rf-coverage',
            'type': 'fill',
            'source': 'coverage-src',
            'paint': {
                'fill-color': '#ef4444',
                'fill-opacity': 0.5,
                'fill-outline-color': '#fca5a5'
            }
        });

        map.on('mouseenter', '3d-buildings', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', '3d-buildings', () => map.getCanvas().style.cursor = 'crosshair');
    });

    map.on('click', (e) => {
        const features = map.queryRenderedFeatures(e.point, { layers: ['3d-buildings'] });
        
        // 1. Modifica Edificio Esistente
        if (features.length > 0) {
            const id = features[0].properties.id;
            const currentH = features[0].properties.height;
            const userInput = prompt(`Modifica Edificio (ID: ${id})\nAltezza attuale: ${currentH}m.\nNuova altezza (m):`, currentH);
            
            if (userInput !== null && !isNaN(userInput) && userInput.trim() !== '') {
                const newHeight = parseFloat(userInput);
                
                // Aggiorna grafica
                const geoF = buildingsGeoJSON.features.find(f => f.properties.id === id);
                if (geoF) {
                    geoF.properties.height = newHeight;
                    map.getSource('buildings-src').setData(buildingsGeoJSON);
                }
                
                // Aggiorna fisica
                const physB = physicsBuildings.find(b => b.id === id);
                if (physB) { physB.height = newHeight; }
                
                document.getElementById('status-log').innerText = `Edificio modificato a ${newHeight}m.`;
                if (antennaPos) calcolaCopertura();
            }
            return; 
        }

        // 2. Posizionamento Nuova Antenna da Click
        antennaPos = [e.lngLat.lng, e.lngLat.lat];
        
        // Aggiorna il campo di input delle coordinate
        document.getElementById('inp-coords').value = `${e.lngLat.lat.toFixed(6)}, ${e.lngLat.lng.toFixed(6)}`;
        
        disegnaAntenna3D();
        map.getSource('coverage-src').setData({ type: 'FeatureCollection', features: [] });
    });

    window.posizionaDaCoordinate = function() {
        const val = document.getElementById('inp-coords').value;
        const parts = val.split(',').map(s => parseFloat(s.trim()));
        
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            const lat = parts[0];
            const lng = parts[1];
            
            antennaPos = [lng, lat]; // MapLibre usa [lng, lat]
            disegnaAntenna3D();
            
            // Pulisci copertura precedente e naviga
            map.getSource('coverage-src').setData({ type: 'FeatureCollection', features: [] });
            map.flyTo({ center: [lng, lat], zoom: 15, pitch: 65, duration: 2000 });
        } else {
            alert("Formato coordinate non valido. Inserisci: Latitudine, Longitudine (es: 46.061, 11.240)");
        }
    };

    function disegnaAntenna3D() {
        if (!antennaPos) return;
        const hAnt = parseFloat(document.getElementById('inp-h-ant').value) || 10;
        const zBase = map.queryTerrainElevation(antennaPos) || 0;
        
        const rad = 0.000015; // Raggio visuale
        const polyCoords = [
            [antennaPos[0]-rad, antennaPos[1]-rad], [antennaPos[0]+rad, antennaPos[1]-rad],
            [antennaPos[0]+rad, antennaPos[1]+rad], [antennaPos[0]-rad, antennaPos[1]+rad],
            [antennaPos[0]-rad, antennaPos[1]-rad]
        ];

        map.getSource('antenna-src').setData({
            type: 'FeatureCollection',
            features: [{
                type: 'Feature',
                properties: { base_z: zBase, top_z: zBase + hAnt },
                geometry: { type: 'Polygon', coordinates: [polyCoords] }
            }]
        });

        document.getElementById('status-log').innerText = `Antenna posizionata. Quota Base: ${zBase.toFixed(1)}m.`;
    }

    document.getElementById('inp-h-ant').addEventListener('change', () => {
        disegnaAntenna3D();
        if(antennaPos && map.getSource('coverage-src')._data.features.length > 0) calcolaCopertura();
    });

    window.estraiEdifici = async function() {
        if (!antennaPos) { alert("Imposta la posizione dell'antenna prima di scaricare gli edifici!"); return; }
        
        const btn = document.getElementById('btn-load');
        const radius = parseFloat(document.getElementById('inp-osm-rad').value) || 500;
        
        btn.innerHTML = '<i class="fa-solid fa-circle-notch loading-spin"></i> Download...';
        btn.disabled = true;

        const query = `
            [out:json][timeout:25];
            (
              way["building"](around:${radius}, ${antennaPos[1]}, ${antennaPos[0]});
              relation["building"](around:${radius}, ${antennaPos[1]}, ${antennaPos[0]});
            );
            out body; >; out skel qt;
        `;

        try {
            const response = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query });
            if (!response.ok) throw new Error("API Error");
            const data = await response.json();
            
            let nodes = {};
            data.elements.forEach(el => { if (el.type === 'node') nodes[el.id] = [el.lon, el.lat]; });
            
            buildingsGeoJSON.features = [];
            physicsBuildings = [];
            
            data.elements.forEach((el, index) => {
                if (el.type === 'way' && el.tags && el.tags.building) {
                    let coords = el.nodes.map(n => nodes[n]).filter(c => c);
                    if (coords.length > 2) {
                        if (coords[0][0] !== coords[coords.length-1][0] || coords[0][1] !== coords[coords.length-1][1]) {
                            coords.push([...coords[0]]); // Assicura chiusura poligono
                        }
                        
                        let height = el.tags.height ? parseFloat(el.tags.height) : (el.tags['building:levels'] ? parseInt(el.tags['building:levels']) * 3.5 : 8);
                        let uniqueId = Date.now() + index;
                        let baseZ = map.queryTerrainElevation(coords[0]) || map.queryTerrainElevation(antennaPos) || 0;

                        buildingsGeoJSON.features.push({
                            type: 'Feature',
                            properties: { id: uniqueId, height: height, base_z: baseZ },
                            geometry: { type: 'Polygon', coordinates: [coords] }
                        });
                        
                        physicsBuildings.push({
                            id: uniqueId,
                            coords: coords,
                            height: height,
                            base_z: baseZ
                        });
                    }
                }
            });
            
            map.getSource('buildings-src').setData(buildingsGeoJSON);
            document.getElementById('status-log').innerText = `Estratti ${buildingsGeoJSON.features.length} edifici (R: ${radius}m).`;
            
        } catch (error) {
            console.error(error);
            alert("Errore Server OpenStreetMap. I nodi potrebbero essere sovraccarichi.");
        } finally {
            btn.innerHTML = '<i class="fa-solid fa-city"></i> 1. Estrai Edifici OSM';
            btn.disabled = false;
        }
    }

    function latLonToCartesian(lng, lat, originLng, originLat) {
        const x = (lng - originLng) * (Math.PI / 180) * EARTH_RADIUS * Math.cos(originLat * Math.PI / 180);
        const y = (lat - originLat) * (Math.PI / 180) * EARTH_RADIUS;
        return [x, y];
    }

    function cartesianToLatLon(x, y, originLng, originLat) {
        const lat = originLat + (y / EARTH_RADIUS) * (180 / Math.PI);
        const lng = originLng + (x / (EARTH_RADIUS * Math.cos(originLat * Math.PI / 180))) * (180 / Math.PI);
        return [lng, lat];
    }

    function getSegmentIntersection(rx, ry, dx, dy, x1, y1, x2, y2) {
        const sx = x2 - x1;
        const sy = y2 - y1;
        const cross = dx * sy - dy * sx;
        if (Math.abs(cross) < 1e-8) return null; // Parallele
        
        const diffX = x1 - rx;
        const diffY = y1 - ry;
        
        const t = (diffX * sy - diffY * sx) / cross; // Frazione sul raggio (0-1)
        const u = (diffX * dy - diffY * dx) / cross; // Frazione sul muro (0-1)
        
        if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
            return t; 
        }
        return null;
    }

    window.calcolaCopertura = function() {
        if (!antennaPos) { alert("Posiziona l'antenna per iniziare!"); return; }

        const btn = document.getElementById('btn-calc');
        btn.innerHTML = '<i class="fa-solid fa-circle-notch loading-spin"></i> Geometria in corso...';
        btn.disabled = true;

        // Yield al browser per l'aggiornamento UI
        setTimeout(() => {
            const hAnt = parseFloat(document.getElementById('inp-h-ant').value) || 0;
            const elevDeg = parseFloat(document.getElementById('inp-angle').value) || 0;
            const maxDist = parseFloat(document.getElementById('inp-dist').value) || 3000;
            
            const elevRad = elevDeg * (Math.PI / 180);
            const tanElev = Math.tan(elevRad);
            const antennaBaseZ = map.queryTerrainElevation(antennaPos) || 0;
            
            // 1. Spazio cartesiano locale per precisione millimetrica sulle intersezioni
            const cartesianBuildings = physicsBuildings.map(b => {
                const cCoords = b.coords.map(pt => latLonToCartesian(pt[0], pt[1], antennaPos[0], antennaPos[1]));
                return { ...b, cCoords: cCoords };
            });

            let coveragePolygon = [];

            // 2. Sweep RADAR 360 Gradi
            for (let az = 0; az < 360; az++) {
                const azRad = az * (Math.PI / 180);
                const rayDx = maxDist * Math.sin(azRad);
                const rayDy = maxDist * Math.cos(azRad);

                let minDistFraction = 1.0; 

                // FASE 1: Intersezioni analitiche esatte con i perimetri degli edifici
                for (let b of cartesianBuildings) {
                    for (let i = 0; i < b.cCoords.length - 1; i++) {
                        let p1 = b.cCoords[i];
                        let p2 = b.cCoords[i+1];
                        
                        let t = getSegmentIntersection(0, 0, rayDx, rayDy, p1[0], p1[1], p2[0], p2[1]);
                        
                        if (t !== null && t < minDistFraction) {
                            let impactDist = t * maxDist;
                            let impactLngLat = cartesianToLatLon(rayDx * t, rayDy * t, antennaPos[0], antennaPos[1]);
                            
                            let bldgTerrainZ = map.queryTerrainElevation(impactLngLat);
                            if (bldgTerrainZ === null) bldgTerrainZ = antennaBaseZ; 
                            
                            // Analisi Z (Altitudine) all'esatto punto d'impatto 2D
                            let rayZ = antennaBaseZ + hAnt + (impactDist * tanElev);
                            let bldgTopZ = bldgTerrainZ + b.height;

                            if (rayZ <= bldgTopZ) {
                                // Muro invalicabile. Registriamo il nuovo limite.
                                minDistFraction = t;
                            }
                        }
                    }
                }

                // FASE 2: Verifica orografica continua (Terreno) fino al muro più vicino
                let maxWalkDist = minDistFraction * maxDist;
                let finalDist = maxWalkDist;
                const stepTerrain = 20; // 20m resolution per il terreno
                
                for (let d = stepTerrain; d <= maxWalkDist; d += stepTerrain) {
                    let cx = (d / maxDist) * rayDx;
                    let cy = (d / maxDist) * rayDy;
                    let cLngLat = cartesianToLatLon(cx, cy, antennaPos[0], antennaPos[1]);
                    
                    let terrainZ = map.queryTerrainElevation(cLngLat);
                    if (terrainZ === null) terrainZ = antennaBaseZ;

                    let rayZ = antennaBaseZ + hAnt + d * tanElev;
                    
                    if (rayZ <= terrainZ) {
                        // Sbatte contro la montagna
                        finalDist = d;
                        break;
                    }
                }

                let fX = (finalDist / maxDist) * rayDx;
                let fY = (finalDist / maxDist) * rayDy;
                coveragePolygon.push(cartesianToLatLon(fX, fY, antennaPos[0], antennaPos[1]));
            }

            // Chiusura Poligono Geometrico
            coveragePolygon.push([...coveragePolygon[0]]);

            map.getSource('coverage-src').setData({
                type: 'FeatureCollection',
                features: [{
                    type: 'Feature',
                    geometry: { type: 'Polygon', coordinates: [coveragePolygon] },
                    properties: {}
                }]
            });

            document.getElementById('status-log').innerText = `Analisi viewshed completata (R: ${maxDist}m)`;
            btn.innerHTML = '<i class="fa-solid fa-radar"></i> 2. Calcola Copertura';
            btn.disabled = false;
            
        }, 50); 
    };
</script>

</body>
</html>
