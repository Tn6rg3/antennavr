<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore RF 3D - Ostacoli e Antenna Fisica</title>
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #000; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; cursor: crosshair; }
        
        #ui-panel {
            position: absolute; top: 10px; left: 10px; width: 340px; max-height: 95vh; overflow-y: auto;
            background: rgba(15, 15, 15, 0.9); color: #fff;
            padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333; z-index: 10;
        }
        
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #4CAF50; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        label { display: block; margin-top: 10px; font-size: 13px; color: #bbb; font-weight: bold;}
        select, input, button {
            width: 100%; margin-top: 4px; padding: 8px; box-sizing: border-box;
            background: #222; color: white; border: 1px solid #555; border-radius: 6px; font-size: 14px;
        }
        
        .flex-row { display: flex; gap: 10px; }
        .flex-row div { flex: 1; }
        
        button.azione { background: #4CAF50; border: none; font-weight: bold; cursor: pointer; margin-top: 15px;}
        button.azione:hover { background: #45a049; }
        button#btn-edifici { background: #008CBA; margin-top: 15px;}
        button#btn-edifici:hover { background: #007B9E; }
        button:disabled { background: #555 !important; cursor: not-allowed; }
        
        .info { font-size: 12px; color: #ffd700; margin-top: 15px; line-height: 1.4; font-weight: bold; background: rgba(255,215,0,0.1); padding: 8px; border-radius: 5px; border-left: 3px solid #ffd700;}
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-panel">
    <h2>📡 Simulatore RF Interattivo</h2>
    
    <div class="info">👇 1. Clicca in un punto qualsiasi sulla mappa per posizionare l'antenna.</div>
    
    <label>Tipo di Antenna</label>
    <select id="antenna" onchange="aggiornaAntenna()">
        <option value="vertical">Verticale (Ground Plane)</option>
        <option value="dipole">Dipolo a V (Filare)</option>
    </select>
    
    <div class="flex-row">
        <div>
            <label>Altezza da terra (m)</label>
            <input type="number" id="h-base" value="5" min="0" onchange="aggiornaAntenna()">
        </div>
        <div>
            <label>Lunghezza radiatore (m)</label>
            <input type="number" id="l-radiatore" value="10" min="1" onchange="aggiornaAntenna()">
        </div>
    </div>
    
    <button id="btn-edifici" onclick="caricaEdifici()">2. Estrai Edifici 3D (Ostacoli)</button>
    <button class="azione" onclick="avviaSimulazione()">3. Genera Onde (CW Ray-Tracing)</button>
</div>

<script>
    // Configurazione Mappa
    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: { 'satellite': { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256 } },
            layers: [{ id: 'sat-layer', type: 'raster', source: 'satellite' }]
        },
        center: [11.2366, 46.0655], // Pergine
        zoom: 16, pitch: 70, bearing: -30
    });

    let antennaPos = null;
    let edificiPoligoni = []; // Array per motore di collisione
    let animationId = null;

    map.on('load', () => {
        // Terreno
        map.addSource('terrain', { type: 'raster-dem', tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256 });
        map.setTerrain({ source: 'terrain', exaggeration: 1.2 });

        // Layer Ostacoli (Edifici)
        map.addSource('buildings', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': '3d-buildings', 'source': 'buildings', 'type': 'fill-extrusion',
            'paint': { 'fill-extrusion-color': '#e0e0e0', 'fill-extrusion-height': ['get', 'height'], 'fill-extrusion-opacity': 0.8 }
        });

        // Layer Componenti Antenna Fisica (Palo + Radiatore)
        map.addSource('antenna-3d', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': 'antenna-struttura', 'source': 'antenna-3d', 'type': 'fill-extrusion',
            'paint': { 'fill-extrusion-color': ['get', 'color'], 'fill-extrusion-base': ['get', 'base'], 'fill-extrusion-height': ['get', 'height'], 'fill-extrusion-opacity': 1 }
        });

        // Layer Onde Radio
        map.addSource('radio-waves', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': 'waves-layer', 'source': 'radio-waves', 'type': 'line',
            'paint': { 'line-color': ['get', 'color'], 'line-width': 2, 'line-opacity': 0.6 }
        });
    });

    // 1. POSIZIONAMENTO CON CLICK
    map.on('click', (e) => {
        antennaPos = [e.lngLat.lng, e.lngLat.lat];
        aggiornaAntenna();
    });

    // UTILITY: Crea un quadratino (poligono) per simulare un cilindro/palo in 3D
    function creaPoligonoPalo(center, raggioMetri) {
        const rad = raggioMetri / 111000; // Approssimazione gradi
        return [
            [center[0]-rad, center[1]-rad], [center[0]+rad, center[1]-rad],
            [center[0]+rad, center[1]+rad], [center[0]-rad, center[1]+rad], [center[0]-rad, center[1]-rad]
        ];
    }

    // UTILITY: Crea un rettangolo lungo per le braccia del dipolo
    function creaBraccioDipolo(center, angolo, lunghezzaMetri) {
        const radLen = lunghezzaMetri / 111000;
        const radSpessore = 0.5 / 111000;
        let p1 = [center[0], center[1]];
        let p2 = [center[0] + Math.cos(angolo)*radLen, center[1] + Math.sin(angolo)*radLen];
        // Semplificazione: poligono stretto
        return [
            [p1[0], p1[1]-radSpessore], [p2[0], p2[1]-radSpessore],
            [p2[0], p2[1]+radSpessore], [p1[0], p1[1]+radSpessore], [p1[0], p1[1]-radSpessore]
        ];
    }

    // 2. MODELLAZIONE 3D DELL'ANTENNA
    function aggiornaAntenna() {
        if (!antennaPos) return;

        const tipo = document.getElementById('antenna').value;
        const hBase = parseFloat(document.getElementById('h-base').value);
        const lRad = parseFloat(document.getElementById('l-radiatore').value);

        let features = [];

        // Il palo di supporto (sempre presente)
        if (hBase > 0) {
            features.push({
                type: 'Feature', properties: { color: '#888888', base: 0, height: hBase },
                geometry: { type: 'Polygon', coordinates: [creaPoligonoPalo(antennaPos, 0.5)] }
            });
        }

        if (tipo === 'vertical') {
            // Stilo verticale sopra il palo
            features.push({
                type: 'Feature', properties: { color: '#ff3300', base: hBase, height: hBase + lRad },
                geometry: { type: 'Polygon', coordinates: [creaPoligonoPalo(antennaPos, 0.3)] }
            });
        } else if (tipo === 'dipole') {
            // Braccia orizzontali del dipolo
            features.push({
                type: 'Feature', properties: { color: '#ff3300', base: hBase, height: hBase + 0.2 },
                geometry: { type: 'Polygon', coordinates: [creaBraccioDipolo(antennaPos, 0, lRad/2)] } // Braccio Destro
            });
            features.push({
                type: 'Feature', properties: { color: '#ff3300', base: hBase, height: hBase + 0.2 },
                geometry: { type: 'Polygon', coordinates: [creaBraccioDipolo(antennaPos, Math.PI, lRad/2)] } // Braccio Sinistro
            });
        }

        map.getSource('antenna-3d').setData({ type: 'FeatureCollection', features: features });
    }

    // 3. ESTRAZIONE EDIFICI E PREPARAZIONE MOTORE COLLISIONI
    async function caricaEdifici() {
        if (!antennaPos) { alert("Clicca prima sulla mappa per posizionare l'antenna!"); return; }
        
        const btn = document.getElementById('btn-edifici');
        btn.innerText = "⏳ Download in corso..."; btn.disabled = true;

        const query = `[out:json];(way["building"](around:600, ${antennaPos[1]}, ${antennaPos[0]});relation["building"](around:600, ${antennaPos[1]}, ${antennaPos[0]}););out body; >; out skel qt;`;
        
        try {
            const response = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query });
            const data = await response.json();
            
            let features = [];
            edificiPoligoni = []; // Reset collision array
            let nodes = {};
            
            data.elements.forEach(el => { if (el.type === 'node') nodes[el.id] = [el.lon, el.lat]; });
            
            data.elements.forEach(el => {
                if (el.type === 'way' && el.tags && el.tags.building) {
                    let coords = el.nodes.map(n => nodes[n]).filter(c => c);
                    if (coords.length > 2) {
                        if (coords[0] !== coords[coords.length-1]) coords.push(coords[0]); 
                        let height = el.tags.height ? parseFloat(el.tags.height) : (el.tags['building:levels'] ? parseInt(el.tags['building:levels']) * 3.5 : 8);
                        
                        features.push({
                            type: 'Feature', properties: { height: height },
                            geometry: { type: 'Polygon', coordinates: [coords] }
                        });
                        
                        // Aggiunge al motore di collisione
                        edificiPoligoni.push({ coords: coords, height: height });
                    }
                }
            });
            
            map.getSource('buildings').setData({ type: 'FeatureCollection', features: features });
            btn.innerText = `✅ Caricati ${features.length} Ostacoli`;
        } catch (e) {
            console.error(e);
            alert("Errore nel download edifici. Riprova.");
            btn.innerText = "2. Estrai Edifici 3D";
        } finally {
            btn.disabled = false;
        }
    }

    // UTILITY MOTORE FISICO: Controllo se un punto è dentro un poligono (Ray-Polygon intersection 2D)
    function isInPolygon(point, vs) {
        let x = point[0], y = point[1];
        let inside = false;
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
            let xi = vs[i][0], yi = vs[i][1];
            let xj = vs[j][0], yj = vs[j][1];
            let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    // 4. SIMULAZIONE PROPAGAZIONE CON COLLISIONI REALI
    function avviaSimulazione() {
        if (!antennaPos) { alert("Posiziona l'antenna cliccando sulla mappa!"); return; }
        if (animationId) cancelAnimationFrame(animationId);

        // Pre-calcolo di 360 raggi (Fronte d'onda completo)
        let rays = [];
        for (let i = 0; i < 360; i += 2) { // Un raggio ogni 2 gradi
            rays.push({
                angle: i * (Math.PI / 180),
                path: [antennaPos], // Partono dall'antenna
                hit: false // Stato collisione
            });
        }

        let timeStep = 0;
        const maxSteps = 100; // Distanza massima visiva

        function animazione() {
            if (timeStep >= maxSteps) return; // Fine simulazione
            timeStep++;

            let features = [];
            
            rays.forEach(ray => {
                if (!ray.hit) {
                    // Avanza il raggio
                    let lastPoint = ray.path[ray.path.length - 1];
                    let stepSize = 0.0001; // circa 10 metri a step
                    let nextLon = lastPoint[0] + Math.cos(ray.angle) * stepSize;
                    let nextLat = lastPoint[1] + Math.sin(ray.angle) * stepSize;
                    let nextPoint = [nextLon, nextLat];
                    
                    // COLLISION ENGINE: Controlla se la nuova posizione entra in un edificio
                    let collision = false;
                    for(let i = 0; i < edificiPoligoni.length; i++) {
                        // Se l'antenna è più bassa dell'edificio e sbatte
                        let hAntenna = parseFloat(document.getElementById('h-base').value) + parseFloat(document.getElementById('l-radiatore').value)/2;
                        if (edificiPoligoni[i].height > hAntenna) {
                            if (isInPolygon(nextPoint, edificiPoligoni[i].coords)) {
                                collision = true; break;
                            }
                        }
                    }

                    if (collision) {
                        ray.hit = true; // Il raggio si ferma contro il muro
                    } else {
                        ray.path.push(nextPoint);
                    }
                }

                // Disegna la traccia del raggio fino a dove è arrivato
                if (ray.path.length > 1) {
                    features.push({
                        type: 'Feature',
                        properties: { color: '#00ffff' }, // Colore onda di terra
                        geometry: { type: 'LineString', coordinates: ray.path }
                    });
                }
            });

            map.getSource('radio-waves').setData({ type: 'FeatureCollection', features: features });
            animationId = requestAnimationFrame(animazione);
        }

        // Resetta i dati precedenti e lancia l'animazione
        map.getSource('radio-waves').setData({ type: 'FeatureCollection', features: [] });
        animazione();
    }
</script>

</body>
</html>
