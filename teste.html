<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D RF Coverage & Viewshed Simulator</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; cursor: crosshair; }
        
        /* Dark Theme UI Panel */
        #ui-panel {
            position: absolute; top: 15px; left: 15px; width: 340px; max-height: 95vh; overflow-y: auto;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); color: #e2e8f0; z-index: 10;
        }
        
        input[type="number"] {
            background: rgba(30, 41, 59, 0.9); border: 1px solid #475569;
            color: #f8fafc; border-radius: 6px; padding: 8px; width: 100%;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus { outline: none; border-color: #38bdf8; }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 3px; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-panel" class="p-5 flex flex-col gap-4">
    <h2 class="text-lg font-bold text-sky-400 border-b border-slate-700 pb-2">📡 3D RF Simulator</h2>
    
    <div class="bg-sky-900/40 border-l-2 border-sky-500 p-2 text-xs text-sky-200 rounded shadow-inner leading-relaxed">
        <b>Instructions:</b><br>
        1. Click map to place antenna.<br>
        2. Click a building to change its height.
    </div>

    <div class="space-y-3 text-sm">
        <div>
            <label class="block text-slate-300 font-semibold mb-1 text-xs uppercase">Antenna Height (m)</label>
            <input type="number" id="inp-ant-height" value="10" min="0" step="1">
        </div>
        
        <div>
            <label class="block text-slate-300 font-semibold mb-1 text-xs uppercase">Elevation Angle (degrees)</label>
            <input type="number" id="inp-elev-angle" value="5" min="0" max="89" step="1">
        </div>

        <div>
            <label class="block text-slate-300 font-semibold mb-1 text-xs uppercase">Max Simulation Distance (m)</label>
            <input type="number" id="inp-max-dist" value="3000" min="100" step="100">
        </div>

        <div>
            <label class="block text-slate-300 font-semibold mb-1 text-xs uppercase text-amber-300">Building Fetch Radius (m)</label>
            <input type="number" id="inp-fetch-radius" value="500" min="100" max="5000" step="100">
        </div>
    </div>

    <div class="flex flex-col gap-2 mt-2">
        <button id="btn-load-bldgs" onclick="fetchBuildings()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded transition-colors shadow-lg disabled:bg-slate-700">
            Load Buildings (OSM)
        </button>

        <button id="btn-calc-cov" onclick="calculateCoverage()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded transition-colors shadow-lg disabled:bg-slate-700">
            Calculate RF Coverage
        </button>
    </div>
</div>

<script>
    // --- State Variables ---
    let antennaPos = null; // {lng, lat}
    let antennaMarker = null;
    let buildingsGeoJSON = { type: 'FeatureCollection', features: [] };
    let physicsBuildings = []; // Optimized array for ray-casting collision

    // --- MapLibre Initialization ---
    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: {
                'esri-satellite': {
                    type: 'raster',
                    tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                    tileSize: 256
                }
            },
            layers: [{ id: 'sat-layer', type: 'raster', source: 'esri-satellite' }]
        },
        center: [11.240, 46.061], // Pergine Valsugana
        zoom: 14.5,
        pitch: 65,
        bearing: -15
    });

    map.on('load', () => {
        // Add 3D Terrain DEM
        map.addSource('aws-terrain', {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            encoding: 'terrarium',
            tileSize: 256
        });
        map.setTerrain({ source: 'aws-terrain', exaggeration: 1.2 });

        // Add Buildings Layer
        map.addSource('buildings-src', { type: 'geojson', data: buildingsGeoJSON });
        map.addLayer({
            'id': '3d-buildings',
            'type': 'fill-extrusion',
            'source': 'buildings-src',
            'paint': {
                'fill-extrusion-color': '#e2e8f0', // Light gray
                'fill-extrusion-height': ['get', 'height'],
                'fill-extrusion-opacity': 0.85
            }
        });

        // Add Coverage Footprint Layer
        map.addSource('coverage-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': 'coverage-layer',
            'type': 'fill',
            'source': 'coverage-src',
            'paint': {
                'fill-color': '#ef4444', // Red
                'fill-opacity': 0.5,
                'fill-outline-color': '#fca5a5'
            }
        });

        // Setup Cursor for Building interactions
        map.on('mouseenter', '3d-buildings', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', '3d-buildings', () => map.getCanvas().style.cursor = 'crosshair');
    });

    // --- Interaction Handlers ---
    map.on('click', (e) => {
        // Check if we clicked on a building first
        const features = map.queryRenderedFeatures(e.point, { layers: ['3d-buildings'] });
        
        if (features.length > 0) {
            handleBuildingClick(features[0]);
            return; // Stop execution to prevent placing antenna on building click
        }

        // Place Antenna Marker
        antennaPos = e.lngLat;
        
        if (!antennaMarker) {
            const el = document.createElement('div');
            el.className = 'w-4 h-4 bg-sky-500 rounded-full border-2 border-white shadow-[0_0_15px_#38bdf8]';
            antennaMarker = new maplibregl.Marker({ element: el })
                .setLngLat(antennaPos)
                .addTo(map);
        } else {
            antennaMarker.setLngLat(antennaPos);
        }
        
        // Clear previous coverage when moved
        map.getSource('coverage-src').setData({ type: 'FeatureCollection', features: [] });
    });

    function handleBuildingClick(feature) {
        const id = feature.properties.id;
        const currentHeight = feature.properties.height;
        
        const userInput = prompt(`Building selected.\nCurrent height: ${currentHeight}m.\nEnter new height (m):`, currentHeight);
        
        if (userInput !== null && !isNaN(userInput) && userInput.trim() !== '') {
            const newHeight = parseFloat(userInput);
            
            // 1. Update GeoJSON Source Data
            const geoFeature = buildingsGeoJSON.features.find(f => f.properties.id === id);
            if (geoFeature) {
                geoFeature.properties.height = newHeight;
                map.getSource('buildings-src').setData(buildingsGeoJSON);
            }
            
            // 2. Update Physics Array
            const physBuilding = physicsBuildings.find(b => b.id === id);
            if (physBuilding) {
                physBuilding.height = newHeight;
            }

            // 3. Auto re-calculate coverage if antenna exists
            if (antennaPos) {
                calculateCoverage();
            }
        }
    }

    // --- Overpass API Building Fetch ---
    async function fetchBuildings() {
        if (!antennaPos) {
            alert("Click map to place antenna first.");
            return;
        }

        const btn = document.getElementById('btn-load-bldgs');
        const radius = parseFloat(document.getElementById('inp-fetch-radius').value) || 500;
        
        btn.innerText = "Fetching...";
        btn.disabled = true;

        const query = `
            [out:json][timeout:25];
            (
              way["building"](around:${radius}, ${antennaPos.lat}, ${antennaPos.lng});
              relation["building"](around:${radius}, ${antennaPos.lat}, ${antennaPos.lng});
            );
            out body; >; out skel qt;
        `;

        try {
            const response = await fetch('https://overpass-api.de/api/interpreter', {
                method: 'POST',
                body: query
            });
            if (!response.ok) throw new Error("Overpass API Error");
            
            const data = await response.json();
            
            // Process nodes
            let nodes = {};
            data.elements.forEach(el => {
                if (el.type === 'node') nodes[el.id] = [el.lon, el.lat];
            });
            
            buildingsGeoJSON.features = [];
            physicsBuildings = [];
            
            data.elements.forEach((el, index) => {
                if (el.type === 'way' && el.tags && el.tags.building) {
                    let coords = el.nodes.map(n => nodes[n]).filter(c => c);
                    if (coords.length > 2) {
                        // Close polygon
                        if (coords[0][0] !== coords[coords.length-1][0] || coords[0][1] !== coords[coords.length-1][1]) {
                            coords.push(coords[0]);
                        }
                        
                        let height = el.tags.height ? parseFloat(el.tags.height) : (el.tags['building:levels'] ? parseInt(el.tags['building:levels']) * 3.5 : 8);
                        let uniqueId = Date.now() + index; // Unique ID for editing

                        // Bounding Box for fast physics filtering
                        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                        for (let pt of coords) {
                            if (pt[0] < minX) minX = pt[0];
                            if (pt[1] < minY) minY = pt[1];
                            if (pt[0] > maxX) maxX = pt[0];
                            if (pt[1] > maxY) maxY = pt[1];
                        }

                        // Add to GeoJSON
                        buildingsGeoJSON.features.push({
                            type: 'Feature',
                            properties: { id: uniqueId, height: height },
                            geometry: { type: 'Polygon', coordinates: [coords] }
                        });
                        
                        // Add to Physics
                        physicsBuildings.push({
                            id: uniqueId,
                            coords: coords,
                            height: height,
                            bbox: { minX, minY, maxX, maxY }
                        });
                    }
                }
            });
            
            map.getSource('buildings-src').setData(buildingsGeoJSON);
            
            btn.innerText = `Loaded ${buildingsGeoJSON.features.length} Buildings`;
            setTimeout(() => btn.innerText = "Load Buildings (OSM)", 3000);
            
        } catch (error) {
            console.error(error);
            alert("Error fetching buildings. Please try again.");
            btn.innerText = "Load Buildings (OSM)";
        } finally {
            btn.disabled = false;
        }
    }

    // --- Math & Physics Utilities ---
    // Returns destination [lng, lat] given distance and heading
    function getDestination(lng, lat, distanceMeters, headingDeg) {
        const R = 6378137; // Earth Radius
        const bearing = headingDeg * Math.PI / 180;
        const lat1 = lat * Math.PI / 180;
        
        const dx = distanceMeters * Math.sin(bearing);
        const dy = distanceMeters * Math.cos(bearing);
        
        const newLat = lat + (dy / R) * (180 / Math.PI);
        const newLng = lng + (dx / (R * Math.cos(lat1))) * (180 / Math.PI);
        
        return [newLng, newLat];
    }

    // Ray-Casting Algorithm for Point in Polygon
    function pointInPolygon(point, vs) {
        let x = point[0], y = point[1];
        let inside = false;
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
            let xi = vs[i][0], yi = vs[i][1];
            let xj = vs[j][0], yj = vs[j][1];
            let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    // --- Coverage Calculation (Viewshed) ---
    function calculateCoverage() {
        if (!antennaPos) {
            alert("Click map to place antenna first.");
            return;
        }

        const btn = document.getElementById('btn-calc-cov');
        btn.innerText = "Calculating...";
        btn.disabled = true;

        // Allow UI to update before heavy synchronous loop
        setTimeout(() => {
            const antHeight = parseFloat(document.getElementById('inp-ant-height').value) || 0;
            const elevAngleDeg = parseFloat(document.getElementById('inp-elev-angle').value) || 0;
            const maxDist = parseFloat(document.getElementById('inp-max-dist').value) || 3000;
            
            const elevAngleRad = elevAngleDeg * Math.PI / 180;
            const tanElev = Math.tan(elevAngleRad);
            const stepDist = 20; // 20m resolution per step
            
            // Origin elevation
            const originElev = map.queryTerrainElevation(antennaPos) || 0;
            
            let coveragePolygon = [];

            // Shoot 360 rays
            for (let az = 0; az < 360; az++) {
                let hitLngLat = [antennaPos.lng, antennaPos.lat];
                
                for (let d = stepDist; d <= maxDist; d += stepDist) {
                    let testLngLat = getDestination(antennaPos.lng, antennaPos.lat, d, az);
                    
                    // 1. Ray absolute altitude
                    let rayAlt = originElev + antHeight + (d * tanElev);
                    
                    // 2. Terrain collision
                    let groundElev = map.queryTerrainElevation({lng: testLngLat[0], lat: testLngLat[1]}) || 0;
                    
                    // 3. Building collision
                    let buildingCollision = false;
                    for (let i = 0; i < physicsBuildings.length; i++) {
                        let b = physicsBuildings[i];
                        
                        // BBox fast check
                        if (testLngLat[0] >= b.bbox.minX && testLngLat[0] <= b.bbox.maxX && testLngLat[1] >= b.bbox.minY && testLngLat[1] <= b.bbox.maxY) {
                            // Precise polygon check
                            if (pointInPolygon(testLngLat, b.coords)) {
                                // Assume building sits on the ground at 'groundElev'
                                if (rayAlt <= groundElev + b.height) {
                                    buildingCollision = true;
                                    break;
                                }
                            }
                        }
                    }
                    
                    // Collision evaluation
                    if (rayAlt <= groundElev || buildingCollision) {
                        hitLngLat = testLngLat; // Save impact point
                        break; // Stop ray
                    }
                    
                    // Update furthest valid point
                    hitLngLat = testLngLat;
                }
                
                coveragePolygon.push(hitLngLat);
            }
            
            // Close the polygon
            coveragePolygon.push(coveragePolygon[0]);
            
            // Render Coverage
            map.getSource('coverage-src').setData({
                type: 'FeatureCollection',
                features: [{
                    type: 'Feature',
                    geometry: { type: 'Polygon', coordinates: [coveragePolygon] },
                    properties: {}
                }]
            });

            btn.innerText = "Calculate RF Coverage";
            btn.disabled = false;
            
        }, 50); // slight timeout for UI render
    }
</script>

</body>
</html>
