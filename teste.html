<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore RF 3D - Vista Satellitare</title>
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #000; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        #ui-panel {
            position: absolute; top: 10px; left: 10px; width: 340px;
            background: rgba(15, 15, 15, 0.9); color: #fff;
            padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333; z-index: 10;
        }
        
        h2 { margin: 0 0 15px 0; font-size: 18px; color: #4CAF50; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        label { display: block; margin-top: 10px; font-size: 13px; color: #bbb; font-weight: bold;}
        select, input, button {
            width: 100%; margin-top: 5px; padding: 10px; box-sizing: border-box;
            background: #222; color: white; border: 1px solid #555; border-radius: 6px; font-size: 14px;
        }
        button.azione { background: #4CAF50; border: none; font-weight: bold; cursor: pointer; margin-top: 10px;}
        button.azione:hover { background: #45a049; }
        button#btn-edifici { background: #008CBA; margin-top: 20px;}
        button#btn-edifici:hover { background: #007B9E; }
        button:disabled { background: #555 !important; cursor: not-allowed; }
        
        .info { font-size: 12px; color: #ffd700; margin-top: 15px; line-height: 1.4; font-weight: bold;}
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-panel">
    <h2>📡 Simulatore RF - Terreno 3D</h2>
    
    <label>Coordinate (Long, Lat)</label>
    <input type="text" id="coords" value="11.2366, 46.0655"> <!-- Pergine -->
    
    <label>Antenna (Simulazione)</label>
    <select id="antenna">
        <option value="dipole">Dipolo 40m (NVIS - Onde verso l'alto)</option>
        <option value="vertical">Verticale (DX - Onde radenti al suolo)</option>
    </select>
    
    <button id="btn-edifici" onclick="caricaEdifici()">1. Estrai Edifici 3D reali</button>
    <button class="azione" onclick="avviaSimulazione()">2. Avvia Trasmissione Radio</button>

    <div class="info">⚠️ ISTRUZIONI:<br>Tieni premuto il TASTO DESTRO del mouse e muovilo per inclinare la telecamera e vedere le montagne in 3D!</div>
</div>

<script>
    // Stile Mappa: Usiamo il satellite di ESRI per vedere bene le montagne
    const styleSatellitare = {
        version: 8,
        sources: {
            'satellite': {
                type: 'raster',
                tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                tileSize: 256
            }
        },
        layers: [{
            id: 'satellite-layer',
            type: 'raster',
            source: 'satellite'
        }]
    };

    const map = new maplibregl.Map({
        container: 'map',
        style: styleSatellitare,
        center: [11.2366, 46.0655],
        zoom: 13,
        pitch: 65, // Inclinato per il 3D
        bearing: -30
    });

    let animationId = null;

    map.on('load', () => {
        // 1. CARICAMENTO MORFOLOGIA DEL TERRENO (Montagne)
        map.addSource('terrain', {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            encoding: 'terrarium',
            tileSize: 256
        });
        // Esageriamo l'altezza del terreno di 1.5 volte per renderlo ben visibile
        map.setTerrain({ source: 'terrain', exaggeration: 1.5 });

        // 2. LAYER PER GLI EDIFICI 3D (Inizialmente vuoto)
        map.addSource('buildings', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': '3d-buildings',
            'source': 'buildings',
            'type': 'fill-extrusion',
            'paint': {
                'fill-extrusion-color': '#ffffff', // Bianchi per risaltare sul verde del satellite
                'fill-extrusion-height': ['get', 'height'],
                'fill-extrusion-opacity': 0.7
            }
        });

        // 3. LAYER PER LE ONDE RADIO
        map.addSource('radio-waves', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
            'id': 'waves-layer',
            'type': 'line',
            'source': 'radio-waves',
            'paint': {
                'line-color': ['get', 'color'],
                'line-width': ['get', 'width'],
                'line-opacity': 0.9
            }
        });
    });

    // FUNZIONE DI SCARICAMENTO EDIFICI REALI
    async function caricaEdifici() {
        const btn = document.getElementById('btn-edifici');
        btn.innerText = "⏳ Collegamento ai satelliti OSM...";
        btn.disabled = true;

        const coordsStr = document.getElementById('coords').value.split(',');
        const lon = parseFloat(coordsStr[0].trim());
        const lat = parseFloat(coordsStr[1].trim());

        // Ricerca mirata di edifici nel raggio di 800 metri (molto più stabile e veloce)
        const query = `[out:json][timeout:25];(way["building"](around:800, ${lat}, ${lon});relation["building"](around:800, ${lat}, ${lon}););out body; >; out skel qt;`;
        
        try {
            const response = await fetch('https://overpass-api.de/api/interpreter', {
                method: 'POST',
                body: query
            });
            
            if (!response.ok) throw new Error("Errore API");
            const data = await response.json();
            
            let features = [];
            let nodes = {};
            // Mappa i nodi per creare i contorni
            data.elements.forEach(el => { if (el.type === 'node') nodes[el.id] = [el.lon, el.lat]; });
            
            // Crea i poligoni 3D
            data.elements.forEach(el => {
                if (el.type === 'way' && el.tags && el.tags.building) {
                    let coords = el.nodes.map(n => nodes[n]).filter(c => c);
                    if (coords.length > 2) {
                        if (coords[0] !== coords[coords.length-1]) coords.push(coords[0]); 
                        let height = el.tags.height ? parseFloat(el.tags.height) : (el.tags['building:levels'] ? parseInt(el.tags['building:levels']) * 3.5 : 8);
                        features.push({
                            type: 'Feature',
                            properties: { height: height },
                            geometry: { type: 'Polygon', coordinates: [coords] }
                        });
                    }
                }
            });
            
            map.getSource('buildings').setData({ type: 'FeatureCollection', features: features });
            
            // Avvicina la camera per vedere i palazzi in mezzo alla valle
            map.flyTo({ center: [lon, lat], zoom: 15.5, pitch: 70, duration: 2500 });
            
            btn.innerText = `✅ Trovati ${features.length} edifici!`;
        } catch (e) {
            console.error(e);
            alert("Non è stato possibile caricare gli edifici. Forse l'API di OpenStreetMap è sovraccarica. Riprova tra un minuto.");
            btn.innerText = "1. Estrai Edifici 3D reali";
        } finally {
            btn.disabled = false;
        }
    }

    // FUNZIONE DI ANIMAZIONE DELLE ONDE RADIO
    function avviaSimulazione() {
        if (animationId) cancelAnimationFrame(animationId);

        const coordsStr = document.getElementById('coords').value.split(',');
        const origin = [parseFloat(coordsStr[0].trim()), parseFloat(coordsStr[1].trim())];
        const antenna = document.getElementById('antenna').value;

        let waves = [];
        let time = 0;
        const raggioAzione = 0.02; // Lunghezza del raggio prima di ricominciare

        // Creazione di 36 raggi concentrici (uno ogni 10 gradi)
        for (let i = 0; i < 36; i++) {
            const angle = (i * 10) * (Math.PI / 180);
            
            // Se NVIS (dipolo) mostriamo onde rosse (simulazione ionosferica)
            if (antenna === 'dipole' || i % 3 === 0) {
                waves.push({ angle: angle, speed: 0.0003, color: '#ff3333', type: 'sky' });
            }
            // Onde azzurre di superficie (Groundwave)
            if (antenna === 'vertical' || i % 2 === 0) {
                waves.push({ angle: angle, speed: 0.00015, color: '#00ffff', type: 'ground' });
            }
        }

        function animazione() {
            time += 1;
            let features = [];
            
            waves.forEach(wave => {
                let dInizio = (time * wave.speed) % raggioAzione;
                let coords = [];
                // Disegna il segmento animato
                for (let j = 0; j < 10; j++) {
                    let d = dInizio - (j * 0.001); 
                    if (d > 0) {
                        let lon = origin[0] + Math.cos(wave.angle) * d;
                        let lat = origin[1] + Math.sin(wave.angle) * d;
                        coords.push([lon, lat]);
                    }
                }
                if (coords.length > 1) {
                    features.push({
                        type: 'Feature',
                        properties: { color: wave.color, width: wave.type === 'sky' ? 4 : 2 },
                        geometry: { type: 'LineString', coordinates: coords }
                    });
                }
            });
            
            map.getSource('radio-waves').setData({ type: 'FeatureCollection', features: features });
            animationId = requestAnimationFrame(animazione);
        }
        
        animazione();
    }
</script>

</body>
</html>
