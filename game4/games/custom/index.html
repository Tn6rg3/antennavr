<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CW Custom Mode</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="mainContainer" class="screen active-screen">
    <div id="setupArea" style="display:flex; flex-direction:column; width:100%; gap:10px;">
        <h3>Personalizza Esercitazione</h3>
        <label>Testo da trasmettere:</label>
        <textarea id="customText" placeholder="Scrivi qui le parole o il testo..." style="height:150px; width:100%; border-radius:8px; padding:10px; box-sizing:border-box;"></textarea>
        <label>Velocità (WPM):</label>
        <input type="number" id="wpmInput" value="20" style="width:100%; padding:10px; border-radius:8px; box-sizing:border-box;">
        <button id="startGameBtn" class="btn-success">Inizia</button>
        <button id="exitBtn" class="btn-danger">Torna al Menu</button>
    </div>

    <div id="gameAreaBody" style="display:none; flex-direction:column; width:100%; height:100%;">
        <div class="table-wrapper" id="tableWrapper">
            <table id="gameTable">
                <thead><tr><th>Scritto</th><th>Reale</th><th>Esito</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div style="display:flex; gap:6px; width:100%; box-sizing:border-box; align-items:center; margin-bottom:5px;">
            <input type="text" id="permanentGameInput" placeholder="Digita..." autocomplete="off">
            <button id="replayWordBtn" class="btn-secondary" style="width:auto; margin:0; padding:10px 14px;">🔁</button>
        </div>
        <button id="quitGameBtn" class="btn-danger">Interrompi</button>
    </div>
</div>
<script src="../../common/init.js"></script>
<script src="../../common/i18n.js"></script>
<script src="../../common/logic.js"></script>
<script src="../../common/audio.js"></script>
<script src="game.js"></script>
</body>
</html>
