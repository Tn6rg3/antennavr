<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CW Transmission Mode</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameArea" class="screen active-screen">
    <div class="header-stats">
        <div>Pratica Trasmissione</div>
    </div>

    <div id="targetDisplay" style="font-size: 2.5em; font-family: monospace; letter-spacing: 5px; margin: 30px 0; background: rgba(0,0,0,0.05); padding: 20px; border-radius: 8px; width: 100%; text-align: center; box-sizing: border-box;">
        PREMI INIZIA
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
        <div id="morseKeyBtn" style="width: 150px; height: 150px; background-color: var(--btn-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer; user-select: none; transition: transform 0.1s;">
            TASTO
        </div>
        <div style="margin-top: 20px; font-style: italic; color: var(--hint-color);">Trasmetti i caratteri evidenziati</div>
    </div>

    <div style="display:flex; gap:5px; width:100%; margin-top: 20px;">
        <button id="startGameBtn" class="btn-success">Inizia</button>
        <button id="quitGameBtn" class="btn-danger">Esci</button>
    </div>
</div>
<script src="../../common/init.js?v=20260822_1"></script>
<script src="../../common/i18n.js?v=20260822_1"></script>
<script src="../../common/logic.js?v=20260822_1"></script>
<script src="../../common/audio.js?v=20260822_1"></script>
<script src="game.js?v=20260822_1"></script>
</body>
</html>
