<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Morse Standard - Modular</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

<div id="toastContainer"></div>

<!-- LOBBY GIOCO MULTIPLAYER -->
<div id="lobbyScreen" class="screen active-screen">
    <h2 id="lobbyTitleText">Lobby Stanza</h2>
    <p id="lobbyTimerText" style="text-align: center; font-weight: bold; color: #ff9800; margin-top: 2px; margin-bottom: 5px;"></p>

    <div class="box-panel" style="flex-shrink:0; margin-bottom:5px;">
        <h3 id="txt_lobby_players" style="margin:0 0 5px 0; font-size:0.9em;">Giocatori presenti:</h3>
        <ul id="playersList" class="data-list" style="max-height: 80px;"></ul>
    </div>

    <div class="box-panel" style="flex-grow:1; min-height:0; display:flex; flex-direction:column; padding:5px; margin-bottom:5px;">
        <h3 id="txt_lobby_chat_title" style="margin-bottom:2px; font-size:0.9em; color:var(--hint-color);">💬 Chat di Stanza</h3>
        <div id="lobbyChatMessages" style="flex-grow:1; overflow-y:auto; font-size:0.85em; padding:5px; background:var(--bg-color); border-radius:6px; margin-bottom:5px;"></div>
        <div style="display:flex; gap:6px; width:100%; box-sizing:border-box; align-items:center;">
            <input type="text" id="lobbyChatInput" placeholder="Messaggio..." style="flex: 1 1 auto; min-width: 0; padding:8px; margin:0;">
            <button id="sendLobbyChatBtn" style="width:auto; padding:8px 14px; margin:0; flex-shrink:0;">Invia</button>
        </div>
    </div>

    <div style="margin-top: 0; width: 100%; flex-shrink: 0;">
        <p id="statusInfoText" style="text-align: center; color: var(--hint-color); font-style: italic; margin-bottom: 5px; font-size: 0.85em;">Verifica ruolo...</p>
        <button id="readyBtn" style="display:none;" class="btn-success">SONO PRONTO ✅</button>
        <button id="startMultiplayerBtn" style="display:none;" class="btn-success">AVVIA PARTITA</button>
        <button id="leaveLobbyBtn" class="btn-secondary" style="margin-top: 5px; padding:8px;">Esci dalla Stanza</button>
    </div>
</div>

<!-- COUNTDOWN -->
<div id="countdownScreen" class="screen">
    <h2 id="txt_prepare" style="margin-top: auto;">Preparati!</h2>
    <div id="countdownNumber">3</div>
    <div style="margin-top: auto;"></div>
</div>

<!-- AREA GIOCO PRINCIPALE -->
<div id="gameArea" class="screen">
    <div class="header-stats">
        <div id="wpmDisplay">WPM: 20</div>
        <div id="scoreDisplay">Punti: 0</div>
    </div>

    <div class="table-wrapper" id="tableWrapper">
        <table id="gameTable">
            <thead><tr><th>Scritto</th><th>Reale</th><th>Pt / 🔊</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="gameInputArea" style="display: flex; flex-direction:column; width: 100%; margin-bottom: 5px; gap: 5px; flex-shrink: 0;">
        <div style="display:flex; gap:6px; width:100%; box-sizing:border-box; align-items:center;">
            <input type="text" id="permanentGameInput" placeholder="Digita qui..." autocomplete="off" autocapitalize="none" style="flex: 1 1 auto; min-width: 0; padding: 10px; font-size: 1.1em; margin: 0;">
            <button id="replayWordBtn" class="btn-secondary" style="width: auto; margin: 0; padding: 10px 14px; font-size: 0.9em; flex-shrink:0;">🔁 Riascolta</button>
        </div>
    </div>

    <div style="display:flex; gap:5px; width:100%;">
        <button id="quitGameBtn" class="btn-danger" style="margin-top: 0; flex:1;">Abbandona</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="../../common/init.js"></script>
<script src="../../common/i18n.js"></script>
<script src="../../common/logic.js"></script>
<script src="../../common/audio.js"></script>
<script src="game.js"></script>

</body>
</html>
