<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CW Ping Pong Mode</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameArea" class="screen active-screen">
    <h3>Ping Pong Morse</h3>
    <div id="statusText" style="margin-bottom: 20px; font-weight: bold; color: var(--link-color);">Inizializzazione...</div>

    <div id="sendArea" style="display:none; flex-direction:column; width:100%; gap:10px;">
        <input type="text" id="wordToSend" placeholder="Parola da inviare..." autocomplete="off">
        <button id="sendBtn" class="btn-success">Invia all'avversario</button>
    </div>

    <div id="receiveArea" style="display:none; flex-direction:column; width:100%; gap:10px;">
        <p>Ascolta e decodifica:</p>
        <input type="text" id="receiveInput" placeholder="Scrivi qui..." autocomplete="off">
    </div>

    <button id="quitBtn" class="btn-danger" style="margin-top:auto;">Esci</button>
</div>

<script src="../../common/init.js"></script>
<script src="../../common/i18n.js"></script>
<script src="../../common/logic.js"></script>
<script src="../../common/audio.js"></script>
<script src="game.js"></script>
</body>
</html>
