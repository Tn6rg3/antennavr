<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Morse Quiz - Modular</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

<div id="toastContainer"></div>

<!-- AREA QUIZ -->
<div id="quizArea" class="screen active-screen">
    <div class="header-stats">
        <div id="quizWpmDisplay">WPM: 20</div>
        <div id="quizScoreDisplay">Punti: 0</div>
    </div>

    <div class="box-panel" style="flex-grow: 1; justify-content: center; align-items: center; gap: 15px;">
        <div id="quizTimerBar" style="width:100%; height:8px; background:rgba(0,0,0,0.1); border-radius:4px; overflow:hidden;">
            <div id="quizTimerProgress" style="width:100%; height:100%; background:#4caf50; transition: width 0.1s linear;"></div>
        </div>

        <div id="quizQuestionBox" style="text-align: center; font-size: 1.2em; font-weight: bold; min-height: 50px;">
            In attesa della domanda...
        </div>

        <button id="quizReplayQ" class="btn-secondary" style="width: auto; padding: 8px 15px;">🔁 Riascolta Domanda</button>

        <div id="quizOptionsContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;">
            <div style="display: flex; gap: 5px; align-items: center;">
                <button id="btnQuizA" class="quiz-opt-btn" style="flex: 1;">A</button>
                <button id="replayA" class="action-btn-small btn-secondary" style="width: 40px; padding: 10px 0;">🔊</button>
            </div>
            <div style="display: flex; gap: 5px; align-items: center;">
                <button id="btnQuizB" class="quiz-opt-btn" style="flex: 1;">B</button>
                <button id="replayB" class="action-btn-small btn-secondary" style="width: 40px; padding: 10px 0;">🔊</button>
            </div>
            <div style="display: flex; gap: 5px; align-items: center;">
                <button id="btnQuizC" class="quiz-opt-btn" style="flex: 1;">C</button>
                <button id="replayC" class="action-btn-small btn-secondary" style="width: 40px; padding: 10px 0;">🔊</button>
            </div>
            <div style="display: flex; gap: 5px; align-items: center;">
                <button id="btnQuizD" class="quiz-opt-btn" style="flex: 1;">D</button>
                <button id="replayD" class="action-btn-small btn-secondary" style="width: 40px; padding: 10px 0;">🔊</button>
            </div>
        </div>
    </div>

    <div style="display:flex; gap:5px; width:100%; margin-top: 10px;">
        <button id="quitQuizBtn" class="btn-danger" style="margin-top: 0; flex:1;">Abbandona</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="../../common/init.js?v=20260822_1"></script>
<script src="../../common/i18n.js?v=20260822_1"></script>
<script src="../../common/logic.js?v=20260822_1"></script>
<script src="../../common/audio.js?v=20260822_1"></script>
<script src="questions.js?v=20260822_1"></script>
<script src="game.js?v=20260822_1"></script>

</body>
</html>
