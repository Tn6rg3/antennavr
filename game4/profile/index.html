<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profilo - Sfida Telegrafia</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="../common/init.js"></script>
    <script src="../common/i18n.js"></script>
    <script src="../common/logic.js"></script>
    <script src="../common/audio.js"></script>

    <!-- Fogli di stile -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
            overflow: hidden; background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            box-sizing: border-box;
        }
        .screen {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; height: 100%; height: 100dvh; max-width: 500px;
            margin: 0 auto; padding: 10px; box-sizing: border-box;
            padding-top: max(10px, var(--tg-safe-area-inset-top, 10px));
            padding-bottom: max(10px, var(--tg-safe-area-inset-bottom, 10px));
            overflow: hidden;
        }
        .screen-content {
            flex-grow: 1; width: 100%; overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; padding-bottom: 20px;
            -webkit-overflow-scrolling: touch; min-height: 0;
        }
        .box-panel {
            border: 1px solid var(--hint-color); padding: 10px; border-radius: 10px;
            width: 100%; margin-bottom: 8px; box-sizing: border-box;
            background: var(--sec-bg-color); display: flex; flex-direction: column; flex-shrink: 0;
        }
        .xp-bar-container {
            width: 100%; height: 12px; background: var(--bg-color);
            border-radius: 6px; overflow: hidden; border: 1px solid var(--hint-color);
        }
        .xp-bar-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #9c27b0, #e91e63);
            transition: width 0.5s ease-out;
        }
        /* ... existing styles ... */
        .tab-btn { flex: 1; padding: 10px; border: none; background: var(--sec-bg-color); color: var(--text-color); border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.8em; }
        .tab-btn.active-tab { background: var(--link-color); color: #000; }
        .data-list { list-style: none; padding: 0; margin: 0; }
        .data-list li { display: flex; flex-direction: column; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); background: var(--bg-color); margin-bottom: 4px; border-radius: 6px; font-size: 0.9em; }
        .action-btn-small { width: auto; padding: 4px 8px; font-size: 0.75em; }
    </style>
</head>
<body>

<div id="toastContainer"></div>

<div class="screen">
    <div id="profileTabsHeader" style="display: flex; gap: 4px; width: 100%; margin-bottom: 15px; flex-shrink:0;">
        <button id="btnTabProfile" class="tab-btn active-tab" onclick="switchProfileTab('info')">👤 Profilo</button>
        <button id="btnTabStats" class="tab-btn" onclick="switchProfileTab('stats')">📊 Statistiche</button>
    </div>

    <!-- SEZIONE 1: INFO PROFILO E MISSIONI -->
    <div id="profileInfoArea" class="screen-content">
        <div class="box-panel" style="border-color: var(--champ-color); background: linear-gradient(180deg, var(--sec-bg-color) 0%, var(--bg-color) 100%);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div>
                    <b id="userLevelDisplay" style="font-size:1.2em; color:var(--champ-color);">Liv. 1</b>
                    <div id="userTitleDisplay" style="font-size:0.75em; color:var(--hint-color); text-transform:uppercase; letter-spacing:1px;">Recluta Morse</div>
                </div>
                <div id="xpTextDisplay" style="font-size:0.85em; font-weight:bold;">0 / 500 XP</div>
            </div>
            <div class="xp-bar-container">
                <div id="xpBarFill" class="xp-bar-fill"></div>
            </div>
        </div>

        <div class="box-panel">
            <h3 id="txt_daily_missions" style="color:var(--link-color); margin-bottom:8px; font-size:0.95em;">🎯 Missioni Giornaliere</h3>
            <div id="missionsContainer">
                <p style="text-align:center; color:var(--hint-color); font-size:0.8em;">Caricamento missioni...</p>
            </div>
        </div>

        <div class="box-panel">
            <h3 id="txt_alias_label" style="color:var(--link-color); margin-bottom:5px;">🏷️ Il tuo Alias</h3>
            <div style="display:flex; gap:6px; width:100%; box-sizing:border-box; align-items:center;">
                <input type="text" id="userAliasInput" placeholder="Scegli un alias..." maxlength="20" style="flex: 1; margin:0; padding:8px;">
                <button id="saveAliasBtn" class="action-btn-small btn-success">Salva</button>
            </div>
            <div style="display:flex; align-items:center; gap:10px; margin-top:10px; background:rgba(0,0,0,0.05); padding:8px; border-radius:8px;">
                <input type="checkbox" id="privacyUsernameCheckbox" style="width:20px; height:20px; cursor:pointer;">
                <label for="privacyUsernameCheckbox" id="txt_privacy_label" style="font-size:0.85em; cursor:pointer; font-weight:bold;">Nascondi mio username Telegram</label>
            </div>
        </div>

        <div class="box-panel" style="flex-grow: 1; min-height:0; display:flex; flex-direction:column; margin-bottom:0;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <h3 id="txt_match_history" style="margin:0;">📜 Storico Partite</h3>
                <button id="resetStatsBtn" class="action-btn-small btn-danger">🗑️ Reset</button>
            </div>
            <div id="matchHistoryContainer" style="overflow-y:auto; flex-grow:1;">
                <ul id="matchHistoryList" class="data-list"></ul>
            </div>
        </div>
    </div>

    <!-- SEZIONE 2: ANALISI ERRORI -->
    <div id="profileStatsArea" class="screen-content" style="display: none;">
        <div class="box-panel" style="max-height: 120px; margin-bottom:8px; padding: 5px;">
            <h3 style="font-size: 0.85em; margin-bottom:4px;">⚠️ Errori per Velocità (WPM)</h3>
            <div id="wpmErrorChartContainer" style="overflow-y:auto; font-size: 0.8em;"></div>
        </div>

        <div style="display: flex; gap: 8px; width: 100%; flex-shrink: 0; min-height: 200px;">
            <div class="box-panel" style="flex: 1; display:flex; flex-direction:column; padding: 5px;">
                <h3 style="font-size: 0.85em; margin-bottom:2px;">🔗 Coppie</h3>
                <div style="display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:5px;">
                    <small style="font-size:0.65em;">Soglia:</small>
                    <input type="number" id="bigramThresholdInput" value="3" min="1" max="50" style="width:40px; padding:2px; font-size:0.8em; height:22px;">
                </div>
                <div id="bigramErrorsContainer" style="flex-grow:1; overflow-y:auto; font-size: 0.85em;"></div>
            </div>

            <div class="box-panel" style="flex: 1; display:flex; flex-direction:column; padding: 5px;">
                <h3 style="font-size: 0.85em; margin-bottom:2px;">🔤 Parole</h3>
                <div style="display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:5px;">
                    <small style="font-size:0.65em;">Soglia:</small>
                    <input type="number" id="wordThresholdInput" value="3" min="1" max="50" style="width:40px; padding:2px; font-size:0.8em; height:22px;">
                </div>
                <div id="wordErrorsContainer" style="flex-grow:1; overflow-y:auto; font-size: 0.85em;"></div>
            </div>
        </div>

        <div class="box-panel" style="margin-top:8px; flex-shrink:0;">
            <button id="btnResetErrorStats" class="btn-danger" style="font-size:0.85em; padding:10px;">🗑️ Reset Dati Errori</button>
        </div>
    </div>

    <div class="fixed-bottom-btns">
        <button onclick="goBackToMenu()">Chiudi Profilo</button>
    </div>
</div>

<!-- MODAL DETTAGLI -->
<div id="matchDetailsModal" style="display: none; position: fixed; top: 50%; left: 50%; width: 90%; height: 80%; transform: translate(-50%, -50%); background: var(--bg-color); z-index: 4000; border: 2px solid var(--hint-color); border-radius: 10px; padding: 15px; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <h3 style="margin-top:0; text-align: center; color: var(--link-color);">Dettagli Partita</h3>
    <div class="table-wrapper">
        <table id="matchDetailsTable">
            <thead><tr><th>Scritto</th><th>Reale</th><th>Pt / 🔊</th></tr></thead>
            <tbody id="matchDetailsBody"></tbody>
        </table>
    </div>
    <button onclick="document.getElementById('matchDetailsModal').style.display='none'" style="margin-top:auto;">Chiudi</button>
</div>

<script src="game.js"></script>

</body>
</html>
