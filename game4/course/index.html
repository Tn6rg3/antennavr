<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Corso CW - Sfida Telegrafia</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        .heatmap-box { width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.7em; font-weight: bold; color: white; }
        .tab-btn { flex:1; padding:10px; border:none; background:var(--sec-bg-color); color:var(--text-color); border-radius:8px; cursor:pointer; font-size:0.85em; font-weight:bold; }
        .tab-btn.active-tab { background:var(--link-color); color:#000; }
        #morseKeyBtn { width:100px; height:100px; border-radius:50%; background:#333; border:4px solid var(--link-color); cursor:pointer; outline:none; -webkit-tap-highlight-color: transparent; }
        #morseKeyBtn:active { transform: scale(0.95); background:#444; }
    </style>
</head>
<body>
    <div id="toastContainer" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999;"></div>

    <div class="screen">
        <div id="courseHeader" style="display: flex; justify-content: space-between; align-items: center; padding: 10px; width: 100%; box-sizing: border-box;">
            <h2 id="txt_course_title" style="margin:0; color:var(--link-color); font-size:1.2em;">📻 Corso CW</h2>
            <button onclick="window.parent.postMessage('closeModule', '*')" class="action-btn-small btn-danger" id="btn_close">Chiudi</button>
        </div>

        <div class="screen-content" style="padding:10px;">
            <div id="courseTabInitialPrompt" class="box-panel" style="display:none; text-align:center; padding: 20px;">
                <span style="font-size: 3em;">📻</span>
                <h3>Inizia il Corso</h3>
                <button class="btn-success" onclick="startCourseWizard()">INIZIA ORA! 🚀</button>
            </div>

            <div id="courseWizardContainer" class="box-panel" style="display:none;">
                <div id="wizardContent"></div>
            </div>

            <div id="courseTabActiveView" style="display:none; flex-direction:column; gap:10px; width:100%;">
                <div id="courseTabsHeader" style="display: flex; gap: 4px; width: 100%; margin-bottom: 5px;">
                    <button id="btnCourseSubTabDash" class="tab-btn active-tab" onclick="switchCourseSubTab('dash')">📊 Dashboard</button>
                    <button id="btnCourseSubTabTx" class="tab-btn" onclick="switchCourseSubTab('tx')">📻 Trasmissione</button>
                    <button id="btnCourseSubTabTutor" class="tab-btn" onclick="switchCourseSubTab('tutor')" style="display:none;">🎓 Tutor</button>
                </div>

                <div id="courseTabDashboardView">
                    <div class="box-panel">
                        <h4>Koch Heatmap</h4>
                        <div id="courseTabHeatmap" style="display:flex; flex-wrap:wrap; gap:4px; justify-content:center;"></div>
                    </div>
                    <div class="box-panel">
                        <h4>Piano Settimanale</h4>
                        <div id="courseTabWeeklyPlan"></div>
                    </div>
                    <button id="btnTabStartCourseSession" class="btn-success">AVVIA SESSIONE 🚀</button>
                </div>

                <div id="courseTransmissionView" style="display:none;">
                    <div class="box-panel" style="text-align:center;">
                        <h3 id="txTargetChar" style="font-size:3em; color:var(--link-color);">?</h3>
                        <div id="txFeedbackText">Pronto?</div>
                        <div style="margin:20px 0;"><button id="morseKeyBtn"></button></div>
                        <div style="display:flex; gap:10px;">
                            <button id="btnStartTxSession" class="btn-success" onclick="startTxSession()" style="flex:1;">AVVIA</button>
                            <button id="btnStopTxSession" class="btn-danger" onclick="stopTxSession()" style="flex:1; display:none;">STOP</button>
                        </div>
                    </div>
                </div>

                <div id="courseTutorPanel" style="display:none;">
                    <div class="box-panel">
                        <h3>🎓 Allievi Assegnati</h3>
                        <div id="tutorStudentList" style="display:flex; flex-direction:column; gap:8px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: STATISTICHE CORSISTA (PER TUTOR) -->
    <div id="tutorStudentStatsModal" style="display: none; position: fixed; top: 50%; left: 50%; width: 90%; height: 90%; transform: translate(-50%, -50%); background: var(--bg-color); z-index: 11000; border: 2px solid #673ab7; border-radius: 12px; padding: 15px; flex-direction: column; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow-y: auto;">
        <h3 id="tutorStudentStatsTitle" style="margin-top:0; text-align: center; color: #9575cd;">Dati Corsista</h3>
        <div id="tutorStudentStatsContent" style="flex-grow:1; overflow-y:auto; display:flex; flex-direction:column; gap:15px; padding-bottom:10px;">
            <div class="box-panel" style="padding:10px;">
                <h4 style="margin:0 0 10px 0; font-size:0.85em;">Padronanza Koch</h4>
                <div id="tutorStudentHeatmap" style="display:flex; flex-wrap:wrap; gap:4px; justify-content:center;"></div>
            </div>
            <div class="box-panel" style="padding:10px;">
                <h4 style="margin:0 0 10px 0; font-size:0.85em;">Ultime Sessioni</h4>
                <div id="tutorStudentHistory" style="font-size:0.8em; display:flex; flex-direction:column; gap:5px;"></div>
            </div>
            <div class="box-panel" style="padding:10px;">
                <h4 style="margin:0 0 10px 0; font-size:0.85em;">Trend</h4>
                <div id="tutorStudentTrend" style="font-size:0.8em;"></div>
            </div>
        </div>
        <button onclick="document.getElementById('tutorStudentStatsModal').style.display='none'" class="btn-secondary" style="margin-top:10px;">Chiudi</button>
    </div>

    <script src="../common/init.js?v=20260822_1"></script>
    <script src="../common/i18n.js?v=20260822_1"></script>
    <script src="../common/logic.js?v=20260822_1"></script>
    <script src="../common/audio.js?v=20260822_1"></script>
    <script src="game.js?v=20260822_1"></script>
</body>
</html>
