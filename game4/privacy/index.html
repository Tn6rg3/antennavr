<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Privacy & Info - Sfida Telegrafia</title>

    <!-- Script essenziali (Telegram e Firebase) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Script Comuni -->
    <script src="../common/init.js?v=20260822_1"></script>
    <script src="../common/i18n.js?v=20260822_1"></script>
    <script src="../common/logic.js?v=20260822_1"></script>
    <script src="../common/audio.js?v=20260822_1"></script>

    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #3390ec);
            --btn-color: var(--tg-theme-button-color, #3390ec);
            --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            --champ-color: #9c27b0;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .screen {
            display: flex; flex-direction: column;
            width: 100%; height: 100%; max-width: 500px; margin: 0 auto;
            padding: 15px; box-sizing: border-box;
            padding-top: max(20px, var(--tg-safe-area-inset-top, 20px));
            padding-bottom: max(15px, var(--tg-safe-area-inset-bottom, 15px));
        }

        .screen-content {
            flex-grow: 1; overflow-y: auto; padding-bottom: 20px;
        }

        .box-panel {
            border: 1px solid var(--hint-color);
            padding: 12px; border-radius: 12px;
            background: var(--sec-bg-color);
            margin-bottom: 15px;
        }

        h3 { margin-top: 0; margin-bottom: 8px; font-size: 1.1em; text-align: center; }

        button {
            background-color: var(--btn-color);
            color: var(--btn-text-color);
            border: none; padding: 12px;
            font-size: 1em; border-radius: 10px;
            cursor: pointer; font-weight: bold; width: 100%;
            margin-top: 5px;
        }

        .btn-success { background-color: #4caf50; }
        .btn-danger { background-color: #d32f2f; }
        .btn-secondary { background-color: #ff9800; }

        textarea {
            width: 100%; height: 80px; padding: 10px;
            border-radius: 10px; border: 1px solid var(--hint-color);
            background: var(--bg-color); color: var(--text-color);
            font-family: inherit; resize: none; font-size: 0.95em;
            box-sizing: border-box; margin-bottom: 10px;
        }

        #regolamentoContainer {
            text-align: left; font-size: 0.9em; padding: 10px;
            background: var(--sec-bg-color); border-radius: 12px;
            border: 1px solid var(--hint-color); margin-bottom: 15px;
        }

        #adminBugList {
            max-height: 250px; overflow-y: auto; font-size: 0.85em;
            background: var(--bg-color); border-radius: 8px; padding: 5px;
        }

        .bug-item {
            padding: 8px; border-bottom: 1px solid var(--hint-color);
        }

        #toastContainer {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 10px;
        }

        .toast {
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 20px; animation: fadeInOut 4s forwards;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }

        .badge-counter {
            background: #e53935; color: white; border-radius: 50%;
            padding: 2px 6px; font-size: 0.7em; margin-left: 5px;
        }
    </style>
</head>
<body>

<div id="toastContainer"></div>

<div class="screen">
    <h2 id="txt_privacy_title" style="text-align: center; margin-bottom: 15px;">📜 Info & Privacy</h2>

    <div class="screen-content">
        <!-- REGOLAMENTO -->
        <div id="regolamentoContainer">
            <p style="text-align:center; color:var(--hint-color);">Caricamento regolamento...</p>
        </div>

        <!-- SEGNALAZIONE BUG -->
        <div class="box-panel" style="border-color: var(--champ-color);">
            <h3 id="txt_bug_report_title" style="color: var(--champ-color);">🐞 Segnalazione Bug / Feedback</h3>
            <textarea id="bugReportText" placeholder="Descrivi il problema o suggerimento..."></textarea>
            <button id="btnSendBugReport" class="btn-success">Invia allo Sviluppatore 🚀</button>
        </div>

        <!-- PANNELLO ADMIN (SOLO ADMIN) -->
        <div id="adminBugPanel" class="box-panel" style="display:none; border-color: #d32f2f; background: rgba(211, 47, 47, 0.05);">
            <h3 style="color: #d32f2f;">🛡️ Pannello Amministratore</h3>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                <button id="btnReadAllBugs" class="btn-danger" style="font-size:0.85em;">Bugs 📜</button>
                <button id="btnReadTutorRequests" class="btn-secondary" style="font-size:0.85em; background:#673ab7;">Tutor 🎓</button>
            </div>

            <div id="adminBugList">
                <p style="text-align:center; color:var(--hint-color);">Seleziona una categoria sopra.</p>
            </div>

            <!-- ANNUNCIO GLOBALE -->
            <div style="border-top: 1px solid rgba(0,0,0,0.1); padding-top: 10px; margin-top:15px;">
                <h4 style="margin: 0 0 8px 0; font-size: 0.9em;">📢 Annuncio Globale</h4>
                <input type="text" id="adminAnnTitleInput" placeholder="Titolo" style="margin-bottom:5px; padding:8px; border-radius:8px; border:1px solid var(--hint-color); width:100%; box-sizing:border-box;">
                <textarea id="adminAnnTextInput" placeholder="Messaggio per tutti..." style="height:60px;"></textarea>
                <button id="btnAdminSendAnnouncement" class="btn-success">PUBBLICA ANNUNCIO 🚀</button>
                <button id="btnAdminClearAnnouncement" class="btn-danger" style="font-size:0.8em; padding:8px;">Rimuovi Attivo 🗑️</button>
            </div>
        </div>
    </div>

    <div class="fixed-bottom-btns">
        <button id="deleteDataBtn" class="btn-danger" style="margin-bottom: 10px;">🗑️ Elimina Definitivamente i miei Dati</button>
        <button id="backToMenuBtn" class="btn-secondary">Torna al Menu Principale</button>
    </div>
</div>

<script src="game.js"></script>

</body>
</html>
