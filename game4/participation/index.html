<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Attività e Medaglie</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="../common/init.js"></script>
    <script src="../common/i18n.js"></script>
    <script src="../common/logic.js"></script>
    <script src="../common/audio.js"></script>

    <!-- Fogli di stile -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            padding-top: max(20px, var(--tg-safe-area-inset-top, 20px));
            padding-bottom: max(15px, var(--tg-safe-area-inset-bottom, 15px));
        }
        h2 { color: var(--champ-color); margin: 0 0 10px 0; text-align: center; }
        h3 { font-size: 1em; margin: 10px 0 5px 0; color: var(--link-color); }
        /* ... existing styles that might be needed if style.css doesn't cover them ... */
        .tab-buttons { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: var(--sec-bg-color); color: var(--text-color); border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9em; }
        .tab-btn.active-tab { background: var(--link-color); color: #000; }
        .box-panel { background: var(--sec-bg-color); border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05); }
        .flex-grow { flex-grow: 1; min-height: 0; }
        .data-list { list-style: none; padding: 0; margin: 0; }
        .data-list li { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9em; }
        #myMedalsContainer { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; font-size: 1.8em; padding: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="txt_participation_title">🏅 Partecipazione e Attività</h2>

    <div class="tab-buttons">
        <button id="tabDaily" class="tab-btn active-tab" onclick="switchTab('daily')">Oggi</button>
        <button id="tabWeekly" class="tab-btn" onclick="switchTab('weekly')">Settimana</button>
        <button id="tabMonthly" class="tab-btn" onclick="switchTab('monthly')">Mese</button>
    </div>

    <div class="box-panel flex-grow">
        <h3 id="actListTitle">Classifica Attività</h3>
        <div class="flex-grow" style="overflow-y: auto;">
            <ul id="activityRankList" class="data-list"></ul>
        </div>
    </div>

    <div class="box-panel">
        <h3 id="txt_medals_title">🎖️ Le Mie Medaglie</h3>
        <div id="myMedalsContainer">
            <span style="font-size:0.5em; color:var(--hint-color);">Caricamento medaglie...</span>
        </div>
    </div>

    <button class="btn-secondary" onclick="closeModule()" id="btn_close">Chiudi</button>
</div>

<div id="toastContainer" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:1000;"></div>

<script src="game.js"></script>

</body>
</html>
