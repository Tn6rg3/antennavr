<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala Giochi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        #menu {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
        }
        #game-frame {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- MENU PRINCIPALE -->
    <div id="menu">
        <h1>Scegli il Gioco</h1>
        <!-- Sostituisci i link con i tuoi giochi -->
        <button onclick="apriGioco('https://tn6rg3.github.io/antennavr/cw/index.html')">CW IP</button>
        <button onclick="apriGioco('https://tn6rg3.github.io/antennavr/game/appcw.html')">GIOCO CW</button>
    </div>

    <!-- CONTENITORE DEL GIOCO -->
    <iframe id="game-frame"></iframe>

    <script>
        function apriGioco(url) {
            // Nasconde il menu e mostra il gioco dentro la stessa schermata
            document.getElementById('menu').style.display = 'none';
            let frame = document.getElementById('game-frame');
            frame.style.display = 'block';
            frame.src = url;
        }
    </script>

</body>
</html>
