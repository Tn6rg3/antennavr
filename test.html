<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Studio Pro - Media & 3D Spawner</title>
    <!-- A-Frame e dipendenze -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <!-- STLLoader per caricare i file STL -->
    <script src="https://unpkg.com/three@0.137.0/examples/js/loaders/STLLoader.js"></script>
    <style>
      #ui-2d {
        position: absolute; top: 20px; left: 20px; z-index: 999;
        background: rgba(255, 255, 255, 0.95); padding: 20px;
        border-radius: 10px; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px;
      }
      .btn-ui { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
    </style>
    <script>
      // STATO GLOBALE FILE
      window.fileCaricati = [];

      // Componente custom per i file STL
      AFRAME.registerComponent('stl-model', {
        schema: {src: {type: 'string'}},
        init: function () {
          const loader = new THREE.STLLoader();
          loader.load(this.data.src, (geometry) => {
            const material = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.2, roughness: 0.8 });
            const mesh = new THREE.Mesh(geometry, material);
            this.el.setObject3D('mesh', mesh);
          });
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener('enter-vr', () => { document.getElementById('ui-2d').style.display = 'none'; });
        sceneEl.addEventListener('exit-vr', () => { document.getElementById('ui-2d').style.display = 'block'; });

        // UPLOAD FILE DA INTERFACCIA (L'upload in WebXR dai visori è bloccato dai browser per sicurezza, 
        // quindi si caricano prima di premere "Enter AR" e appariranno nel menu del polso)
        document.getElementById('file-assets').addEventListener('change', function(e) {
          const files = e.target.files;
          for(let i=0; i<files.length; i++) {
            const file = files[i];
            const estensione = file.name.split('.').pop().toLowerCase();
            const url = URL.createObjectURL(file);
            window.fileCaricati.push({ nome: file.name, url: url, tipo: estensione });
          }
          document.getElementById('status-assets').innerText = `✅ ${window.fileCaricati.length} file pronti per l'AR!`;
          window.dispatchEvent(new Event('file-aggiornati'));
        });
      });

      // CORE AR: SCANNER LIVE INVISIBILE (Crea Profondità e Occlusione)
      AFRAME.registerComponent('gestore-spazio-occulto', {
        init: function () {
          this.planes = new Map(); 
          this.meshes = new Map();
          
          // MATERIALE MAGICO: Rende l'oggetto invisibile ma copre la vista degli oggetti virtuali dietro di esso
          this.matOcclusione = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true });
        },
        tick: function (time) {
          const renderer = this.el.sceneEl.renderer; if (!renderer.xr.isPresenting) return;
          const frame = this.el.sceneEl.frame; if (!frame) return;
          const refSpace = renderer.xr.getReferenceSpace(); if (!refSpace) return;
          
          const sogliaAggiornamentoMs = 500; 

          // Elaborazione Piani (Muri, Pavimenti)
          if (frame.detectedPlanes) {
            frame.detectedPlanes.forEach(plane => {
              let pData = this.planes.get(plane);
              if (!pData) {
                const entity = this.creaEntitaOcclusione(this.createPlaneGeometry(plane));
                pData = { entity: entity, lastTime: plane.lastChangedTime };
                this.planes.set(plane, pData);
              } else if (plane.lastChangedTime > pData.lastTime + sogliaAggiornamentoMs) {
                pData.entity.getObject3D('mesh').geometry.dispose();
                pData.entity.getObject3D('mesh').geometry = this.createPlaneGeometry(plane);
                pData.lastTime = plane.lastChangedTime;
              }
              const pose = frame.getPose(plane.planeSpace, refSpace);
              if (pose) pData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }

          // Elaborazione Mesh Complesse (Mobili)
          if (frame.detectedMeshes) {
            frame.detectedMeshes.forEach(xrMesh => {
              let mData = this.meshes.get(xrMesh);
              if (!mData) {
                const entity = this.creaEntitaOcclusione(this.createMeshGeometry(xrMesh));
                mData = { entity: entity, lastTime: xrMesh.lastChangedTime };
                this.meshes.set(xrMesh, mData);
              } else if (xrMesh.lastChangedTime > mData.lastTime + sogliaAggiornamentoMs) {
                mData.entity.getObject3D('mesh').geometry.dispose();
                mData.entity.getObject3D('mesh').geometry = this.createMeshGeometry(xrMesh);
                mData.lastTime = xrMesh.lastChangedTime;
              }
              const pose = frame.getPose(xrMesh.meshSpace, refSpace);
              if (pose) mData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }
        },
        creaEntitaOcclusione: function(geometry) {
          const entity = document.createElement('a-entity');
          const mesh = new THREE.Mesh(geometry, this.matOcclusione);
          mesh.renderOrder = -1; // Priorità di occlusione
          entity.setObject3D('mesh', mesh);
          entity.object3D.matrixAutoUpdate = false;
          this.el.sceneEl.appendChild(entity); return entity;
        },
        createPlaneGeometry: function(plane) {
          const shape = new THREE.Shape();
          if (plane.polygon.length > 0) {
            shape.moveTo(plane.polygon[0].x, plane.polygon[0].z);
            for (let i = 1; i < plane.polygon.length; i++) shape.lineTo(plane.polygon[i].x, plane.polygon[i].z);
          }
          const geometry = new THREE.ShapeGeometry(shape); geometry.rotateX(Math.PI / 2); return geometry;
        },
        createMeshGeometry: function(xrMesh) {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(xrMesh.vertices), 3));
          geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(xrMesh.indices), 1));
          return geometry;
        }
      });

      // PANNELLO CONTROLLER SINISTRO (SPAWNER)
      AFRAME.registerComponent('pannello-sx', {
        init: function() {
          this.menuVisibile = false;
          
          this.menuContainer = document.createElement('a-entity');
          this.menuContainer.setAttribute('position', '0.1 0.1 -0.1');
          this.menuContainer.setAttribute('rotation', '-45 0 0');
          this.menuContainer.setAttribute('visible', 'false');
          this.el.appendChild(this.menuContainer);

          // Testo "Menu" fisso
          const titolo = document.createElement('a-text');
          titolo.setAttribute('value', 'FILE CARICATI');
          titolo.setAttribute('scale', '0.1 0.1 0.1');
          titolo.setAttribute('position', '0 0.1 0');
          titolo.setAttribute('color', '#00FFCC');
          this.menuContainer.appendChild(titolo);

          // Ascolta il tasto Y
          this.el.addEventListener('ybuttondown', () => {
            this.menuVisibile = !this.menuVisibile;
            this.menuContainer.setAttribute('visible', this.menuVisibile);
          });

          window.addEventListener('file-aggiornati', () => this.aggiornaListaMenu());
        },
        aggiornaListaMenu: function() {
          // Pulisce i vecchi bottoni
          Array.from(this.menuContainer.children).forEach(child => {
            if (child.classList.contains('menu-btn')) this.menuContainer.removeChild(child);
          });

          window.fileCaricati.forEach((file, index) => {
            const btn = document.createElement('a-plane');
            btn.setAttribute('width', '0.2');
            btn.setAttribute('height', '0.04');
            btn.setAttribute('color', '#333333');
            btn.setAttribute('position', `0 ${0.05 - (index * 0.05)} 0`);
            btn.classList.add('menu-btn'); // Classe cliccabile dal DX
            
            const txt = document.createElement('a-text');
            txt.setAttribute('value', file.nome.length > 15 ? file.nome.substring(0,15)+'...' : file.nome);
            txt.setAttribute('scale', '0.08 0.08 0.08');
            txt.setAttribute('align', 'center');
            txt.setAttribute('position', '0 0 0.01');
            btn.appendChild(txt);

            // Hover ed Eventi Click (emessi dal raycaster DX)
            btn.addEventListener('raycaster-intersected', () => btn.setAttribute('color', '#555555'));
            btn.addEventListener('raycaster-intersected-cleared', () => btn.setAttribute('color', '#333333'));
            btn.addEventListener('click', () => this.spawnaOggetto(file));

            this.menuContainer.appendChild(btn);
          });
        },
        spawnaOggetto: function(file) {
          const entity = document.createElement('a-entity');
          entity.classList.add('spostabile'); // Classe per essere manipolato dal DX
          
          // Nasce a 1 metro davanti all'utente
          const camera = document.querySelector('a-scene').camera;
          const pos = new THREE.Vector3(0, 0, -1);
          pos.applyMatrix4(camera.matrixWorld);
          entity.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
          
          // Scala 1 1 1 (Reale)
          entity.setAttribute('scale', '1 1 1'); 

          if (file.tipo === 'obj') {
            entity.setAttribute('obj-model', `obj: url(${file.url})`);
          } else if (file.tipo === 'stl') {
            entity.setAttribute('stl-model', `src: ${file.url}`);
          } else if (file.tipo === 'png' || file.tipo === 'jpg') {
            entity.setAttribute('geometry', 'primitive: plane; width: 0.5; height: 0.5');
            entity.setAttribute('material', `src: url(${file.url}); side: double; transparent: true`);
          } else if (file.tipo === 'mp4') {
            const vidId = 'vid_' + Date.now();
            const vid = document.createElement('video');
            vid.src = file.url; vid.id = vidId; vid.autoplay = true; vid.loop = true; vid.muted = false;
            document.querySelector('a-assets').appendChild(vid);
            
            entity.setAttribute('geometry', 'primitive: plane; width: 0.8; height: 0.45');
            entity.setAttribute('material', `src: #${vidId}; side: double`);
            // Avvia video se servisse triggerarlo
            vid.play().catch(e => console.log("Auto-play blocked"));
          }
          
          document.querySelector('a-scene').appendChild(entity);
        }
      });

      // CONTROLLER DESTRO (MANIPOLATORE, ROTAZIONE E SCALA)
      AFRAME.registerComponent('strumenti-dx', {
        init: function () {
          this.oggettoAfferrato = null;
          this.distanzaGrab = 0;
          this.stickX = 0;
          
          this.el.addEventListener('triggerdown', () => {
            const raycaster = this.el.components.raycaster;
            // Cerca intersezioni
            const hits = raycaster.intersections;
            if (hits.length === 0) return;

            // Se colpisce un bottone del menu, simula il click
            const hitMenu = hits.find(h => h.object.el.classList.contains('menu-btn'));
            if (hitMenu) { hitMenu.object.el.emit('click'); return; }

            // Se colpisce un oggetto spostabile
            const hitObj = hits.find(h => h.object.el.classList.contains('spostabile'));
            if (hitObj) {
              this.oggettoAfferrato = hitObj.object.el;
              this.distanzaGrab = hitObj.distance;
            }
          });

          this.el.addEventListener('triggerup', () => {
            this.oggettoAfferrato = null;
          });

          // Rotazione Leva (Thumbstick)
          this.el.addEventListener('thumbstickmoved', (e) => {
            this.stickX = e.detail.x; // Salviamo il valore per la rotazione continua nel tick
          });

          // Ingrandire (Tasto A)
          this.el.addEventListener('abuttondown', () => {
            if (this.oggettoAfferrato) {
              const scale = this.oggettoAfferrato.object3D.scale;
              scale.multiplyScalar(1.1); // +10%
            }
          });

          // Rimpicciolire (Tasto B)
          this.el.addEventListener('bbuttondown', () => {
            if (this.oggettoAfferrato) {
              const scale = this.oggettoAfferrato.object3D.scale;
              scale.multiplyScalar(0.9); // -10%
            }
          });
        },
        tick: function () {
          if (this.oggettoAfferrato) {
            // SPOSTAMENTO (segue il raggio laser alla distanza bloccata)
            const ray = this.el.components.raycaster.raycaster.ray;
            const targetPos = ray.direction.clone().multiplyScalar(this.distanzaGrab).add(ray.origin);
            this.oggettoAfferrato.object3D.position.copy(targetPos);

            // ROTAZIONE con LEVA 
            if (Math.abs(this.stickX) > 0.1) {
              this.oggettoAfferrato.object3D.rotation.y -= this.stickX * 0.05; // Ruota asse Y fluido
            }
          }
        }
      });
    </script>
  </head>
  <body>

    <!-- UI CARICAMENTO FILE -->
    <div id="ui-2d">
      <h3 style="margin-top:0;">Libreria Asset AR</h3>
      <p style="font-size: 12px; color: #555;">Carica i tuoi file (.obj, .stl, .jpg, .png, .mp4) prima di entrare in AR. Li troverai sul polso sinistro (Tasto Y).</p>
      <input type="file" id="file-assets" accept=".obj,.stl,.png,.jpg,.jpeg,.mp4" multiple style="width:100%">
      <div id="status-assets" style="color: #4CAF50; font-size:12px; margin-top:5px; font-weight: bold;">Nessun file caricato</div>
      <hr style="margin: 10px 0;">
    </div>

    <!-- SCENA AR -->
    <a-scene antialias="true" renderer="colorManagement: true;" webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, plane-detection, mesh, mesh-detection; framebufferScaleFactor: 2.0;" gestore-spazio-occulto>
      
      <a-assets>
        <!-- Container dinamico per i video -->
      </a-assets>

      <a-entity environment="preset: none; skyType: none; lighting: none;"></a-entity>

      <!-- CONTROLLER SINISTRO (Menu File su Tasto Y) -->
      <a-entity laser-controls="hand: left" oculus-touch-controls="hand: left" pannello-sx></a-entity>

      <!-- CONTROLLER DESTRO (Laser Interazioni, Tasto A/B e Leva) -->
      <!-- Usa un raycaster configurato apposta per interagire con menu e oggetti -->
      <a-entity laser-controls="hand: right" oculus-touch-controls="hand: right" raycaster="objects: .spostabile, .menu-btn; far: 10;" cursor="rayOrigin: controller" strumenti-dx></a-entity>

    </a-scene>
  </body>
</html>
