<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Studio Pro - Versione Finale Corretta</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
      #ui-2d {
        position: absolute; top: 20px; left: 20px; z-index: 999;
        background: rgba(255, 255, 255, 0.95); padding: 20px;
        border-radius: 10px; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px;
      }
      .btn-ui { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
    </style>
    <script>
      // Variabili Globali di Stato
      window.userTexture = null; 
      window.fotoAggiuntive = []; 
      window.modalitaStrumento = 'taglio'; // 'taglio' oppure 'foto'

      document.addEventListener('DOMContentLoaded', () => {
        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener('enter-vr', () => { document.getElementById('ui-2d').style.display = 'none'; });
        sceneEl.addEventListener('exit-vr', () => { document.getElementById('ui-2d').style.display = 'block'; });

        // 1. CARICAMENTO SFONDO MURI
        document.getElementById('file-sfondo').addEventListener('change', function(e) {
          if (e.target.files[0]) {
            document.getElementById('status-sfondo').innerText = "Caricamento...";
            const reader = new FileReader();
            reader.onload = function(event) {
              const img = new Image();
              img.onload = function() {
                const tex = new THREE.Texture(img);
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.minFilter = tex.magFilter = THREE.LinearFilter;
                tex.generateMipmaps = false; tex.needsUpdate = true;
                window.userTexture = tex;
                document.getElementById('status-sfondo').innerText = "✅ Sfondo pronto!";
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
          }
        });

        // 2. CARICAMENTO FOTO MULTIPLE (Quadri)
        document.getElementById('file-foto').addEventListener('change', function(e) {
          const files = e.target.files;
          window.fotoAggiuntive = [];
          if (files.length === 0) return;
          
          let caricati = 0;
          for(let i=0; i<files.length; i++) {
            const reader = new FileReader();
            reader.onload = (function(file) {
              return function(event) {
                const img = new Image();
                img.onload = function() {
                  const tex = new THREE.Texture(img);
                  tex.minFilter = tex.magFilter = THREE.LinearFilter;
                  tex.generateMipmaps = false; tex.needsUpdate = true;
                  window.fotoAggiuntive.push(tex);
                  caricati++;
                  document.getElementById('status-foto').innerText = `✅ ${caricati}/${files.length} Foto pronte!`;
                };
                img.src = event.target.result;
              };
            })(files[i]);
            reader.readAsDataURL(files[i]);
          }
        });

        // 3. RICEZIONE SCHERMO DAL PC
        document.getElementById('btn-connetti-pc').addEventListener('click', () => {
          const btn = document.getElementById('btn-connetti-pc');
          btn.innerText = "Attivazione..."; btn.style.background = "#FF9800";
          const peerQuest = new Peer('quest-italia-pro-847291'); 
          peerQuest.on('open', () => { btn.innerText = "⏳ Apri PC ora"; });
          peerQuest.on('call', call => {
            call.answer(); 
            call.on('stream', stream => {
              const vid = document.getElementById('video-pc-ricevuto');
              vid.srcObject = stream;
              vid.play().then(() => {
                btn.innerText = "✅ PC Connesso!"; btn.style.background = "#4CAF50";
                document.querySelector('#schermo-virtuale').setAttribute('visible', 'true');
              });
            });
          });
        });
      });

      // CORE AR (Gestione Spazio e Mesh)
      AFRAME.registerComponent('gestore-spazio', {
        init: function () {
          this.planes = new Map(); this.meshes = new Map();
          this.meshVisibile = true; this.usaImmagine = false;
          
          this.matWirePiani = new THREE.MeshBasicMaterial({ color: 0x00FF00, transparent: true, opacity: 0.6, side: THREE.DoubleSide, wireframe: true, polygonOffset: true, polygonOffsetFactor: 3, polygonOffsetUnits: 3 });
          this.matImgPiani = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.95, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 3, polygonOffsetUnits: 3 });
          this.matWireMesh = new THREE.MeshBasicMaterial({ color: 0x00FF00, transparent: true, opacity: 0.6, side: THREE.DoubleSide, wireframe: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
          this.matImgMesh = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.95, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
        },
        toggleImmagineSfondo: function() {
          if (window.userTexture) {
            this.usaImmagine = !this.usaImmagine;
            this.matImgPiani.map = window.userTexture; this.matImgMesh.map = window.userTexture;
            this.matImgPiani.needsUpdate = true; this.matImgMesh.needsUpdate = true;
            this.aggiornaMateriali();
          }
        },
        toggleVisibilitaMesh: function() {
          this.meshVisibile = !this.meshVisibile;
          const oG = this.meshVisibile ? 0.6 : 0.0; const oI = this.meshVisibile ? 0.95 : 0.0;
          this.matWirePiani.opacity = oG; this.matWireMesh.opacity = oG;
          this.matImgPiani.opacity = oI; this.matImgMesh.opacity = oI;
        },
        aggiornaMateriali: function() {
          this.planes.forEach(d => { d.entity.getObject3D('mesh').material = this.usaImmagine ? this.matImgPiani : this.matWirePiani; });
          this.meshes.forEach(d => { d.entity.getObject3D('mesh').material = this.usaImmagine ? this.matImgMesh : this.matWireMesh; });
        },
        tick: function () {
          const renderer = this.el.sceneEl.renderer; if (!renderer.xr.isPresenting) return;
          const frame = this.el.sceneEl.frame; if (!frame) return;
          const refSpace = renderer.xr.getReferenceSpace(); if (!refSpace) return;

          if (frame.detectedPlanes) {
            frame.detectedPlanes.forEach(plane => {
              let pData = this.planes.get(plane);
              if (!pData) {
                const mat = this.usaImmagine ? this.matImgPiani : this.matWirePiani;
                const entity = this.creaEntitaSuperficie(this.createPlaneGeometry(plane), mat);
                pData = { entity: entity, lastTime: plane.lastChangedTime };
                this.planes.set(plane, pData);
              } else if (plane.lastChangedTime > pData.lastTime) {
                pData.entity.getObject3D('mesh').geometry.dispose();
                pData.entity.getObject3D('mesh').geometry = this.createPlaneGeometry(plane);
                pData.lastTime = plane.lastChangedTime;
              }
              const pose = frame.getPose(plane.planeSpace, refSpace);
              if (pose) pData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }
          if (frame.detectedMeshes) {
            frame.detectedMeshes.forEach(xrMesh => {
              let mData = this.meshes.get(xrMesh);
              if (!mData) {
                const mat = this.usaImmagine ? this.matImgMesh : this.matWireMesh;
                const entity = this.creaEntitaSuperficie(this.createMeshGeometry(xrMesh), mat);
                mData = { entity: entity, lastTime: xrMesh.lastChangedTime };
                this.meshes.set(xrMesh, mData);
              } else if (xrMesh.lastChangedTime > mData.lastTime) {
                mData.entity.getObject3D('mesh').geometry.dispose();
                mData.entity.getObject3D('mesh').geometry = this.createMeshGeometry(xrMesh);
                mData.lastTime = xrMesh.lastChangedTime;
              }
              const pose = frame.getPose(xrMesh.meshSpace, refSpace);
              if (pose) mData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }
        },
        creaEntitaSuperficie: function(geometry, materiale) {
          const entity = document.createElement('a-entity');
          entity.classList.add('superficie'); 
          const mesh = new THREE.Mesh(geometry, materiale);
          entity.setObject3D('mesh', mesh);
          entity.object3D.matrixAutoUpdate = false;
          this.el.sceneEl.appendChild(entity); return entity;
        },
        applicaUVScalate: function(geometry) {
          geometry.computeVertexNormals();
          const pos = geometry.attributes.position, norm = geometry.attributes.normal;
          const uvs = new Float32Array(pos.count * 2); const GM = 4.0;
          for (let i = 0; i < pos.count; i++) {
            const nx = Math.abs(norm.getX(i)), ny = Math.abs(norm.getY(i)), nz = Math.abs(norm.getZ(i));
            const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            if (ny >= nx && ny >= nz) { uvs[i*2] = x/GM; uvs[i*2+1] = z/GM; } 
            else if (nx >= ny && nx >= nz) { uvs[i*2] = z/GM; uvs[i*2+1] = y/GM; } 
            else { uvs[i*2] = x/GM; uvs[i*2+1] = y/GM; }
          }
          geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
        },
        createPlaneGeometry: function(plane) {
          const shape = new THREE.Shape();
          if (plane.polygon.length > 0) {
            shape.moveTo(plane.polygon[0].x, plane.polygon[0].z);
            for (let i = 1; i < plane.polygon.length; i++) shape.lineTo(plane.polygon[i].x, plane.polygon[i].z);
          }
          const geometry = new THREE.ShapeGeometry(shape); geometry.rotateX(Math.PI / 2); this.applicaUVScalate(geometry); return geometry;
        },
        createMeshGeometry: function(xrMesh) {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(xrMesh.vertices), 3));
          geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(xrMesh.indices), 1));
          this.applicaUVScalate(geometry); return geometry;
        }
      });

      // CONTROLLER LOGIC: Taglierino, Inserimento Foto, Grab e Joystick
      AFRAME.registerComponent('strumenti-controller', {
        init: function () {
          this.oggettoAfferrato = null;
          this.puntoInizioTaglio = null;
          this.meshTaglioCorrente = null;
          
          this.matTaglio = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true });

          // Testo olografico di stato sopra il controller
          this.testoUI = document.createElement('a-text');
          this.testoUI.setAttribute('value', 'Mod: TAGLIO');
          this.testoUI.setAttribute('position', '0 0.12 -0.1');
          this.testoUI.setAttribute('scale', '0.18 0.18 0.18');
          this.testoUI.setAttribute('color', '#00FFCC');
          this.testoUI.setAttribute('align', 'center');
          this.el.appendChild(this.testoUI);

          // Tasto A e X: Mostra/Nascondi Mesh
          this.el.addEventListener('abuttondown', () => this.attivaToggleMesh());
          this.el.addEventListener('xbuttondown', () => this.attivaToggleMesh());
          
          // Tasto B: Applica/Togli Immagine di sfondo
          this.el.addEventListener('bbuttondown', () => {
            const gestore = this.el.sceneEl.components['gestore-spazio'];
            if (gestore) gestore.toggleImmagineSfondo();
          });
          
          // Tasto Y: Cambia Modalità (Taglio <-> Foto)
          this.el.addEventListener('ybuttondown', () => {
            window.modalitaStrumento = window.modalitaStrumento === 'taglio' ? 'foto' : 'taglio';
            this.testoUI.setAttribute('value', window.modalitaStrumento === 'taglio' ? 'Mod: TAGLIO' : 'Mod: FOTO');
          });

          // GRILLETTO: Inizia Taglio o Posiziona Foto
          this.el.addEventListener('triggerdown', () => {
            const hit = this.el.components.raycaster.intersections[0];
            if (!hit || !hit.object.el.classList.contains('superficie')) return;

            if (window.modalitaStrumento === 'taglio') {
              // Crea un rettangolo geometrico invisibile per il taglio
              const entitaBuco = document.createElement('a-entity');
              entitaBuco.classList.add('buco');
              
              const geom = new THREE.BoxGeometry(0.01, 0.01, 0.2);
              const mesh = new THREE.Mesh(geom, this.matTaglio);
              mesh.renderOrder = -1;
              entitaBuco.setObject3D('mesh', mesh);
              
              entitaBuco.object3D.position.copy(hit.point);
              this.el.sceneEl.appendChild(entitaBuco);
              
              this.puntoInizioTaglio = hit.point.clone();
              this.meshTaglioCorrente = entitaBuco.object3D;
            } 
            else if (window.modalitaStrumento === 'foto') {
              if (window.fotoAggiuntive.length > 0) {
                const texFoto = window.fotoAggiuntive[Math.floor(Math.random() * window.fotoAggiuntive.length)];
                
                const fotoEl = document.createElement('a-entity');
                fotoEl.classList.add('spostabile');
                
                const mat = new THREE.MeshBasicMaterial({ map: texFoto, transparent: true, side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), mat);
                fotoEl.setObject3D('mesh', mesh);
                
                const normale = hit.face.normal.clone();
                const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
                normale.applyMatrix3(normalMatrix).normalize();
                
                fotoEl.object3D.position.copy(hit.point.clone().add(normale.multiplyScalar(0.02)));
                fotoEl.object3D.lookAt(hit.point.clone().add(normale));
                
                this.el.sceneEl.appendChild(fotoEl);
              }
            }
          });

          this.el.addEventListener('triggerup', () => {
            this.puntoInizioTaglio = null;
            this.meshTaglioCorrente = null;
          });

          // GRIP: Afferra Schermo/Foto o Elimina Taglio
          this.el.addEventListener('gripdown', () => {
            const hits = this.el.components.raycaster.intersections;
            
            const hitBuco = hits.find(h => h.object.el && h.object.el.classList.contains('buco'));
            if (hitBuco) {
               hitBuco.object.el.parentNode.removeChild(hitBuco.object.el);
               return;
            }

            const hitSpostabile = hits.find(h => h.object.el && h.object.el.classList.contains('spostabile'));
            if (hitSpostabile) {
              this.oggettoAfferrato = hitSpostabile.object.el.object3D;
              this.el.object3D.attach(this.oggettoAfferrato);
            }
          });
          
          this.el.addEventListener('gripup', () => { 
            if (this.oggettoAfferrato) {
              this.el.sceneEl.object3D.attach(this.oggettoAfferrato);
              this.oggettoAfferrato = null;
            }
          });

          // JOYSTICK: Avvicina/Allontana e Ridimensiona Oggetti Afferrati
          this.el.addEventListener('thumbstickmoved', (e) => {
            if (this.oggettoAfferrato) {
              if (Math.abs(e.detail.y) > 0.1) {
                this.oggettoAfferrato.translateZ(e.detail.y * 0.05);
              }
              if (Math.abs(e.detail.x) > 0.1) {
                const s = 1 + (e.detail.x * 0.04);
                this.oggettoAfferrato.scale.multiplyScalar(Math.max(0.1, s));
              }
            }
          });
        },

        tick: function () {
          // Trascina il rettangolo di taglio in tempo reale
          if (this.puntoInizioTaglio && this.meshTaglioCorrente) {
            const hit = this.el.components.raycaster.intersections[0];
            if (hit) {
              const centro = new THREE.Vector3().addVectors(this.puntoInizioTaglio, hit.point).multiplyScalar(0.5);
              const distanza = this.puntoInizioTaglio.distanceTo(hit.point);
              
              this.meshTaglioCorrente.position.copy(centro);
              const meshObj = this.meshTaglioCorrente.getObject3D('mesh');
              if (meshObj) {
                meshObj.scale.set(Math.max(distanza, 0.05), Math.max(distanza, 0.05), 1);
              }
            }
          }
        },

        attivaToggleMesh: function() {
          const gestore = this.el.sceneEl.components['gestore-spazio'];
          if (gestore) gestore.toggleVisibilitaMesh();
        }
      });
    </script>
  </head>
  <body>

    <!-- INTERFACCIA 2D (Spare in AR) -->
    <div id="ui-2d">
      <h3 style="margin-top:0;">1. Sfondo Muri</h3>
      <input type="file" id="file-sfondo" accept="image/*" style="width:100%">
      <div id="status-sfondo" style="color: #4CAF50; font-size:12px; margin-top:5px;">In attesa...</div>
      
      <hr style="margin: 10px 0;">

      <h3 style="margin-top:0;">2. Quadri (Multipli)</h3>
      <input type="file" id="file-foto" accept="image/*" multiple style="width:100%">
      <div id="status-foto" style="color: #4CAF50; font-size:12px; margin-top:5px;">In attesa...</div>
      
      <hr style="margin: 10px 0;">
      
      <h3 style="margin-top:0;">3. Schermo PC</h3>
      <button id="btn-connetti-pc" class="btn-ui" style="background: #2196F3;">Apri Canale PC</button>
    </div>

    <!-- SCENA AR -->
    <a-scene webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, plane-detection, mesh, mesh-detection;" gestore-spazio>
      
      <a-assets>
        <video id="video-pc-ricevuto" autoplay muted playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-entity environment="preset: none; skyType: none; lighting: none;"></a-entity>

      <!-- CONTROLLER -->
      <a-entity laser-controls="hand: right" oculus-touch-controls="hand: right" raycaster="objects: .superficie, .buco, .spostabile; far: 10;" strumenti-controller></a-entity>
      <a-entity laser-controls="hand: left" oculus-touch-controls="hand: left" raycaster="objects: .superficie, .buco, .spostabile; far: 10;" strumenti-controller></a-entity>

      <!-- SCHERMO PC (Spostabile) -->
      <a-video id="schermo-virtuale" class="spostabile" src="#video-pc-ricevuto" width="1.6" height="0.9" position="0 1.2 -2.5" visible="false"></a-video>

    </a-scene>
  </body>
</html>
