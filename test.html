<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
  
    <title>Stanza Verde AR - Mesh Esatta</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('colora-mesh-verde', {
        init: function () {
          this.meshes = new Map();
          
          // Materiale verde per la mesh. 
          // Consiglio: cambia wireframe in 'true' se vuoi vedere la griglia stile Matrix
          this.material = new THREE.MeshBasicMaterial({
            color: 0x00FF00,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide,
            wireframe: false 
          });

          this.warningText = document.querySelector('#avviso-stanza');
          this.checkTimer = null;

          this.el.sceneEl.addEventListener('enter-vr', () => {
            if (this.el.sceneEl.is('ar-mode')) {
              this.checkTimer = setTimeout(() => {
                if (this.meshes.size === 0) {
                  this.warningText.setAttribute('visible', 'true');
                }
              }, 4000); // Aspettiamo 4 secondi, la mesh è più pesante da caricare
            }
          });

          this.el.sceneEl.addEventListener('exit-vr', () => {
            clearTimeout(this.checkTimer);
            this.warningText.setAttribute('visible', 'false');
          });
        },

        tick: function () {
          const renderer = this.el.sceneEl.renderer;
          if (!renderer.xr.isPresenting) return;

          const frame = this.el.sceneEl.frame;
          if (!frame) return;

          const refSpace = renderer.xr.getReferenceSpace();
          if (!refSpace) return;

          // Usiamo detectedMeshes invece di detectedPlanes
          if (frame.detectedMeshes) {
            frame.detectedMeshes.forEach(xrMesh => {
              let meshData = this.meshes.get(xrMesh);

              if (!meshData) {
                const geometry = this.createMeshGeometry(xrMesh);
                const threeMesh = new THREE.Mesh(geometry, this.material);
                threeMesh.matrixAutoUpdate = false;
                this.el.object3D.add(threeMesh);
                
                meshData = { mesh: threeMesh, lastTime: xrMesh.lastChangedTime };
                this.meshes.set(xrMesh, meshData);
                this.warningText.setAttribute('visible', 'false');
              } 
              else if (xrMesh.lastChangedTime > meshData.lastTime) {
                meshData.mesh.geometry.dispose();
                meshData.mesh.geometry = this.createMeshGeometry(xrMesh);
                meshData.lastTime = xrMesh.lastChangedTime;
              }
              
              const pose = frame.getPose(xrMesh.meshSpace, refSpace);
              if (pose) {
                meshData.mesh.matrix.fromArray(pose.transform.matrix);
              }
            });
          }
        },

        // Converte i dati grezzi della scansione del Quest in una vera forma 3D Three.js
        createMeshGeometry: function(xrMesh) {
          const geometry = new THREE.BufferGeometry();
          
          // I vertici (punti nello spazio)
          const vertices = new Float32Array(xrMesh.vertices);
          // Gli indici (come i punti si collegano per formare triangoli)
          const indices = new Uint32Array(xrMesh.indices);
          
          geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
          geometry.setIndex(new THREE.BufferAttribute(indices, 1));
          
          // Calcola le normali per permettere alla luce di riflettere (utile se aggiungi luci)
          geometry.computeVertexNormals();
          return geometry;
        }
      });
    </script>
  </head>
  <body>
    <!-- Richiediamo 'mesh' per avere la topologia 3D esatta -->
   <a-scene webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, mesh, plane-detection;" colora-mesh-verde>
      
      <a-entity environment="preset: none; skyType: none; lighting: none;"></a-entity>

      <a-entity id="avviso-stanza" visible="false" position="0 1.5 -1.5">
        <a-plane color="#000" opacity="0.8" width="2" height="0.6" position="0 0 -0.01"></a-plane>
        <a-text 
          value="Nessuna Mesh trovata!\n\n1. Controlla di aver scansionato la stanza\n2. Consenti la condivisione dei Dati Spaziali quando il browser te lo chiede" 
          align="center" 
          color="#FF3333" 
          width="4">
        </a-text>
      </a-entity>

    </a-scene>
  </body>
</html>
