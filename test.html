<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Studio - Bolla e Texture</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      #ui-2d {
        position: absolute; top: 20px; left: 20px; z-index: 999;
        background: rgba(255, 255, 255, 0.95); padding: 20px;
        border-radius: 10px; font-family: sans-serif;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
    </style>
    <script>
      window.userTexture = null;

      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('file-upload').addEventListener('change', function(e) {
          const file = e.target.files[0];
          if (file) {
            const url = URL.createObjectURL(file);
            document.getElementById('status').innerText = "Caricamento in corso...";
            
            const img = new Image();
            img.onload = function() {
              const texture = new THREE.Texture(img);
              texture.wrapS = THREE.ClampToEdgeWrapping; // Forza a non ripetersi mai
              texture.wrapT = THREE.ClampToEdgeWrapping;
              texture.minFilter = THREE.LinearFilter;
              texture.needsUpdate = true;
              
              window.userTexture = texture;
              document.getElementById('status').innerText = "✅ Immagine pronta! Entra in AR.";
            };
            img.src = url;
          }
        });
      });

      AFRAME.registerComponent('gestore-spazio', {
        init: function () {
          this.planes = new Map();
          this.meshes = new Map();
          this.meshVisibile = true;
          this.usaImmagine = false;
          
          // Aggiunto polygonOffset per evitare lo sfarfallio (Z-fighting)
          this.matWireframe = new THREE.MeshBasicMaterial({
            color: 0x00FF00, transparent: true, opacity: 0.6,
            side: THREE.DoubleSide, wireframe: true,
            polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
          });

          this.matImmagine = new THREE.MeshBasicMaterial({
            color: 0xFFFFFF, transparent: true, opacity: 0.95,
            side: THREE.DoubleSide,
            polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
          });

          document.querySelector('#btn-immagine').addEventListener('click', () => {
            if (window.userTexture) {
              this.usaImmagine = !this.usaImmagine;
              if (this.usaImmagine) {
                this.matImmagine.map = window.userTexture;
                this.matImmagine.needsUpdate = true;
                this.aggiornaMateriali(this.matImmagine);
                document.querySelector('#testo-btn-img').setAttribute('value', 'Rimetti Griglia');
              } else {
                this.aggiornaMateriali(this.matWireframe);
                document.querySelector('#testo-btn-img').setAttribute('value', 'Applica Immagine');
              }
            }
          });
        },

        toggleVisibilitaMesh: function() {
          this.meshVisibile = !this.meshVisibile;
          this.matWireframe.opacity = this.meshVisibile ? 0.6 : 0.0;
          this.matImmagine.opacity = this.meshVisibile ? 0.95 : 0.0;
        },

        aggiornaMateriali: function(nuovoMateriale) {
          this.planes.forEach(d => d.entity.getObject3D('mesh').material = nuovoMateriale);
          this.meshes.forEach(d => d.entity.getObject3D('mesh').material = nuovoMateriale);
        },

        tick: function () {
          const renderer = this.el.sceneEl.renderer;
          if (!renderer.xr.isPresenting) return;
          const frame = this.el.sceneEl.frame;
          if (!frame) return;
          const refSpace = renderer.xr.getReferenceSpace();
          if (!refSpace) return;

          const materialeAttuale = this.usaImmagine ? this.matImmagine : this.matWireframe;

          if (frame.detectedPlanes) {
            frame.detectedPlanes.forEach(plane => {
              let pData = this.planes.get(plane);
              if (!pData) {
                const entity = this.creaEntitaSuperficie(this.createPlaneGeometry(plane), materialeAttuale);
                pData = { entity: entity, lastTime: plane.lastChangedTime };
                this.planes.set(plane, pData);
              } else if (plane.lastChangedTime > pData.lastTime) {
                pData.entity.getObject3D('mesh').geometry.dispose();
                pData.entity.getObject3D('mesh').geometry = this.createPlaneGeometry(plane);
                pData.lastTime = plane.lastChangedTime;
              }
              const pose = frame.getPose(plane.planeSpace, refSpace);
              if (pose) pData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }

          if (frame.detectedMeshes) {
            frame.detectedMeshes.forEach(xrMesh => {
              let mData = this.meshes.get(xrMesh);
              if (!mData) {
                const entity = this.creaEntitaSuperficie(this.createMeshGeometry(xrMesh), materialeAttuale);
                mData = { entity: entity, lastTime: xrMesh.lastChangedTime };
                this.meshes.set(xrMesh, mData);
              } else if (xrMesh.lastChangedTime > mData.lastTime) {
                mData.entity.getObject3D('mesh').geometry.dispose();
                mData.entity.getObject3D('mesh').geometry = this.createMeshGeometry(xrMesh);
                mData.lastTime = xrMesh.lastChangedTime;
              }
              const pose = frame.getPose(xrMesh.meshSpace, refSpace);
              if (pose) mData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }
        },

        creaEntitaSuperficie: function(geometry, materiale) {
          const entity = document.createElement('a-entity');
          entity.classList.add('superficie'); 
          const mesh = new THREE.Mesh(geometry, materiale);
          entity.setObject3D('mesh', mesh);
          entity.object3D.matrixAutoUpdate = false;
          this.el.sceneEl.appendChild(entity);
          return entity;
        },

        applicaUVEspanse: function(geometry) {
          geometry.computeBoundingBox();
          const box = geometry.boundingBox;
          if (!box) return;

          const pos = geometry.attributes.position;
          const uvs = new Float32Array(pos.count * 2);

          const sizeX = box.max.x - box.min.x;
          const sizeY = box.max.y - box.min.y;
          const sizeZ = box.max.z - box.min.z;

          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const y = pos.getY(i);
            const z = pos.getZ(i);

            let u = 0, v = 0;
            if (sizeY < 0.1) {
              u = sizeX > 0 ? (x - box.min.x) / sizeX : 0;
              v = sizeZ > 0 ? (z - box.min.z) / sizeZ : 0;
            } else {
              const orizzontale = sizeX > sizeZ ? sizeX : sizeZ;
              const asseOrizzontale = sizeX > sizeZ ? x : z;
              const minOrizzontale = sizeX > sizeZ ? box.min.x : box.min.z;

              u = orizzontale > 0 ? (asseOrizzontale - minOrizzontale) / orizzontale : 0;
              v = sizeY > 0 ? (y - box.min.y) / sizeY : 0;
            }

            // BLOCCO DI SICUREZZA: Impossibile sforare il range 0.0 - 1.0 (Niente più ripetizioni)
            uvs[i * 2] = Math.max(0, Math.min(1, u));
            uvs[i * 2 + 1] = Math.max(0, Math.min(1, v));
          }
          
          geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
        },

        createPlaneGeometry: function(plane) {
          const shape = new THREE.Shape();
          if (plane.polygon.length > 0) {
            shape.moveTo(plane.polygon[0].x, plane.polygon[0].z);
            for (let i = 1; i < plane.polygon.length; i++) shape.lineTo(plane.polygon[i].x, plane.polygon[i].z);
          }
          const geometry = new THREE.ShapeGeometry(shape);
          geometry.rotateX(Math.PI / 2); 
          this.applicaUVEspanse(geometry); 
          return geometry;
        },

        createMeshGeometry: function(xrMesh) {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(xrMesh.vertices), 3));
          geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(xrMesh.indices), 1));
          geometry.computeVertexNormals();
          this.applicaUVEspanse(geometry); 
          return geometry;
        }
      });

      // COMPONENTE PER LA CREAZIONE DELLA "BOLLA / BUCO"
      AFRAME.registerComponent('strumento-buco', {
        init: function () {
          this.bollaCorrente = null;
          this.geomSfera = new THREE.SphereGeometry(1, 32, 32);
          
          // Questo è il materiale "Magico". colorWrite=false e depthWrite=true 
          // significa che è invisibile ma cancella la mesh dietro di sé!
          this.matBuco = new THREE.MeshBasicMaterial({
            colorWrite: false,
            depthWrite: true
          });

          this.el.addEventListener('triggerdown', () => {
            const raycaster = this.el.components.raycaster;
            const hit = raycaster.intersections[0];
            
            // Se miriamo alla mesh (superficie), creiamo la bolla iniziale
            if (hit && hit.object.el && hit.object.el.classList.contains('superficie')) {
              const bolla = new THREE.Mesh(this.geomSfera, this.matBuco);
              bolla.position.copy(hit.point);
              bolla.scale.set(0.05, 0.05, 0.05); // Inizia piccola (5 cm)
              bolla.renderOrder = -1; // Ordine di rendering speciale: viene disegnata PRIMA della mesh
              
              this.el.sceneEl.object3D.add(bolla);
              this.bollaCorrente = bolla;
            }
          });

          this.el.addEventListener('triggerup', () => {
            // Quando lasci il grilletto, smettiamo di farla crescere e rimane lì fissa
            this.bollaCorrente = null; 
          });
        },

        tick: function (time, delta) {
          // Finché tieni premuto il grilletto, la bolla cresce
          if (this.bollaCorrente) {
            const crescita = (0.5 * delta) / 1000; // Cresce di mezzo metro al secondo
            this.bollaCorrente.scale.addScalar(crescita);
            
            // Limite massimo per non coprire tutto il mondo (raggio 1.5 metri max)
            if (this.bollaCorrente.scale.x > 1.5) {
              this.bollaCorrente.scale.set(1.5, 1.5, 1.5);
            }
          }
        }
      });

      // CONTROLLO TASTI (Nascondi Mesh e Nascondi Pannello)
      AFRAME.registerComponent('controlli-base', {
        init: function () {
          // Tasto A o X per nascondere/mostrare la mesh
          this.el.addEventListener('abuttondown', () => this.attivaToggleMesh());
          this.el.addEventListener('xbuttondown', () => this.attivaToggleMesh());
          
          // Tasto Y per nascondere/mostrare il pannello UI dell'immagine
          this.el.addEventListener('ybuttondown', () => {
            const pannello = document.querySelector('#pannello-ar');
            if (pannello) {
              const visibile = pannello.getAttribute('visible');
              pannello.setAttribute('visible', !visibile);
            }
          });
        },
        
        attivaToggleMesh: function() {
          const gestore = this.el.sceneEl.components['gestore-spazio'];
          if (gestore) gestore.toggleVisibilitaMesh();
        }
      });
    </script>
  </head>
  <body>

    <div id="ui-2d">
      <h2>1. Scegli una foto per la stanza</h2>
      <input type="file" id="file-upload" accept="image/*"><br><br>
      <span id="status" style="color: #4CAF50; font-weight: bold;">In attesa dell'immagine...</span>
    </div>

    <a-scene webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, plane-detection, mesh, mesh-detection;" gestore-spazio>
      <a-entity environment="preset: none; skyType: none; lighting: none;"></a-entity>

      <!-- Controller Destro e Sinistro con il nuovo strumento per fare i buchi -->
      <a-entity laser-controls="hand: right" oculus-touch-controls="hand: right" raycaster="objects: .interfaccia, .superficie; far: 10;" controlli-base strumento-buco></a-entity>
      <a-entity laser-controls="hand: left" oculus-touch-controls="hand: left" raycaster="objects: .interfaccia, .superficie; far: 10;" controlli-base strumento-buco></a-entity>

      <!-- PANNELLO AR (Raccolto in un'entità per essere nascosto con Y) -->
      <a-entity id="pannello-ar" position="0 1.2 -1.5">
        <a-text value="Menu AR (Nascondi con Y)" align="center" position="0 0.4 0" color="#FFFFFF" scale="0.7 0.7 0.7"></a-text>
        
        <a-entity id="btn-immagine" class="interfaccia" geometry="primitive: plane; width: 1.2; height: 0.3" material="color: #4CAF50" position="0 0.1 0">
          <a-text id="testo-btn-img" value="Applica Immagine" align="center" color="#FFF" z-offset="0.01"></a-text>
        </a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
