<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Spawner - Appoggia Oggetti 3D</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('gestore-spazio', {
        init: function () {
          this.planes = new Map();
          this.meshes = new Map();
          
          // Il materiale per la mesh. Inizialmente visibile.
          this.material = new THREE.MeshBasicMaterial({
            color: 0x00FF00,
            transparent: true,
            opacity: 0.5,
            side: THREE.DoubleSide,
            wireframe: true
          });

          // Logica del bottone per nascondere/mostrare la mesh
          const btnVisibilita = document.querySelector('#btn-visibilita');
          let meshVisibile = true;

          btnVisibilita.addEventListener('click', () => {
            meshVisibile = !meshVisibile;
            this.material.visible = meshVisibile; // Questo rende invisibile la mesh ma mantiene le collisioni!
            
            const testo = meshVisibile ? 'Nascondi Mesh' : 'Mostra Mesh';
            btnVisibilita.querySelector('a-text').setAttribute('value', testo);
          });
        },

        tick: function () {
          const renderer = this.el.sceneEl.renderer;
          if (!renderer.xr.isPresenting) return;
          const frame = this.el.sceneEl.frame;
          if (!frame) return;
          const refSpace = renderer.xr.getReferenceSpace();
          if (!refSpace) return;

          // Gestione Piani
          if (frame.detectedPlanes) {
            frame.detectedPlanes.forEach(plane => {
              let pData = this.planes.get(plane);
              if (!pData) {
                const entity = this.creaEntitaSuperficie(this.createPlaneGeometry(plane));
                pData = { entity: entity, lastTime: plane.lastChangedTime };
                this.planes.set(plane, pData);
              } else if (plane.lastChangedTime > pData.lastTime) {
                pData.entity.getObject3D('mesh').geometry.dispose();
                pData.entity.getObject3D('mesh').geometry = this.createPlaneGeometry(plane);
                pData.lastTime = plane.lastChangedTime;
              }
              const pose = frame.getPose(plane.planeSpace, refSpace);
              if (pose) pData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }

          // Gestione Mesh
          if (frame.detectedMeshes) {
            frame.detectedMeshes.forEach(xrMesh => {
              let mData = this.meshes.get(xrMesh);
              if (!mData) {
                const entity = this.creaEntitaSuperficie(this.createMeshGeometry(xrMesh));
                mData = { entity: entity, lastTime: xrMesh.lastChangedTime };
                this.meshes.set(xrMesh, mData);
              } else if (xrMesh.lastChangedTime > mData.lastTime) {
                mData.entity.getObject3D('mesh').geometry.dispose();
                mData.entity.getObject3D('mesh').geometry = this.createMeshGeometry(xrMesh);
                mData.lastTime = xrMesh.lastChangedTime;
              }
              const pose = frame.getPose(xrMesh.meshSpace, refSpace);
              if (pose) mData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }
        },

        // Funzione per creare un'entità A-Frame cliccabile (invece di una mesh grezza)
        creaEntitaSuperficie: function(geometry) {
          const entity = document.createElement('a-entity');
          // Aggiungiamo la classe 'superficie' così il raggio laser la riconosce
          entity.classList.add('superficie'); 
          const mesh = new THREE.Mesh(geometry, this.material);
          entity.setObject3D('mesh', mesh);
          entity.object3D.matrixAutoUpdate = false;
          this.el.sceneEl.appendChild(entity);
          return entity;
        },

        // Geometrie
        createPlaneGeometry: function(plane) {
          const shape = new THREE.Shape();
          if (plane.polygon.length > 0) {
            shape.moveTo(plane.polygon[0].x, plane.polygon[0].z);
            for (let i = 1; i < plane.polygon.length; i++) shape.lineTo(plane.polygon[i].x, plane.polygon[i].z);
          }
          const geometry = new THREE.ShapeGeometry(shape);
          geometry.rotateX(Math.PI / 2); 
          return geometry;
        },

        createMeshGeometry: function(xrMesh) {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(xrMesh.vertices), 3));
          geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(xrMesh.indices), 1));
          geometry.computeVertexNormals();
          return geometry;
        }
      });

      // Componente per piazzare gli oggetti 3D
      AFRAME.registerComponent('spawner-oggetti', {
        init: function () {
          // Ascolta il click del controller
          this.el.addEventListener('click', (evento) => {
            // Controlla se abbiamo colpito qualcosa che ha la classe 'superficie'
            if (evento.detail.intersectedEl && evento.detail.intersectedEl.classList.contains('superficie')) {
              
              // Prende il punto esatto di impatto del laser
              const puntoImpatto = evento.detail.intersection.point;

              // Crea un nuovo modello 3D (qui uso la scatola inclusa, ma puoi usare un GLTF)
              const nuovoOggetto = document.createElement('a-entity');
              
              // SE VUOI USARE UN MODELLO IMPORTATO (.glb), usa questo:
              // nuovoOggetto.setAttribute('gltf-model', '#mio-modello');
              
              // Per ora creiamo un cubo rosso come esempio
              nuovoOggetto.setAttribute('geometry', 'primitive: box; width: 0.2; height: 0.2; depth: 0.2');
              nuovoOggetto.setAttribute('material', 'color: red');
              
              // Lo posiziona esattamente dove ha colpito il laser, alzandolo leggermente (metà della sua altezza) 
              // per non farlo compenetrare nel tavolo/pavimento
              nuovoOggetto.setAttribute('position', `${puntoImpatto.x} ${puntoImpatto.y + 0.1} ${puntoImpatto.z}`);
              
              // Aggiunge l'oggetto alla scena
              this.el.sceneEl.appendChild(nuovoOggetto);
            }
          });
        }
      });
    </script>
  </head>
  <body>

    <a-scene webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, plane-detection, mesh, mesh-detection;" gestore-spazio>
      
      <!-- Puoi caricare qui il tuo modello 3D -->
      <a-assets>
        <!-- <a-asset-item id="mio-modello" src="percorso/del/tuo/modello.glb"></a-asset-item> -->
      </a-assets>

      <a-entity environment="preset: none; skyType: none; lighting: none;"></a-entity>

      <!-- CONTROLLER: Diciamo al raggio laser di intercettare SOLO il pannello UI (.interfaccia) e le superfici scansionate (.superficie) -->
      <a-entity laser-controls="hand: right" raycaster="objects: .interfaccia, .superficie; far: 10;" spawner-oggetti></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .interfaccia, .superficie; far: 10;" spawner-oggetti></a-entity>

      <!-- PANNELLO UI (Aggiunta classe 'interfaccia') -->
      <a-entity position="0 1.2 -1.5">
        <a-entity id="btn-visibilita" class="interfaccia" geometry="primitive: plane; width: 1.2; height: 0.4" material="color: #333333" position="0 0 0">
          <a-text value="Nascondi Mesh" align="center" color="#FFF" z-offset="0.01"></a-text>
        </a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
