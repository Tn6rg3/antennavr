<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Studio Pro - Definitivo</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
      #ui-2d {
        position: absolute; top: 20px; left: 20px; z-index: 999;
        background: rgba(255, 255, 255, 0.95); padding: 20px;
        border-radius: 10px; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px;
      }
      .btn-ui { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
    </style>
    <script>
      // Variabile Globale per la dimensione dell'immagine (Modificabile col Joystick)
      window.userTexture = null;
      window.scalaImmagineMetri = 4.0;

      document.addEventListener('DOMContentLoaded', () => {
        // Nascondiamo il menu Web appena entriamo in AR
        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener('enter-vr', () => { document.getElementById('ui-2d').style.display = 'none'; });
        sceneEl.addEventListener('exit-vr', () => { document.getElementById('ui-2d').style.display = 'block'; });

        // 1. CARICAMENTO IMMAGINE
        document.getElementById('file-upload').addEventListener('change', function(e) {
          const file = e.target.files[0];
          if (file) {
            const url = URL.createObjectURL(file);
            document.getElementById('status-img').innerText = "Caricamento...";
            const img = new Image();
            img.onload = function() {
              const texture = new THREE.Texture(img);
              texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
              texture.minFilter = THREE.LinearFilter; texture.magFilter = THREE.LinearFilter;
              texture.generateMipmaps = false; texture.needsUpdate = true;
              window.userTexture = texture;
              document.getElementById('status-img').innerText = "✅ Immagine pronta!";
            };
            img.src = url;
          }
        });

        // 2. RICEZIONE SCHERMO DAL PC
        document.getElementById('btn-connetti-pc').addEventListener('click', () => {
          const btn = document.getElementById('btn-connetti-pc');
          btn.innerText = "Attivazione canale...";
          btn.style.background = "#FF9800";
          
          const peerQuest = new Peer('quest-italia-pro-847291'); 
          
          peerQuest.on('open', () => {
            btn.innerText = "⏳ In attesa del PC... (Apri il PC ora)";
          });

          peerQuest.on('call', call => {
            call.answer(); 
            call.on('stream', flussoVideoRemoto => {
              const videoElemento = document.getElementById('video-pc-ricevuto');
              videoElemento.srcObject = flussoVideoRemoto;
              
              videoElemento.play().then(() => {
                btn.innerText = "✅ PC Connesso!";
                btn.style.background = "#4CAF50";
                document.querySelector('#schermo-virtuale').setAttribute('visible', 'true');
              }).catch(e => {
                btn.innerText = "Errore Riproduzione.";
                console.error(e);
              });
            });
          });

          peerQuest.on('error', err => {
            btn.innerText = "Errore Rete. Ricarica la pagina.";
            btn.style.background = "#F44336";
          });
        });
      });

      // CORE AR (Gestione dello spazio e applicazione texture)
      AFRAME.registerComponent('gestore-spazio', {
        init: function () {
          this.planes = new Map(); this.meshes = new Map();
          this.meshVisibile = true; this.usaImmagine = false;
          
          this.matWirePiani = new THREE.MeshBasicMaterial({ color: 0x00FF00, transparent: true, opacity: 0.6, side: THREE.DoubleSide, wireframe: true, polygonOffset: true, polygonOffsetFactor: 3, polygonOffsetUnits: 3 });
          this.matImgPiani = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.95, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 3, polygonOffsetUnits: 3 });
          this.matWireMesh = new THREE.MeshBasicMaterial({ color: 0x00FF00, transparent: true, opacity: 0.6, side: THREE.DoubleSide, wireframe: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
          this.matImgMesh = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.95, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
        },

        // Chiamata dal controller (Tasto B) per attivare l'immagine
        toggleImmagine: function() {
          if (window.userTexture) {
            this.usaImmagine = !this.usaImmagine;
            this.matImgPiani.map = window.userTexture; this.matImgMesh.map = window.userTexture;
            this.matImgPiani.needsUpdate = true; this.matImgMesh.needsUpdate = true;
            this.aggiornaMateriali();
          }
        },

        toggleVisibilitaMesh: function() {
          this.meshVisibile = !this.meshVisibile;
          const oG = this.meshVisibile ? 0.6 : 0.0; const oI = this.meshVisibile ? 0.95 : 0.0;
          this.matWirePiani.opacity = oG; this.matWireMesh.opacity = oG;
          this.matImgPiani.opacity = oI; this.matImgMesh.opacity = oI;
        },

        aggiornaMateriali: function() {
          this.planes.forEach(d => { d.entity.getObject3D('mesh').material = this.usaImmagine ? this.matImgPiani : this.matWirePiani; });
          this.meshes.forEach(d => { d.entity.getObject3D('mesh').material = this.usaImmagine ? this.matImgMesh : this.matWireMesh; });
        },

        tick: function () {
          const renderer = this.el.sceneEl.renderer; if (!renderer.xr.isPresenting) return;
          const frame = this.el.sceneEl.frame; if (!frame) return;
          const refSpace = renderer.xr.getReferenceSpace(); if (!refSpace) return;

          if (frame.detectedPlanes) {
            frame.detectedPlanes.forEach(plane => {
              let pData = this.planes.get(plane);
              if (!pData) {
                const mat = this.usaImmagine ? this.matImgPiani : this.matWirePiani;
                const entity = this.creaEntitaSuperficie(this.createPlaneGeometry(plane), mat);
                pData = { entity: entity, lastTime: plane.lastChangedTime };
                this.planes.set(plane, pData);
              } else if (plane.lastChangedTime > pData.lastTime) {
                pData.entity.getObject3D('mesh').geometry.dispose();
                pData.entity.getObject3D('mesh').geometry = this.createPlaneGeometry(plane);
                pData.lastTime = plane.lastChangedTime;
              }
              const pose = frame.getPose(plane.planeSpace, refSpace);
              if (pose) pData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }
          if (frame.detectedMeshes) {
            frame.detectedMeshes.forEach(xrMesh => {
              let mData = this.meshes.get(xrMesh);
              if (!mData) {
                const mat = this.usaImmagine ? this.matImgMesh : this.matWireMesh;
                const entity = this.creaEntitaSuperficie(this.createMeshGeometry(xrMesh), mat);
                mData = { entity: entity, lastTime: xrMesh.lastChangedTime };
                this.meshes.set(xrMesh, mData);
              } else if (xrMesh.lastChangedTime > mData.lastTime) {
                mData.entity.getObject3D('mesh').geometry.dispose();
                mData.entity.getObject3D('mesh').geometry = this.createMeshGeometry(xrMesh);
                mData.lastTime = xrMesh.lastChangedTime;
              }
              const pose = frame.getPose(xrMesh.meshSpace, refSpace);
              if (pose) mData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }
        },

        creaEntitaSuperficie: function(geometry, materiale) {
          const entity = document.createElement('a-entity');
          entity.classList.add('superficie'); 
          const mesh = new THREE.Mesh(geometry, materiale);
          entity.setObject3D('mesh', mesh);
          entity.object3D.matrixAutoUpdate = false;
          this.el.sceneEl.appendChild(entity); return entity;
        },

        // Calcola e applica le dimensioni dell'immagine
        applicaUVScalate: function(geometry) {
          geometry.computeVertexNormals();
          const pos = geometry.attributes.position, norm = geometry.attributes.normal;
          const uvs = new Float32Array(pos.count * 2);
          const GM = window.scalaImmagineMetri; // Usa la variabile dinamica!

          for (let i = 0; i < pos.count; i++) {
            const nx = Math.abs(norm.getX(i)), ny = Math.abs(norm.getY(i)), nz = Math.abs(norm.getZ(i));
            const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            if (ny >= nx && ny >= nz) { uvs[i*2] = x/GM; uvs[i*2+1] = z/GM; } 
            else if (nx >= ny && nx >= nz) { uvs[i*2] = z/GM; uvs[i*2+1] = y/GM; } 
            else { uvs[i*2] = x/GM; uvs[i*2+1] = y/GM; }
          }
          geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
        },

        // Forza l'aggiornamento di tutte le coordinate UV in tempo reale (Usato dal Joystick)
        aggiornaTutteLeUV: function() {
          this.planes.forEach(d => {
            this.applicaUVScalate(d.entity.getObject3D('mesh').geometry);
            d.entity.getObject3D('mesh').geometry.attributes.uv.needsUpdate = true;
          });
          this.meshes.forEach(d => {
            this.applicaUVScalate(d.entity.getObject3D('mesh').geometry);
            d.entity.getObject3D('mesh').geometry.attributes.uv.needsUpdate = true;
          });
        },

        createPlaneGeometry: function(plane) {
          const shape = new THREE.Shape();
          if (plane.polygon.length > 0) {
            shape.moveTo(plane.polygon[0].x, plane.polygon[0].z);
            for (let i = 1; i < plane.polygon.length; i++) shape.lineTo(plane.polygon[i].x, plane.polygon[i].z);
          }
          const geometry = new THREE.ShapeGeometry(shape); geometry.rotateX(Math.PI / 2); this.applicaUVScalate(geometry); return geometry;
        },
        createMeshGeometry: function(xrMesh) {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(xrMesh.vertices), 3));
          geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(xrMesh.indices), 1));
          this.applicaUVScalate(geometry); return geometry;
        }
      });

      // IL SUPER-CONTROLLER: Gestisce Bolle, Schermo (Collisioni Mesh) e Joystick
      AFRAME.registerComponent('strumenti-controller', {
        init: function () {
          this.bollaAttiva = null; 
          this.azione = null;
          
          this.schermoAfferrato = null;
          this.distanzaAfferro = 0;
          
          this.geomSfera = new THREE.SphereGeometry(1, 32, 32);
          this.matBuco = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true });

          // 1. JOYSTICK (Scalare l'immagine dinamicamente)
          this.el.addEventListener('thumbstickmoved', (e) => {
            // Se spingiamo la levetta su o giù in modo deciso
            if (Math.abs(e.detail.y) > 0.1) {
              // Modifica la grandezza (inversa: spingi su per ingrandire)
              window.scalaImmagineMetri -= e.detail.y * 0.1;
              // Limiti: minimo 50 cm, massimo 20 metri
              window.scalaImmagineMetri = Math.max(0.5, Math.min(20, window.scalaImmagineMetri));
              
              const gestore = this.el.sceneEl.components['gestore-spazio'];
              if (gestore && gestore.usaImmagine) {
                gestore.aggiornaTutteLeUV();
              }
            }
          });

          // 2. TASTI NORMALI (A, X e B)
          this.el.addEventListener('abuttondown', () => this.attivaToggleMesh());
          this.el.addEventListener('xbuttondown', () => this.attivaToggleMesh());
          this.el.addEventListener('bbuttondown', () => {
            const gestore = this.el.sceneEl.components['gestore-spazio'];
            if (gestore) gestore.toggleImmagine();
          });

          // 3. GRILLETTO (Crea e Ingrandisci Bolle sui muri)
          this.el.addEventListener('triggerdown', () => {
            const hit = this.el.components.raycaster.intersections[0];
            if (!hit) return;
            
            if (hit.object.el && hit.object.el.classList.contains('bolla-buco')) {
              this.bollaAttiva = hit.object.el.object3D; this.azione = 'cresce';
            } else if (hit.object.el && hit.object.el.classList.contains('superficie')) {
              const bollaEl = document.createElement('a-entity');
              bollaEl.classList.add('bolla-buco');
              const mesh = new THREE.Mesh(this.geomSfera, this.matBuco);
              mesh.renderOrder = -1;
              bollaEl.setObject3D('mesh', mesh);
              bollaEl.object3D.position.copy(hit.point); bollaEl.object3D.scale.set(0.05, 0.05, 0.05);
              this.el.sceneEl.appendChild(bollaEl);
              this.bollaAttiva = bollaEl.object3D; this.azione = 'cresce';
            }
          });
          this.el.addEventListener('triggerup', () => { this.bollaAttiva = null; });

          // 4. GRIP/PRESA LATERALE (Riduci Bolle o Afferra Schermo)
          this.el.addEventListener('gripdown', () => {
            const raycaster = this.el.components.raycaster;
            const hits = raycaster.intersections;
            
            // Cerca se stiamo mirando a una bolla
            const hitBolla = hits.find(h => h.object.el && h.object.el.classList.contains('bolla-buco'));
            if (hitBolla) {
              this.bollaAttiva = hitBolla.object.el.object3D; this.azione = 'riduce';
              return;
            }

            // Cerca se stiamo mirando allo schermo spostabile (anche se è dietro un muro!)
            const hitSchermo = hits.find(h => h.object.el && h.object.el.classList.contains('spostabile'));
            if (hitSchermo) {
              this.schermoAfferrato = hitSchermo.object.el.object3D;
              this.distanzaAfferro = hitSchermo.distance; // Memorizza la distanza in cui si trovava
            }
          });
          
          this.el.addEventListener('gripup', () => { 
            this.bollaAttiva = null; 
            this.schermoAfferrato = null;
          });
        },

        // 5. ANIMAZIONI IN TEMPO REALE (Spostamento schermo e ridimensionamento bolle)
        tick: function (time, delta) {
          // Logica Bolle
          if (this.bollaAttiva) {
            const velocita = (0.8 * delta) / 1000;
            if (this.azione === 'cresce') {
              this.bollaAttiva.scale.addScalar(velocita);
              if (this.bollaAttiva.scale.x > 3.0) this.bollaAttiva.scale.set(3, 3, 3);
            } else if (this.azione === 'riduce') {
              this.bollaAttiva.scale.subScalar(velocita);
              if (this.bollaAttiva.scale.x <= 0.02) {
                const entita = this.bollaAttiva.el; entita.parentNode.removeChild(entita); this.bollaAttiva = null;
              }
            }
          }

          // Logica Spostamento Schermo (Con blocco sui muri)
          if (this.schermoAfferrato) {
            const raggio = this.el.components.raycaster.raycaster.ray;
            let distanzaIdeale = this.distanzaAfferro;

            // Controlliamo se c'è un muro tra noi e la destinazione ideale
            const hits = this.el.components.raycaster.intersections;
            const hitMuro = hits.find(h => h.object.el && h.object.el.classList.contains('superficie'));
            
            // Se troviamo un muro, e il muro è più vicino della distanza a cui vogliamo mettere lo schermo
            if (hitMuro && hitMuro.distance < distanzaIdeale) {
              // Blocchiamo lo schermo a 15 centimetri davanti al muro!
              distanzaIdeale = hitMuro.distance - 0.15; 
            }

            // Calcola la nuova posizione
            const nuovaPosizione = new THREE.Vector3().copy(raggio.direction).multiplyScalar(distanzaIdeale).add(raggio.origin);
            this.schermoAfferrato.position.copy(nuovaPosizione);

            // Incolla la rotazione del controller allo schermo, così puoi inclinarlo
            const rotazioneController = new THREE.Quaternion();
            this.el.object3D.getWorldQuaternion(rotazioneController);
            this.schermoAfferrato.quaternion.copy(rotazioneController);
          }
        },

        attivaToggleMesh: function() {
          const gestore = this.el.sceneEl.components['gestore-spazio'];
          if (gestore) gestore.toggleVisibilitaMesh();
        }
      });
    </script>
  </head>
  <body>

    <!-- UI 2D (Questo menu sparirà automaticamente appena clicchi Enter AR) -->
    <div id="ui-2d">
      <h3 style="margin-top:0;">1. Foto Stanza</h3>
      <input type="file" id="file-upload" accept="image/*" style="width:100%">
      <div id="status-img" style="color: #4CAF50; font-weight: bold; margin-top:5px; font-size:14px;">In attesa...</div>
      
      <hr style="margin: 15px 0;">
      
      <h3 style="margin-top:0;">2. Schermo PC</h3>
      <button id="btn-connetti-pc" class="btn-ui" style="background: #2196F3;">1. Apri Canale Ricezione</button>
    </div>

    <!-- SCENA AR -->
    <a-scene webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, plane-detection, mesh, mesh-detection;" gestore-spazio>
      
      <a-assets>
        <video id="video-pc-ricevuto" autoplay muted playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-entity environment="preset: none; skyType: none; lighting: none;"></a-entity>

      <!-- CONTROLLER (Aggiunta classe .spostabile al Raycaster per intercettare lo schermo) -->
      <a-entity laser-controls="hand: right" oculus-touch-controls="hand: right" raycaster="objects: .superficie, .bolla-buco, .spostabile; far: 10;" strumenti-controller></a-entity>
      <a-entity laser-controls="hand: left" oculus-touch-controls="hand: left" raycaster="objects: .superficie, .bolla-buco, .spostabile; far: 10;" strumenti-controller></a-entity>

      <!-- MONITOR VIRTUALE SPOSTABILE (Aggiunta classe 'spostabile') -->
      <a-video id="schermo-virtuale" class="spostabile" src="#video-pc-ricevuto" width="1.6" height="0.9" position="0 1.2 -2.5" visible="false"></a-video>

    </a-scene>
  </body>
</html>
