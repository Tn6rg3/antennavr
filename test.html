<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Studio Pro - Disegno Cornici e HD</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
      #ui-2d {
        position: absolute; top: 20px; left: 20px; z-index: 999;
        background: rgba(255, 255, 255, 0.95); padding: 20px;
        border-radius: 10px; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px;
      }
      .btn-ui { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
    </style>
    <script>
      window.userTexture = null; window.fotoAggiuntive = []; 
      window.modalitaStrumento = 'taglio'; // Può essere 'taglio', 'foto', 'schermo'
      window.indiceFoto = 0; 

      document.addEventListener('DOMContentLoaded', () => {
        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener('enter-vr', () => { document.getElementById('ui-2d').style.display = 'none'; });
        sceneEl.addEventListener('exit-vr', () => { document.getElementById('ui-2d').style.display = 'block'; });

        // SFONDO
        document.getElementById('file-sfondo').addEventListener('change', function(e) {
          if (e.target.files[0]) {
            const img = new Image();
            img.onload = function() {
              const tex = new THREE.Texture(img);
              tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
              tex.minFilter = tex.magFilter = THREE.LinearFilter;
              tex.generateMipmaps = false; tex.needsUpdate = true;
              window.userTexture = tex;
              document.getElementById('status-sfondo').innerText = "✅ Sfondo pronto (Usa tasto B)";
            };
            img.src = URL.createObjectURL(e.target.files[0]);
          }
        });

        // FOTO QUADRI
        document.getElementById('file-foto').addEventListener('change', function(e) {
          const files = e.target.files; window.fotoAggiuntive = [];
          for(let i=0; i<files.length; i++) {
            const img = new Image();
            img.onload = function() {
              const tex = new THREE.Texture(img);
              tex.minFilter = tex.magFilter = THREE.LinearFilter;
              tex.generateMipmaps = false; tex.needsUpdate = true;
              window.fotoAggiuntive.push(tex);
              document.getElementById('status-foto').innerText = `✅ ${window.fotoAggiuntive.length} Foto pronte!`;
            };
            img.src = URL.createObjectURL(files[i]);
          }
        });

        // CONNESSIONE PC
        document.getElementById('btn-connetti-pc').addEventListener('click', () => {
          const btn = document.getElementById('btn-connetti-pc');
          btn.innerText = "Attivazione canale..."; btn.style.background = "#FF9800";
          const peerQuest = new Peer('quest-italia-pro-847291'); 
          peerQuest.on('call', call => {
            call.answer(); 
            call.on('stream', stream => {
              const vid = document.getElementById('video-pc-ricevuto');
              vid.srcObject = stream;
              vid.play().then(() => {
                btn.innerText = "✅ PC Connesso!"; btn.style.background = "#4CAF50";
              });
            });
          });
        });
      });

      // CORE AR: SPAZIO
      AFRAME.registerComponent('gestore-spazio', {
        init: function () {
          this.planes = new Map(); this.meshes = new Map();
          this.meshVisibile = true; this.usaImmagine = false;
          
          this.matWirePiani = new THREE.MeshBasicMaterial({ color: 0x00FF00, transparent: true, opacity: 0.6, side: THREE.DoubleSide, wireframe: true, polygonOffset: true, polygonOffsetFactor: 3, polygonOffsetUnits: 3 });
          this.matImgPiani = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.95, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 3, polygonOffsetUnits: 3 });
          this.matWireMesh = new THREE.MeshBasicMaterial({ color: 0x00FF00, transparent: true, opacity: 0.6, side: THREE.DoubleSide, wireframe: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
          this.matImgMesh = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.95, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
        },
        toggleImmagineSfondo: function() {
          if (window.userTexture) {
            this.usaImmagine = !this.usaImmagine;
            this.aggiornaMateriali();
          }
        },
        toggleVisibilitaMesh: function() {
          this.meshVisibile = !this.meshVisibile;
          this.aggiornaMateriali();
        },
        aggiornaMateriali: function() {
          const matPiani = this.meshVisibile ? (this.usaImmagine ? this.matImgPiani : this.matWirePiani) : new THREE.MeshBasicMaterial({visible: false});
          const matMesh = this.meshVisibile ? (this.usaImmagine ? this.matImgMesh : this.matWireMesh) : new THREE.MeshBasicMaterial({visible: false});
          
          if(this.usaImmagine){ this.matImgPiani.map = window.userTexture; this.matImgMesh.map = window.userTexture; }
          
          this.planes.forEach(d => { d.entity.getObject3D('mesh').material = matPiani; });
          this.meshes.forEach(d => { d.entity.getObject3D('mesh').material = matMesh; });
        },
        tick: function (time) {
          const renderer = this.el.sceneEl.renderer; if (!renderer.xr.isPresenting) return;
          const frame = this.el.sceneEl.frame; if (!frame) return;
          const refSpace = renderer.xr.getReferenceSpace(); if (!refSpace) return;
          const sogliaAggiornamentoMs = 500; 

          if (frame.detectedPlanes) {
            frame.detectedPlanes.forEach(plane => {
              let pData = this.planes.get(plane);
              if (!pData) {
                const entity = this.creaEntitaSuperficie(this.createPlaneGeometry(plane));
                pData = { entity: entity, lastTime: plane.lastChangedTime };
                this.planes.set(plane, pData);
              } else if (plane.lastChangedTime > pData.lastTime + sogliaAggiornamentoMs) {
                pData.entity.getObject3D('mesh').geometry.dispose();
                pData.entity.getObject3D('mesh').geometry = this.createPlaneGeometry(plane);
                pData.lastTime = plane.lastChangedTime;
              }
              const pose = frame.getPose(plane.planeSpace, refSpace);
              if (pose) pData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }
          if (frame.detectedMeshes) {
            frame.detectedMeshes.forEach(xrMesh => {
              let mData = this.meshes.get(xrMesh);
              if (!mData) {
                const entity = this.creaEntitaSuperficie(this.createMeshGeometry(xrMesh));
                mData = { entity: entity, lastTime: xrMesh.lastChangedTime };
                this.meshes.set(xrMesh, mData);
              } else if (xrMesh.lastChangedTime > mData.lastTime + sogliaAggiornamentoMs) {
                mData.entity.getObject3D('mesh').geometry.dispose();
                mData.entity.getObject3D('mesh').geometry = this.createMeshGeometry(xrMesh);
                mData.lastTime = xrMesh.lastChangedTime;
              }
              const pose = frame.getPose(xrMesh.meshSpace, refSpace);
              if (pose) mData.entity.object3D.matrix.fromArray(pose.transform.matrix);
            });
          }
          this.aggiornaMateriali();
        },
        creaEntitaSuperficie: function(geometry) {
          const entity = document.createElement('a-entity');
          entity.classList.add('superficie'); 
          const mesh = new THREE.Mesh(geometry, this.matWireMesh);
          entity.setObject3D('mesh', mesh);
          this.el.sceneEl.appendChild(entity); return entity;
        },
        applicaUVScalate: function(geometry) {
          geometry.computeVertexNormals();
          const pos = geometry.attributes.position, norm = geometry.attributes.normal;
          if(!norm) return;
          const uvs = new Float32Array(pos.count * 2); const GM = 4.0;
          for (let i = 0; i < pos.count; i++) {
            const nx = Math.abs(norm.getX(i)), ny = Math.abs(norm.getY(i)), nz = Math.abs(norm.getZ(i));
            const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            if (ny >= nx && ny >= nz) { uvs[i*2] = x/GM; uvs[i*2+1] = z/GM; } 
            else if (nx >= ny && nx >= nz) { uvs[i*2] = z/GM; uvs[i*2+1] = y/GM; } 
            else { uvs[i*2] = x/GM; uvs[i*2+1] = y/GM; }
          }
          geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
        },
        createPlaneGeometry: function(plane) {
          const shape = new THREE.Shape();
          if (plane.polygon.length > 0) {
            shape.moveTo(plane.polygon[0].x, plane.polygon[0].z);
            for (let i = 1; i < plane.polygon.length; i++) shape.lineTo(plane.polygon[i].x, plane.polygon[i].z);
          }
          const geometry = new THREE.ShapeGeometry(shape); geometry.rotateX(Math.PI / 2); this.applicaUVScalate(geometry); return geometry;
        },
        createMeshGeometry: function(xrMesh) {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(xrMesh.vertices), 3));
          geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(xrMesh.indices), 1));
          this.applicaUVScalate(geometry); return geometry;
        }
      });

      // IL SUPER-CONTROLLER CON DISEGNO DELLE CORNICI
      AFRAME.registerComponent('strumenti-controller', {
        init: function () {
          this.oggettoAfferrato = null;
          this.distanzaGrab = 0;
          this.rotOggettoGrab = new THREE.Quaternion();
          this.rotControllerGrab = new THREE.Quaternion();
          
          // Stato Disegno (Trascina e rilascia)
          this.statoDisegno = { attivo: false, pInizio: null, asseX: null, asseY: null, normale: null };
          
          // Materiale Anteprima Azzurrina
          this.matAnteprima = new THREE.MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
          this.entitaAnteprima = document.createElement('a-entity');
          this.entitaAnteprima.setObject3D('mesh', new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.matAnteprima));
          this.entitaAnteprima.setAttribute('visible', 'false');
          this.el.sceneEl.appendChild(this.entitaAnteprima);

          // Taglio 2D Piatto Infallibile
          this.matTaglio = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true });

          this.testoUI = document.createElement('a-text');
          this.testoUI.setAttribute('value', 'Mod: TAGLIERINO');
          this.testoUI.setAttribute('position', '0 0.12 -0.1');
          this.testoUI.setAttribute('scale', '0.15 0.15 0.15');
          this.testoUI.setAttribute('color', '#00FFCC');
          this.testoUI.setAttribute('align', 'center');
          this.el.appendChild(this.testoUI);

          const ottieniNormale = (hit, elController) => {
            const normale = new THREE.Vector3(0, 1, 0);
            try {
              if (hit.face && hit.face.normal) {
                normale.copy(hit.face.normal);
                if (hit.object && hit.object.matrixWorld) {
                  normale.applyMatrix3(new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld)).normalize();
                }
              } else {
                normale.copy(elController.components.raycaster.raycaster.ray.direction).negate().normalize();
              }
            } catch(e) {} 
            return normale;
          };

          this.el.addEventListener('abuttondown', () => this.attivaToggleMesh());
          this.el.addEventListener('xbuttondown', () => this.attivaToggleMesh());
          this.el.addEventListener('bbuttondown', () => {
            const gestore = this.el.sceneEl.components['gestore-spazio'];
            if (gestore) gestore.toggleImmagineSfondo();
          });
          
          // Tasto Y: Taglierino -> Foto -> Schermo PC
          this.el.addEventListener('ybuttondown', () => {
            if(window.modalitaStrumento === 'taglio') window.modalitaStrumento = 'foto';
            else if(window.modalitaStrumento === 'foto') window.modalitaStrumento = 'schermo';
            else window.modalitaStrumento = 'taglio';
            
            let t = 'Mod: TAGLIERINO';
            if (window.modalitaStrumento === 'foto') t = 'Mod: POSIZIONA FOTO';
            if (window.modalitaStrumento === 'schermo') t = 'Mod: POSIZIONA PC';
            
            document.querySelectorAll('[strumenti-controller]').forEach(c => {
              const txt = c.querySelector('a-text'); if(txt) txt.setAttribute('value', t);
            });
          });

          // GRILLETTO GIÙ: Inizia a disegnare la cornice
          this.el.addEventListener('triggerdown', () => {
            const hit = this.el.components.raycaster.intersections[0];
            if (!hit || !hit.object || !hit.object.el || !hit.object.el.classList.contains('superficie')) return;

            this.statoDisegno.attivo = true;
            this.statoDisegno.pInizio = hit.point.clone();
            
            const normale = ottieniNormale(hit, this.el);
            this.statoDisegno.normale = normale;
            
            let up = new THREE.Vector3(0, 1, 0);
            if (Math.abs(normale.y) > 0.9) up.set(0, 0, -1);
            
            this.statoDisegno.asseX = new THREE.Vector3().crossVectors(up, normale).normalize();
            this.statoDisegno.asseY = new THREE.Vector3().crossVectors(normale, this.statoDisegno.asseX).normalize();

            this.entitaAnteprima.setAttribute('visible', 'true');
            this.entitaAnteprima.object3D.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(this.statoDisegno.asseX, this.statoDisegno.asseY, normale));
          });

          // GRILLETTO SU: Genera l'oggetto definitivo nella cornice disegnata
          this.el.addEventListener('triggerup', () => {
            if (!this.statoDisegno.attivo) return;
            this.statoDisegno.attivo = false;
            this.entitaAnteprima.setAttribute('visible', 'false');

            const meshAnteprima = this.entitaAnteprima.getObject3D('mesh');
            const posF = meshAnteprima.position.clone();
            const scX = meshAnteprima.scale.x;
            const scY = meshAnteprima.scale.y;
            const rotF = meshAnteprima.quaternion.clone();
            
            if (window.modalitaStrumento === 'taglio') {
              // TAGLIO 2D: Perfetto e a filo muro
              const buco = document.createElement('a-entity');
              buco.classList.add('buco');
              const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.matTaglio);
              mesh.renderOrder = -1; 
              buco.setObject3D('mesh', mesh);
              buco.object3D.position.copy(posF.add(this.statoDisegno.normale.multiplyScalar(0.005)));
              buco.object3D.quaternion.copy(rotF);
              buco.object3D.scale.set(scX, scY, 1);
              this.el.sceneEl.appendChild(buco);
            } 
            else if (window.modalitaStrumento === 'foto' && window.fotoAggiuntive.length > 0) {
              // FOTO: Prende la dimensione esatta tracciata!
              const texFoto = window.fotoAggiuntive[window.indiceFoto];
              window.indiceFoto = (window.indiceFoto + 1) % window.fotoAggiuntive.length;
              
              const fotoEl = document.createElement('a-entity');
              fotoEl.classList.add('spostabile'); 
              const mat = new THREE.MeshBasicMaterial({ map: texFoto, transparent: true, side: THREE.DoubleSide });
              fotoEl.setObject3D('mesh', new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat));
              
              fotoEl.object3D.position.copy(posF.add(this.statoDisegno.normale.multiplyScalar(0.02))); // Poco avanti
              fotoEl.object3D.quaternion.copy(rotF);
              fotoEl.object3D.scale.set(scX, scY, 1);
              this.el.sceneEl.appendChild(fotoEl);
            }
            else if (window.modalitaStrumento === 'schermo') {
              // SCHERMO PC: Si adatta alla cornice disegnata
              const schermo = document.getElementById('schermo-virtuale');
              schermo.setAttribute('visible', 'true');
              schermo.object3D.position.copy(posF.add(this.statoDisegno.normale.multiplyScalar(0.03))); // Staccato per essere visibile anche nei buchi
              schermo.object3D.quaternion.copy(rotF);
              schermo.object3D.scale.set(scX, scY, 1);
            }
          });

          // GRIP: Afferra o Cancella
          this.el.addEventListener('gripdown', () => {
            const hits = this.el.components.raycaster.intersections;
            const hitBuco = hits.find(h => h && h.object && h.object.el && h.object.el.classList.contains('buco'));
            if (hitBuco) { hitBuco.object.el.parentNode.removeChild(hitBuco.object.el); return; }

            const hitSpostabile = hits.find(h => h && h.object && h.object.el && h.object.el.classList.contains('spostabile'));
            if (hitSpostabile) {
              this.oggettoAfferrato = hitSpostabile.object.el.object3D;
              this.distanzaGrab = hitSpostabile.distance;
              this.rotOggettoGrab.copy(this.oggettoAfferrato.quaternion);
              this.rotControllerGrab.copy(this.el.object3D.quaternion).invert();
            }
          });
          
          this.el.addEventListener('gripup', () => { this.oggettoAfferrato = null; });

          // JOYSTICK
          this.el.addEventListener('thumbstickmoved', (e) => {
            if (this.oggettoAfferrato) {
              if (Math.abs(e.detail.y) > 0.1) this.distanzaGrab = Math.max(0.2, this.distanzaGrab + (e.detail.y * -0.05));
              if (Math.abs(e.detail.x) > 0.1) this.oggettoAfferrato.scale.multiplyScalar(Math.max(0.01, 1 + (e.detail.x * 0.04)));
            }
          });
        },

        // ANIMAZIONE ANTEPRIMA DISEGNO e GRAB
        tick: function () {
          if (this.oggettoAfferrato) {
            const ray = this.el.components.raycaster.raycaster.ray;
            this.oggettoAfferrato.position.copy(ray.direction.clone().multiplyScalar(this.distanzaGrab).add(ray.origin));
            this.oggettoAfferrato.quaternion.copy(this.el.object3D.quaternion.clone().multiply(this.rotControllerGrab).multiply(this.rotOggettoGrab));
          }

          if (this.statoDisegno.attivo) {
            const hit = this.el.components.raycaster.intersections[0];
            if (hit && hit.point) {
              const diff = new THREE.Vector3().subVectors(hit.point, this.statoDisegno.pInizio);
              const larg = Math.max(Math.abs(diff.dot(this.statoDisegno.asseX)), 0.05);
              const alt = Math.max(Math.abs(diff.dot(this.statoDisegno.asseY)), 0.05);
              
              const centro = this.statoDisegno.pInizio.clone()
                  .add(this.statoDisegno.asseX.clone().multiplyScalar(diff.dot(this.statoDisegno.asseX) / 2))
                  .add(this.statoDisegno.asseY.clone().multiplyScalar(diff.dot(this.statoDisegno.asseY) / 2));
              
              this.entitaAnteprima.getObject3D('mesh').position.copy(centro);
              this.entitaAnteprima.getObject3D('mesh').scale.set(larg, alt, 1);
            }
          }
        },
        attivaToggleMesh: function() {
          const gestore = this.el.sceneEl.components['gestore-spazio'];
          if (gestore) gestore.toggleVisibilitaMesh();
        }
      });
    </script>
  </head>
  <body>

    <!-- UI -->
    <div id="ui-2d">
      <h3 style="margin-top:0;">1. Sfondo</h3>
      <input type="file" id="file-sfondo" accept="image/*" style="width:100%">
      <div id="status-sfondo" style="color: #4CAF50; font-size:12px; margin-top:5px;">Attendi...</div>
      <hr style="margin: 10px 0;">
      <h3 style="margin-top:0;">2. Quadri</h3>
      <input type="file" id="file-foto" accept="image/*" multiple style="width:100%">
      <div id="status-foto" style="color: #4CAF50; font-size:12px; margin-top:5px;">Quadri extra</div>
      <hr style="margin: 10px 0;">
      <h3 style="margin-top:0;">3. PC (HD)</h3>
      <button id="btn-connetti-pc" class="btn-ui" style="background: #2196F3;">Apri Canale PC</button>
    </div>

    <!-- AR SCENE (Risoluzione Forzata: framebufferScaleFactor) -->
    <a-scene webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, plane-detection, mesh, mesh-detection; framebufferScaleFactor: 2.0;" gestore-spazio>
      <a-assets>
        <video id="video-pc-ricevuto" autoplay muted playsinline crossorigin="anonymous"></video>
      </a-assets>
      <a-entity environment="preset: none; skyType: none; lighting: none;"></a-entity>

      <!-- CONTROLLERS -->
      <a-entity laser-controls="hand: right" oculus-touch-controls="hand: right" raycaster="objects: .superficie, .buco, .spostabile; far: 10;" strumenti-controller></a-entity>
      <a-entity laser-controls="hand: left" oculus-touch-controls="hand: left" raycaster="objects: .superficie, .buco, .spostabile; far: 10;" strumenti-controller></a-entity>

      <!-- SCHERMO PC (Spostabile) -->
      <!-- Usa width=1 height=1 così si scala perfettamente sulle misure disegnate dal controller -->
      <a-video id="schermo-virtuale" class="spostabile" src="#video-pc-ricevuto" width="1" height="1" visible="false"></a-video>

    </a-scene>
  </body>
</html>
