<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Stanza Verde AR - Piani + Mesh</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('scanner-verde', {
        init: function () {
          // Teniamo traccia sia dei piani che delle mesh
          this.planes = new Map();
          this.meshes = new Map();
          
          // Materiale Stile "Matrix" / Cyberpunk
          this.material = new THREE.MeshBasicMaterial({
            color: 0x00FF00, // Verde brillante
            transparent: true,
            opacity: 0.6,
            side: THREE.DoubleSide,
            wireframe: true // Modifica in 'false' per riavere i pannelli solidi semi-trasparenti
          });
        },

        tick: function () {
          const renderer = this.el.sceneEl.renderer;
          if (!renderer.xr.isPresenting) return;

          const frame = this.el.sceneEl.frame;
          if (!frame) return;

          const refSpace = renderer.xr.getReferenceSpace();
          if (!refSpace) return;

          // 1. GESTIONE DEI PIANI (Muri, Pavimento, Soffitto)
          if (frame.detectedPlanes) {
            frame.detectedPlanes.forEach(plane => {
              let planeData = this.planes.get(plane);

              if (!planeData) {
                const geometry = this.createPlaneGeometry(plane);
                const mesh = new THREE.Mesh(geometry, this.material);
                mesh.matrixAutoUpdate = false;
                this.el.object3D.add(mesh);
                
                planeData = { mesh: mesh, lastTime: plane.lastChangedTime };
                this.planes.set(plane, planeData);
              } else if (plane.lastChangedTime > planeData.lastTime) {
                planeData.mesh.geometry.dispose();
                planeData.mesh.geometry = this.createPlaneGeometry(plane);
                planeData.lastTime = plane.lastChangedTime;
              }
              
              const pose = frame.getPose(plane.planeSpace, refSpace);
              if (pose) planeData.mesh.matrix.fromArray(pose.transform.matrix);
            });
          }

          // 2. GESTIONE DELLE MESH (Mobili, oggetti complessi)
          if (frame.detectedMeshes) {
            frame.detectedMeshes.forEach(xrMesh => {
              let meshData = this.meshes.get(xrMesh);

              if (!meshData) {
                const geometry = this.createMeshGeometry(xrMesh);
                const threeMesh = new THREE.Mesh(geometry, this.material);
                threeMesh.matrixAutoUpdate = false;
                this.el.object3D.add(threeMesh);
                
                meshData = { mesh: threeMesh, lastTime: xrMesh.lastChangedTime };
                this.meshes.set(xrMesh, meshData);
              } else if (xrMesh.lastChangedTime > meshData.lastTime) {
                meshData.mesh.geometry.dispose();
                meshData.mesh.geometry = this.createMeshGeometry(xrMesh);
                meshData.lastTime = xrMesh.lastChangedTime;
              }
              
              const pose = frame.getPose(xrMesh.meshSpace, refSpace);
              if (pose) meshData.mesh.matrix.fromArray(pose.transform.matrix);
            });
          }
        },

        // Geometria per i Piani 2D
        createPlaneGeometry: function(plane) {
          const shape = new THREE.Shape();
          if (plane.polygon.length > 0) {
            shape.moveTo(plane.polygon[0].x, plane.polygon[0].z);
            for (let i = 1; i < plane.polygon.length; i++) {
              shape.lineTo(plane.polygon[i].x, plane.polygon[i].z);
            }
          }
          const geometry = new THREE.ShapeGeometry(shape);
          geometry.rotateX(Math.PI / 2); 
          return geometry;
        },

        // Geometria per le Mesh 3D
        createMeshGeometry: function(xrMesh) {
          const geometry = new THREE.BufferGeometry();
          const vertices = new Float32Array(xrMesh.vertices);
          const indices = new Uint32Array(xrMesh.indices);
          
          geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
          geometry.setIndex(new THREE.BufferAttribute(indices, 1));
          geometry.computeVertexNormals();
          return geometry;
        }
      });
    </script>
  </head>
  <body>
    <!-- Richiediamo TUTTE le funzionalità spaziali per coprire ogni elemento della stanza -->
    <a-scene 
      webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, plane-detection, mesh, mesh-detection;" 
      scanner-verde>
      
      <a-entity environment="preset: none; skyType: none; lighting: none;"></a-entity>
    </a-scene>
  </body>
</html>
