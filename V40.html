<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Antenne AR Pro V48 - Portali AR in Tempo Reale</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Aframe Extras per abilitare il supporto alle Animazioni dei modelli GLB -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  <style>
    #ui-2d-container { position: absolute; top: 15px; left: 15px; z-index: 9999; background: #111; color: #00E676; padding: 15px; border: 2px solid #FFEB3B; border-radius: 8px; font-family: monospace; max-width: 320px; max-height: 90vh; overflow-y: auto; }
    #ui-2d-container h3 { margin: 0 0 5px 0; font-size: 14px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px;}
    #ui-2d-container p { margin: 5px 0; font-size: 11px; color: #fff; line-height: 1.3; }
    #ui-2d-container input, #ui-2d-container select { width: 93%; padding: 6px; background: #222; color: #fff; border: 1px solid #00E676; margin-bottom: 10px; font-family: monospace; }
    #ui-2d-container button { width: 100%; padding: 8px; background: #00E676; color: #000; border: none; font-weight: bold; cursor: pointer; margin-bottom: 5px; }
    #ui-2d-container button.action { background: #FFEB3B; }
    .import-box { background: #222; padding: 10px; border-radius: 6px; margin-bottom: 12px; border: 1px dashed #00E676; }
    hr { border-color: #333; margin: 15px 0; }
  </style>
  <script>
    AFRAME.registerComponent('look-at-camera', { 
      tick: function () { 
        let cameraEl = document.querySelector('#camera'); 
        if (cameraEl && cameraEl.object3D) { 
          let target = new THREE.Vector3();
          cameraEl.object3D.getWorldPosition(target);
          this.el.object3D.lookAt(target); 
        } 
      } 
    });
    
    AFRAME.registerComponent('btn-interaction', {
      init: function () {
        let el = this.el; 
        let mat = el.getAttribute('material');
        let originalColor = mat ? mat.color : '#FFFFFF';
        let originalOpacity = mat && mat.opacity !== undefined ? mat.opacity : 1.0;
        
        el.addEventListener('mouseenter', () => { if(el.getAttribute('material')) el.setAttribute('material', 'opacity', 0.8); });
        el.addEventListener('mouseleave', () => { 
            if(el.getAttribute('material')) {
                el.setAttribute('material', 'opacity', originalOpacity); 
                el.setAttribute('material', 'color', originalColor);
            }
            el.setAttribute('scale', '1 1 1'); 
        });
        el.addEventListener('mousedown', () => { 
            el.setAttribute('scale', '0.95 0.95 0.8'); 
            if(el.getAttribute('material')) el.setAttribute('material', 'color', '#00FFCC'); 
        });
        el.addEventListener('mouseup', () => { 
            el.setAttribute('scale', '1 1 1'); 
            if(el.getAttribute('material')) el.setAttribute('material', 'color', originalColor); 
        });
      }
    });

    // --- COMPONENTI PER I RITAGLI (PORTALI AR) ---
    AFRAME.registerComponent('ritaglio-mask', {
      init: function () {
        let apply = () => {
          let mesh = this.el.getObject3D('mesh');
          if (mesh) mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              node.renderOrder = -1; // FORZA la maschera a disegnarsi PRIMA
              node.material.colorWrite = false;
              node.material.depthWrite = false;
              node.material.stencilWrite = true;
              node.material.stencilRef = 1;
              node.material.stencilFunc = THREE.AlwaysStencilFunc;
              node.material.stencilZPass = THREE.ReplaceStencilOp;
            }
          });
        };
        this.el.addEventListener('model-loaded', apply);
        if (this.el.getObject3D('mesh')) apply();
      }
    });

    AFRAME.registerComponent('ritaglio-content', {
      init: function () {
        let apply = () => {
          let mesh = this.el.getObject3D('mesh');
          if (mesh) mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              node.renderOrder = 1; // FORZA il contenuto a disegnarsi DOPO
              node.material.stencilWrite = true;
              node.material.stencilRef = 1;
              node.material.stencilFunc = THREE.EqualStencilFunc;
            }
          });
        };
        this.el.addEventListener('model-loaded', apply);
        if (this.el.getObject3D('mesh')) apply();
      }
    });

    // --- COMPONENTE PER OCCLUSIONE STANZA (MESH DETECTION) ---
    AFRAME.registerComponent('ar-room-occlusion', {
      init: function () {
        this.meshes = new Map();
        this.occlusionMaterial = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true });
      },
      tick: function () {
        let sceneEl = this.el.sceneEl;
        let frame = sceneEl.frame;
        if (!frame || !sceneEl.is('ar-mode')) return;

        if (frame.detectedMeshes) {
          frame.detectedMeshes.forEach(xrMesh => {
            if (!this.meshes.has(xrMesh)) {
              let geometry = new THREE.BufferGeometry();
              let vertices = xrMesh.vertices;
              let indices = xrMesh.indices;
              
              geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
              geometry.setIndex(new THREE.Uint32BufferAttribute(indices, 1));
              
              let mesh = new THREE.Mesh(geometry, this.occlusionMaterial);
              
              let refSpace = sceneEl.renderer.xr.getReferenceSpace();
              if(refSpace) {
                  let pose = frame.getPose(xrMesh.meshSpace, refSpace);
                  if (pose) {
                    mesh.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                    mesh.quaternion.set(pose.transform.orientation.x, pose.transform.orientation.y, pose.transform.orientation.z, pose.transform.orientation.w);
                  }
              }
              this.el.object3D.add(mesh);
              this.meshes.set(xrMesh, mesh);
            } else {
              let mesh = this.meshes.get(xrMesh);
              let refSpace = sceneEl.renderer.xr.getReferenceSpace();
              if(refSpace) {
                  let pose = frame.getPose(xrMesh.meshSpace, refSpace);
                  if (pose) {
                    mesh.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                    mesh.quaternion.set(pose.transform.orientation.x, pose.transform.orientation.y, pose.transform.orientation.z, pose.transform.orientation.w);
                  }
              }
            }
          });
        }
      }
    });

    function parseSTLGeometry(buffer) {
        let geom = new THREE.BufferGeometry();
        try {
            let reader = new DataView(buffer);
            let isBinary = true;
            let numFaces = 0;
            if (buffer.byteLength > 84) {
                numFaces = reader.getUint32(80, true);
                let expectedSize = 84 + numFaces * 50;
                if (buffer.byteLength !== expectedSize) {
                    let sample = new TextDecoder().decode(new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 512)));
                    if (sample.trim().startsWith('solid') && !sample.includes('\0')) { isBinary = false; }
                }
            } else { isBinary = false; }

            if (isBinary) {
                let pos = []; let normals = []; let offset = 84;
                for (let i = 0; i < numFaces; i++) {
                    let nx = reader.getFloat32(offset, true); let ny = reader.getFloat32(offset + 4, true); let nz = reader.getFloat32(offset + 8, true); offset += 12;
                    for (let v = 0; v < 3; v++) {
                        pos.push(reader.getFloat32(offset, true), reader.getFloat32(offset + 4, true), reader.getFloat32(offset + 8, true)); normals.push(nx, ny, nz); offset += 12;
                    }
                    offset += 2;
                }
                geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                if (normals.length > 0 && normals[0] === 0 && normals[1] === 0 && normals[2] === 0) { geom.computeVertexNormals(); } else { geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3)); }
            } else {
                let text = new TextDecoder().decode(new Uint8Array(buffer)); let pos = [];
                let vertexMatches = text.match(/vertex\s+([\d.\-+eE]+)\s+([\d.\-+eE]+)\s+([\d.\-+eE]+)/g);
                if (vertexMatches) {
                    vertexMatches.forEach(str => { let parts = str.trim().split(/\s+/); pos.push(parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])); });
                    geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geom.computeVertexNormals();
                }
            }
            geom.computeBoundingBox();
            if (geom.boundingBox) {
                let size = new THREE.Vector3();
                geom.boundingBox.getSize(size);
                let maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 20) {
                    geom.scale(0.001, 0.001, 0.001);
                    geom.computeBoundingBox();
                }
                geom.center(); 
                geom.computeBoundingBox();
                geom.translate(0, -geom.boundingBox.min.y, 0); 
            }
        } catch (e) {
            console.error("Errore Parse STL:", e);
        }
        return geom;
    }

    AFRAME.registerComponent('stl-model', {
      schema: { type: 'string' },
      init: function() {
        if (!this.data) return;
        fetch(this.data)
          .then(res => res.arrayBuffer())
          .then(buf => {
            let geom = parseSTLGeometry(buf);
            let mat = new THREE.MeshStandardMaterial({ color: 0x90A4AE, metalness: 0.4, roughness: 0.5 });
            let mesh = new THREE.Mesh(geom, mat);
            this.el.setObject3D('mesh', mesh);
          }).catch(err => console.error("Errore fetch STL:", err));
      }
    });

    AFRAME.registerComponent('ar-antenna-system', {
      init: function () {
        try {
            this.antennaTypes = ['Dipolo', 'End Fed', 'Longwire', 'Verticale', 'MMANA-GAL', 'File Custom'];
            this.bands = ['160m', '80m', '40m', '20m', '15m', '10m', '2m'];
            this.mmanaModels = ['Yagi 3 Elementi', 'Delta Loop', 'Dipolo MMANA', 'Modello Importato'];
            this.maxRadials = 16; 
            
            this.globalTextScale = 0.35; 
            this.currentHeight = 1.0; 
            this.gwState = 'OFF'; 
            this.activeAnchor = null; 
            this.lastTriggerTime = 0; 
            this.calibLocal1 = null; 
            this.calibLocal2 = null;
            
            this.assetLibrary = []; 
            
            this.sceneAnchor = null;
            this.requestingAnchor = false;
            
            this.pointerMode = 'TOUCH';
            this.hitTestSource = null; this.requestingHitTest = false; this.reticleValid = false;
            this.targetReticlePos = new THREE.Vector3(); this.targetReticleQuat = new THREE.Quaternion(); this.lastFloorY = 0; 

            this.triangState = 0; 
            this.triangRay1 = null; this.triangRay2 = null; this.triangResult = null;

            this.antennas = [this.createEmptyAntenna()]; 
            this.activeAntIdx = 0;
            this.current = this.antennas[0];

            this.raycasterEl = document.querySelector('#right-controller'); this.leftControllerEl = document.querySelector('#left-controller');
            this.anchorRootEl = document.querySelector('#anchor-root');
            this.worldPivotEl = document.querySelector('#world-pivot'); 
            this.worldContentEl = document.querySelector('#world-content');
            
            this.verticalCylinder = document.querySelector('#vertical-cylinder'); this.heightText = document.querySelector('#height-text');
            this.menuUI = document.querySelector('#menu-ui'); this.gwUI = document.querySelector('#guy-wires-ui');

            if (this.raycasterEl) { this.raycasterEl.addEventListener('triggerdown', this.onTriggerDown.bind(this)); this.raycasterEl.addEventListener('thumbstickmoved', this.onRightThumbstick.bind(this)); }
            if (this.leftControllerEl) { this.leftControllerEl.addEventListener('ybuttondown', this.toggleMenu.bind(this)); this.leftControllerEl.addEventListener('xbuttondown', this.toggleGuyWireMode.bind(this)); this.leftControllerEl.addEventListener('thumbstickmoved', this.onLeftThumbstick.bind(this)); }

            this.el.sceneEl.addEventListener('exit-vr', () => { 
                this.hitTestSource = null; this.requestingHitTest = false; 
                this.sceneAnchor = null; this.requestingAnchor = false;
            });

            this.initPersistentElements(); this.setupGlobalEventDelegation(); this.setupFileLoaders();
            window.saveAntennaToDB = this.saveAntennaToDB.bind(this); window.loadAntennaFromDB = this.loadAntennaFromDB.bind(this); window.deleteAntennaFromDB = this.deleteAntennaFromDB.bind(this);
            this.refreshDBList(); this.loadFromStorage(); 
            this.updateLaserVisibility();
        } catch (error) { console.error("Errore inizializzazione:", error); }
      },

      createEmptyAntenna: function() {
          return {
              state: 'PLACE_GROUND_A',
              pointA: { base: null, top: null }, pointB: { base: null, top: null }, 
              pointC: { percent: 0.5, top: null, base: null }, 
              traliccio: { active: false, center: null, shape: 'square', radius: 0.3, rotationY: 0, height: 1.0, corners: [], pegs: [] }, 
              custom3D: { assetIdx: 0, scale: 1.0, rotationX: 0, rotationY: 0, rotationZ: 0 },
              ritagli: [], // Array per i portali/maschere
              tempRitaglioPt1: null,
              antIdx: 3, bandIdx: 2, 
              endFed_AC_Len: 10.0, endFed_CB_Len: 10.0, longwireLen: 20.0, longwireVertex: 'A',
              numRadials: 4, radialLen: 5.0, mmanaModelIdx: 0, antennaRotationY: 0,
              mmanaWires: [], guyWiresData: []
          };
      },

      switchAntenna: function(idx) {
          this.gwState = 'OFF'; this.activeAnchor = null;
          this.activeAntIdx = idx;
          this.current = this.antennas[idx];
          this.triangState = 0;
          
          if (this.current.pointA.top && (this.current.state.startsWith('PLACE_') || this.current.state.startsWith('AWAITING_'))) { this.current.state = 'IDLE'; }
          if(this.menuUI) this.menuUI.setAttribute('visible', true);
          this.refreshAll();
      },

      refreshDBList: function() {
        let db = JSON.parse(localStorage.getItem('antenneAR_DB') || '{}'); let select = document.querySelector('#load-list'); if(!select) return; select.innerHTML = '';
        for (let name in db) { let opt = document.createElement('option'); opt.value = name; opt.innerText = name; select.appendChild(opt); }
      },

      executeSave: function(customName) {
        if(!this.current.pointA.base && this.antennas.length <= 1) return "ERRORE: Devi piazzare almeno un elemento."; 
        if(!this.calibLocal1 || !this.calibLocal2) return "ERRORE: Devi impostare i 2 Diamanti prima.";
        let db = JSON.parse(localStorage.getItem('antenneAR_DB') || '{}');
        db[customName] = { antennas: JSON.parse(JSON.stringify(this.antennas)), activeAntIdx: this.activeAntIdx, globalTextScale: this.globalTextScale, calibLocal1: this.calibLocal1, calibLocal2: this.calibLocal2 };
        localStorage.setItem('antenneAR_DB', JSON.stringify(db)); this.refreshDBList(); return `SCENA SALVATA:\n${customName}`;
      },

      saveAntennaToDB: function() { let name = document.querySelector('#save-name').value.trim(); if(!name) { alert("Inserisci un nome!"); return; } alert(this.executeSave(name)); },
      
      loadAntennaFromDB: function() {
        let select = document.querySelector('#load-list'); if(!select) return; let name = select.value;
        let db = JSON.parse(localStorage.getItem('antenneAR_DB') || '{}'); let d = db[name]; if(!d) return;

        this.calibLocal1 = d.calibLocal1; this.calibLocal2 = d.calibLocal2;
        this.worldContentEl.object3D.position.set(-this.calibLocal1.x, -this.calibLocal1.y, -this.calibLocal1.z); this.worldContentEl.setAttribute('visible', 'true'); 
        this.diamondRef1.setAttribute('position', this.calibLocal1); this.diamondRef2.setAttribute('position', this.calibLocal2);
        this.diamondRef1.setAttribute('visible', 'true'); this.diamondRef2.setAttribute('visible', 'true');

        if(d.antennas && d.antennas.length > 0) { this.antennas = d.antennas; this.activeAntIdx = d.activeAntIdx || 0; if(this.activeAntIdx >= this.antennas.length) this.activeAntIdx = 0; this.current = this.antennas[this.activeAntIdx]; }
        this.globalTextScale = parseFloat(d.globalTextScale) || 0.35;
        this.current.state = 'AWAITING_CALIB_PT1'; if(this.menuUI) this.menuUI.setAttribute('visible', true);
        this.refreshAll(); alert("Scena " + name + " caricata! Allinea il visore agganciato ai diamanti.");
      },
      
      deleteAntennaFromDB: function() { let select = document.querySelector('#load-list'); if(!select) return; let name = select.value; if(name && confirm("Eliminare l'antenna '" + name + "'?")) { let db = JSON.parse(localStorage.getItem('antenneAR_DB') || '{}'); delete db[name]; localStorage.setItem('antenneAR_DB', JSON.stringify(db)); this.refreshDBList(); } },

      saveToStorage: function() {
        let data = { antennas: JSON.parse(JSON.stringify(this.antennas)), activeAntIdx: this.activeAntIdx, globalTextScale: this.globalTextScale, pivotPos: this.worldPivotEl.object3D.position, pivotRot: this.worldPivotEl.object3D.rotation, contentPos: this.worldContentEl.object3D.position };
        localStorage.setItem('antennaArProV21', JSON.stringify(data));
      },

      loadFromStorage: function() {
        let saved = localStorage.getItem('antennaArProV21');
        if (saved) {
          try {
            let d = JSON.parse(saved);
            if(d.antennas && d.antennas.length > 0) { this.antennas = d.antennas; this.activeAntIdx = d.activeAntIdx || 0; if(this.activeAntIdx >= this.antennas.length) this.activeAntIdx = 0; this.current = this.antennas[this.activeAntIdx]; }
            if (d.globalTextScale) this.globalTextScale = d.globalTextScale;
            if (d.pivotPos) this.worldPivotEl.object3D.position.copy(d.pivotPos); if (d.pivotRot) this.worldPivotEl.object3D.rotation.copy(d.pivotRot); if (d.contentPos) this.worldContentEl.object3D.position.copy(d.contentPos);
            if (this.current.state.startsWith('PLACE_HEIGHT') || this.current.state.startsWith('REPOSITION_HEIGHT') || this.current.state.startsWith('SET_CALIB') || this.current.state.startsWith('AWAITING_CALIB') || this.current.state.startsWith('SIZE_ROTATE') || this.current.state.startsWith('DRAW_RITAGLIO')) this.current.state = 'IDLE';
          } catch(e) { console.error(e); }
        }
        this.gwState = 'OFF'; this.activeAnchor = null; if(this.gwUI) this.gwUI.setAttribute('visible', false); this.refreshAll();
      },

      getLocalPoint: function(worldVec) { let local = new THREE.Vector3(); this.worldContentEl.object3D.worldToLocal(local.copy(worldVec)); return { x: local.x, y: local.y, z: local.z }; },

      updateLaserVisibility: function() {
        let isMenuOpen = this.menuUI && (this.menuUI.getAttribute('visible') === 'true' || this.menuUI.getAttribute('visible') === true);
        let isGWMenuOpen = this.gwUI && (this.gwUI.getAttribute('visible') === 'true' || this.gwUI.getAttribute('visible') === true);
        let show = (this.pointerMode !== 'TRIANG') || isMenuOpen || isGWMenuOpen;
        if (this.raycasterEl) { this.raycasterEl.setAttribute('raycaster', 'showLine', show); }
      },

      toggleMenu: function() {
        if(this.gwState !== 'OFF') return; 
        if(!this.menuUI) return;
        let isVisible = this.menuUI.getAttribute('visible') === 'true' || this.menuUI.getAttribute('visible') === true;
        this.menuUI.setAttribute('visible', !isVisible);

        // RIPORTA AL PIAZZAMENTO IMMAGINE SE ESCE DAL RITAGLIO SENZA AVERLA PIAZZATA
        if (!isVisible && this.current.state && this.current.state.startsWith('DRAW_RITAGLIO')) {
            this.current.state = this.current.pointA.base ? 'IDLE' : 'PLACE_GROUND_A';
        }

        this.refreshAll(); 
      },

      toggleGuyWireMode: function() {
        if (this.antennaTypes[this.current.antIdx] === 'File Custom') return;
        if (!this.current.pointA.top && !this.current.pointB.top && !this.current.traliccio.active) return; 
        if (this.current.state.startsWith('AWAITING') || this.current.state.startsWith('PLACE_HEIGHT') || this.current.state.startsWith('SET_CALIB') || this.current.state.startsWith('SIZE_ROTATE')) return;
        
        if (this.gwState === 'OFF') {
          this.gwState = 'MAIN'; if(this.menuUI) this.menuUI.setAttribute('visible', false); if(this.gwUI) this.gwUI.setAttribute('visible', true);
          this.activeAnchor = null; this.updateGWUI(); this.refreshAll();
        } else {
          this.gwState = 'OFF'; if(this.gwUI) this.gwUI.setAttribute('visible', false); if(this.menuUI) this.menuUI.setAttribute('visible', true);
          this.activeAnchor = null; this.refreshAll();
        }
      },

      updateGWUI: function() {
        let isMain = (this.gwState === 'MAIN'); let isEditCollar = (this.gwState === 'EDIT_COLLAR');
        let isEditPegs = (this.gwState === 'EDIT_PEGS' || this.gwState === 'EDIT_TRALICCIO_PEGS'); let isAnyEdit = isEditCollar || isEditPegs;

        let gwMain = document.querySelector('#gw-page-main'); if(gwMain) gwMain.setAttribute('visible', isMain);
        let gwEdit = document.querySelector('#gw-page-edit'); if(gwEdit) gwEdit.setAttribute('visible', isAnyEdit);
        
        this.toggleButton('#btn-gw-new-tral', isMain && this.current.traliccio.active);
        this.toggleButton('#btn-gw-new-a', isMain && this.current.pointA.top !== null);
        this.toggleButton('#btn-gw-new-b', isMain && this.current.pointB.top !== null);
        this.toggleButton('#btn-gw-done', isAnyEdit);
      },

      toggleButton: function(id, isVisible) { let btn = document.querySelector(id); if(!btn) return; btn.setAttribute('visible', isVisible); if(isVisible) btn.classList.add('clickable'); else btn.classList.remove('clickable'); },
      refreshRaycaster: function() { setTimeout(() => { if (this.raycasterEl && this.raycasterEl.components.raycaster) this.raycasterEl.components.raycaster.refreshObjects(); }, 50); },

      initPersistentElements: function() {
        let makeLocalDiamond = (color) => {
            let d = document.createElement('a-octahedron'); d.setAttribute('radius', '0.06'); d.setAttribute('material', `color: ${color}; shader: flat; wireframe: true; opacity: 0.5`); d.setAttribute('visible', 'false');
            let core = document.createElement('a-octahedron'); core.setAttribute('radius', '0.03'); core.setAttribute('material', `color: ${color}; shader: flat; opacity: 0.8`); d.appendChild(core);
            this.worldContentEl.appendChild(d); return d; 
        };
        this.diamondRef1 = makeLocalDiamond('#00BFFF'); this.diamondRef2 = makeLocalDiamond('#FF00FF');
        
        this.reticleWrapper = document.createElement('a-entity');
        this.reticle = document.createElement('a-entity'); 
        this.reticle.setAttribute('geometry', 'primitive: ring; radiusInner: 0.08; radiusOuter: 0.1; segmentsTheta: 6'); 
        this.reticle.setAttribute('material', 'color: #00FF00; shader: flat; transparent: true; opacity: 0.9'); 
        this.reticle.setAttribute('rotation', '-90 0 0'); 
        this.reticleWrapper.appendChild(this.reticle);
        this.el.sceneEl.appendChild(this.reticleWrapper);
        this.reticleWrapper.setAttribute('visible', 'false');

        // ANTEPRIMA DISEGNO RITAGLIO (Il rettangolo temporaneo)
        this.ritaglioPreview = document.createElement('a-plane');
        this.ritaglioPreview.setAttribute('material', 'color: #FF00FF; wireframe: true; shader: flat; depthTest: false;');
        this.ritaglioPreview.setAttribute('visible', 'false');
        this.worldContentEl.appendChild(this.ritaglioPreview);

        this.triangUI = document.createElement('a-entity');
        this.el.sceneEl.appendChild(this.triangUI);
        this.beam1El = document.createElement('a-cylinder'); this.triangUI.appendChild(this.beam1El);
        this.beam2El = document.createElement('a-cylinder'); this.triangUI.appendChild(this.beam2El);
        this.triangMarkerEl = document.createElement('a-sphere');
        this.triangMarkerEl.setAttribute('radius', '0.08');
        this.triangMarkerEl.setAttribute('material', 'color: #00E676; shader: flat; transparent: true; opacity: 0.8');
        this.triangUI.appendChild(this.triangMarkerEl);
        this.triangTextEl = document.createElement('a-text');
        this.triangTextEl.setAttribute('align', 'center'); this.triangTextEl.setAttribute('color', '#FFFFFF'); this.triangTextEl.setAttribute('scale', '0.6 0.6 0.6'); this.triangTextEl.setAttribute('position', '0 0.3 0'); this.triangTextEl.setAttribute('look-at-camera', '');
        this.triangMarkerEl.appendChild(this.triangTextEl);
        this.triangUI.setAttribute('visible', 'false');
      },

      getCalculatedLength: function() {
        let type = this.antennaTypes[this.current.antIdx];
        if (type === 'File Custom') return 1.0;
        let bandMeters = parseInt(this.bands[this.current.bandIdx]); 
        if (type === 'Dipolo' || type === 'Verticale') return bandMeters / 4; 
        if (type === 'End Fed') return bandMeters * 0.45; 
        return bandMeters;                                 
      },

      resetAntennaLengths: function() { 
          let baseLen = this.getCalculatedLength(); 
          this.current.endFed_AC_Len = baseLen / 2; 
          this.current.endFed_CB_Len = baseLen / 2; 
          this.current.longwireLen = baseLen; 
      },

      updateBeam: function(el, origin, dir, color, length = 150) {
          el.setAttribute('visible', 'true');
          el.setAttribute('material', `color: ${color}; shader: flat; transparent: true; opacity: 0.6`);
          let startOffset = 0.2; 
          let actualLength = Math.max(0.1, length - startOffset);
          el.setAttribute('geometry', `primitive: cylinder; radius: 0.003; height: ${actualLength}`);
          let mid = new THREE.Vector3().copy(origin).addScaledVector(dir, startOffset + (actualLength / 2));
          el.setAttribute('position', `${mid.x} ${mid.y} ${mid.z}`);
          let quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
          let euler = new THREE.Euler().setFromQuaternion(quat, 'YXZ');
          el.setAttribute('rotation', `${euler.x * 180 / Math.PI} ${euler.y * 180 / Math.PI} ${euler.z * 180 / Math.PI}`);
      },

      tick: function (time, frameDelta) {
        if(!this.current.state) return;

        let sceneEl = this.el.sceneEl; let frame = sceneEl.frame;
        
        if (sceneEl.is('ar-mode') && frame) {
            let refSpace = sceneEl.renderer.xr.getReferenceSpace();
            if (!this.sceneAnchor && !this.requestingAnchor && frame.createAnchor) {
                this.requestingAnchor = true;
                if(typeof XRRigidTransform !== 'undefined') {
                    let transform = new XRRigidTransform({x:0, y:0, z:0}, {x:0, y:0, z:0, w:1});
                    frame.createAnchor(transform, refSpace).then(anchor => { this.sceneAnchor = anchor; }).catch(e => { console.error("Errore creazione Anchor", e); this.requestingAnchor = false; });
                }
            }
            if (this.sceneAnchor) {
                let pose = frame.getPose(this.sceneAnchor.anchorSpace, refSpace);
                if (pose && this.anchorRootEl) {
                    this.anchorRootEl.object3D.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                    this.anchorRootEl.object3D.quaternion.set(pose.transform.orientation.x, pose.transform.orientation.y, pose.transform.orientation.z, pose.transform.orientation.w);
                }
            }
        }

        let isPlacingMode = this.current.state.startsWith('PLACE_GROUND') || 
                            this.current.state.startsWith('REPOSITION_GROUND') || 
                            this.current.state.startsWith('AWAITING_CALIB') || 
                            this.current.state.startsWith('SET_CALIB') || 
                            this.current.state.startsWith('PLACE_TRALICCIO_CENTER') || 
                            this.current.state.startsWith('DRAW_RITAGLIO') || 
                            (this.gwState && this.gwState.includes('PEGS'));
                            
        if (!isPlacingMode) this.triangState = 0;
        let indicator = document.querySelector('#touch-indicator'); 
        if (indicator) indicator.setAttribute('visible', isPlacingMode && this.pointerMode === 'TOUCH');

        let cameraPos = new THREE.Vector3(); let cameraDir = new THREE.Vector3(0, 0, -1);
        let cameraEl = document.querySelector('#camera');
        if (cameraEl && cameraEl.object3D) { cameraEl.object3D.getWorldPosition(cameraPos); cameraDir.applyQuaternion(cameraEl.object3D.getWorldQuaternion(new THREE.Quaternion())); }
        let ctrlPos = new THREE.Vector3(); let ctrlDir = new THREE.Vector3(0, 0, -1);
        if (this.raycasterEl && this.raycasterEl.object3D) { this.raycasterEl.object3D.getWorldPosition(ctrlPos); ctrlDir.applyQuaternion(this.raycasterEl.object3D.getWorldQuaternion(new THREE.Quaternion())); }

        // ANTEPRIMA DEL RETTANGOLO DURANTE IL TRASCINAMENTO
        if (this.current.state === 'DRAW_RITAGLIO_PT2' && this.current.tempRitaglioPt1) {
            let hitGround = this.getHitPoint();
            if (hitGround) {
                let pt2 = this.getLocalPoint(hitGround.point);
                let pt1 = this.current.tempRitaglioPt1;
                let center = { x: (pt1.x + pt2.x) / 2, y: (pt1.y + pt2.y) / 2, z: (pt1.z + pt2.z) / 2 };
                let width = Math.sqrt(Math.pow(pt2.x - pt1.x, 2) + Math.pow(pt2.z - pt1.z, 2)) || 0.1;
                let height = Math.abs(pt2.y - pt1.y) || 0.1;
                
                this.ritaglioPreview.setAttribute('position', `${center.x} ${center.y} ${center.z}`);
                let rotX = this.current.custom3D ? this.current.custom3D.rotationX : 0;
                let rotY = this.current.custom3D ? this.current.custom3D.rotationY : 0;
                let rotZ = this.current.custom3D ? this.current.custom3D.rotationZ : 0;
                this.ritaglioPreview.setAttribute('rotation', `${rotX} ${rotY} ${rotZ}`);
                this.ritaglioPreview.setAttribute('width', width);
                this.ritaglioPreview.setAttribute('height', height);
                this.ritaglioPreview.setAttribute('visible', 'true');
            }
        } else {
            if(this.ritaglioPreview) this.ritaglioPreview.setAttribute('visible', 'false');
        }

        if (this.pointerMode === 'TRIANG' && isPlacingMode && !this.current.state.startsWith('DRAW_RITAGLIO')) {
            this.reticleValid = false; if (this.reticleWrapper) this.reticleWrapper.setAttribute('visible', 'false');
            this.triangUI.setAttribute('visible', 'true');
            let aimOrigin = ctrlPos.clone(); let aimDir = ctrlDir.clone();
            
            if (this.triangState === 0) {
                this.updateBeam(this.beam1El, aimOrigin, aimDir, '#00BFFF', 150);
                this.beam2El.setAttribute('visible', 'false'); this.triangMarkerEl.setAttribute('visible', 'false');
            } 
        } 
        else {
            this.triangUI.setAttribute('visible', 'false');
            if (this.pointerMode === 'LIDAR' && isPlacingMode && frame && sceneEl.is('ar-mode')) {
                let refSpace = sceneEl.renderer.xr.getReferenceSpace(); let hitFound = false;
                if (!this.hitTestSource && !this.requestingHitTest) {
                    this.requestingHitTest = true;
                    sceneEl.renderer.xr.getSession().requestReferenceSpace('viewer').then((viewerSpace) => { sceneEl.renderer.xr.getSession().requestHitTestSource({ space: viewerSpace }).then((source) => { this.hitTestSource = source; this.requestingHitTest = false; }).catch(() => { this.requestingHitTest = false; }); });
                }
                if (this.hitTestSource) {
                    let hitTestResults = frame.getHitTestResults(this.hitTestSource);
                    if (hitTestResults.length > 0) {
                        let pose = hitTestResults[0].getPose(refSpace);
                        if (pose) {
                            let hitPos = new THREE.Vector3(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                            this.targetReticlePos.copy(hitPos); this.targetReticleQuat.copy(pose.transform.orientation); this.lastFloorY = hitPos.y; hitFound = true;
                        }
                    }
                }
                if (!hitFound && cameraDir.y < -0.02) {
                    let distanceToFloor = (this.lastFloorY - cameraPos.y) / cameraDir.y;
                    if (distanceToFloor > 0 && distanceToFloor < 100) { this.targetReticlePos.copy(cameraPos).addScaledVector(cameraDir, distanceToFloor); this.targetReticleQuat.setFromEuler(new THREE.Euler(0, 0, 0)); hitFound = true; }
                }
                if (hitFound && this.reticleWrapper) { 
                    this.reticleWrapper.object3D.position.lerp(this.targetReticlePos, 0.25); 
                    this.reticleWrapper.object3D.quaternion.slerp(this.targetReticleQuat, 0.25); 
                    this.reticleWrapper.setAttribute('visible', 'true'); this.reticleValid = true; 
                } else if (this.reticleWrapper) { this.reticleWrapper.setAttribute('visible', 'false'); this.reticleValid = false; }
            } else { if(this.reticleWrapper) this.reticleWrapper.setAttribute('visible', 'false'); this.reticleValid = false; }
        }

        if (this.current.state === 'AWAITING_CALIB_PT1') { let hitGround = this.getHitPoint(); if (hitGround) this.worldPivotEl.object3D.position.copy(hitGround.point); } 
      },

      getHitPoint: function() {
        if (this.pointerMode === 'TRIANG' && !this.current.state.startsWith('DRAW_RITAGLIO')) {
            if (this.triangState === 2 && this.triangResult) { return { point: this.triangResult.point.clone() }; }
            return null;
        }
        if (this.pointerMode === 'LIDAR' && this.reticleValid) { let pos = new THREE.Vector3(); this.reticleWrapper.object3D.getWorldPosition(pos); return { point: pos }; }
        
        let pos = new THREE.Vector3(); let indicator = document.querySelector('#touch-indicator');
        if (indicator && (indicator.getAttribute('visible') === true || indicator.getAttribute('visible') === 'true')) { indicator.object3D.getWorldPosition(pos); } 
        else if (this.raycasterEl) { this.raycasterEl.object3D.getWorldPosition(pos); }
        return { point: pos };
      },

      onLeftThumbstick: function(evt) {
        let deltaX = evt.detail.x > 0 ? 2.0 : -2.0;
        let deltaY = evt.detail.y > 0 ? 2.0 : -2.0;
        if (this.current.state === 'SIZE_ROTATE_3D') {
            if(!this.current.custom3D) return;
            if (Math.abs(evt.detail.x) > 0.3) { this.current.custom3D.rotationY += deltaX; this.refreshAll(); }
            if (Math.abs(evt.detail.y) > 0.3) { this.current.custom3D.rotationX += deltaY; this.refreshAll(); }
            return;
        }
      },

      onRightThumbstick: function (evt) {
        let thumbTime = Date.now();
        if (!this.lastThumbTime || thumbTime - this.lastThumbTime > 110) {
          if (this.current.state === 'SIZE_ROTATE_3D') {
              if(!this.current.custom3D) return;
              if (Math.abs(evt.detail.y) > 0.3) {
                 let scaleMult = this.current.custom3D.scale > 2 ? 0.2 : 0.05;
                 let step = evt.detail.y < 0 ? scaleMult : -scaleMult; 
                 this.current.custom3D.scale = Math.max(0.01, this.current.custom3D.scale + step);
                 this.refreshAll(); this.lastThumbTime = thumbTime;
              }
          }
        }
      },

      updateHeightPreview: function() {
        if (!this.current.pointA.base && !this.current.pointB.base) return;
        let basePos = this.current.state.includes('_A') ? this.current.pointA.base : this.current.pointB.base;
        if (!basePos) return;
        this.verticalCylinder.setAttribute('position', `${basePos.x} ${basePos.y + (this.currentHeight / 2)} ${basePos.z}`);
        this.verticalCylinder.setAttribute('geometry', `primitive: cylinder; radius: 0.01; height: ${this.currentHeight}`);
        this.heightText.setAttribute('position', `${basePos.x} ${basePos.y + this.currentHeight + 0.2} ${basePos.z}`);
        this.heightText.setAttribute('scale', `${this.globalTextScale} ${this.globalTextScale} ${this.globalTextScale}`);
        this.heightText.setAttribute('value', `${this.currentHeight.toFixed(1)}m`);
      },

      onTriggerDown: function () {
        try {
            let now = Date.now(); if (now - this.lastTriggerTime < 300) return; this.lastTriggerTime = now;
            let intersects = null; if (this.raycasterEl && this.raycasterEl.components && this.raycasterEl.components.raycaster) intersects = this.raycasterEl.components.raycaster.intersectedEls;
            
            // --- LOGICA RITAGLI (PORTALI AR) ---
            if (this.current.state === 'DRAW_RITAGLIO_PT1') {
                let hitGround = this.getHitPoint();
                if(!hitGround) return;
                this.current.tempRitaglioPt1 = this.getLocalPoint(hitGround.point);
                this.current.state = 'DRAW_RITAGLIO_PT2';
                this.refreshAll();
                return;
            }
            if (this.current.state === 'DRAW_RITAGLIO_PT2') {
                let hitGround = this.getHitPoint();
                if(!hitGround) return;
                if(!this.current.ritagli) this.current.ritagli = []; // Sicurezza
                
                let pt2 = this.getLocalPoint(hitGround.point);
                let pt1 = this.current.tempRitaglioPt1;

                let center = { x: (pt1.x + pt2.x) / 2, y: (pt1.y + pt2.y) / 2, z: (pt1.z + pt2.z) / 2 };
                let width = Math.sqrt(Math.pow(pt2.x - pt1.x, 2) + Math.pow(pt2.z - pt1.z, 2)) || 0.1;
                let height = Math.abs(pt2.y - pt1.y) || 0.1;

                this.current.ritagli.push({ center: center, width: width, height: height });

                this.current.state = 'DRAW_RITAGLIO_PT1'; // Permette di disegnarne altri subito dopo
                if(this.ritaglioPreview) this.ritaglioPreview.setAttribute('visible', 'false');
                this.refreshAll();
                return;
            }

            let isPlacingMode = this.current.state.startsWith('PLACE_GROUND') || 
                                this.current.state.startsWith('REPOSITION_GROUND') || 
                                this.current.state.startsWith('AWAITING_CALIB') || 
                                this.current.state.startsWith('SET_CALIB') || 
                                this.current.state.startsWith('PLACE_TRALICCIO_CENTER') || 
                                this.current.state.startsWith('DRAW_RITAGLIO') || 
                                (this.gwState && this.gwState.includes('PEGS'));
            
            let hitUI = false;
            if (intersects) {
              for (let i = 0; i < intersects.length; i++) {
                let el = intersects[i];
                if (el.closest && (el.closest('#menu-ui') || el.closest('#guy-wires-ui'))) { hitUI = true; break; }
              }
            }
            if (hitUI) return; 

            if (intersects) {
              let hitVideo = intersects.find(el => el.classList && el.classList.contains('video-toggle'));
              if (hitVideo) {
                  let vidId = hitVideo.getAttribute('data-video-id');
                  let vidEl = document.querySelector(vidId);
                  if (vidEl) {
                      if (vidEl.paused) vidEl.play();
                      else vidEl.pause();
                  }
                  return;
              }
              let hitSelector = intersects.find(el => el.classList && el.classList.contains('antenna-selector'));
              if (hitSelector) { let targetIdx = parseInt(hitSelector.getAttribute('data-ant-idx')); this.switchAntenna(targetIdx); return; }
              let hitPoleC = intersects.find(el => el.id === 'point-c-hitbox');
              if (hitPoleC) { this.current.state = 'REPOSITION_GROUND_C'; if(this.menuUI) this.menuUI.setAttribute('visible', false); this.refreshAll(); return; }
            }

            let type = this.antennaTypes[this.current.antIdx];

            if (this.current.state === 'PLACE_GROUND_A' || this.current.state === 'REPOSITION_GROUND_A') {
              let hitGround = this.getHitPoint(); if(!hitGround) return;
              let newPoint = this.getLocalPoint(hitGround.point);
              
              if (this.current.state === 'REPOSITION_GROUND_A' && this.current.traliccio && this.current.traliccio.active) {
                  let oldCenter = this.current.traliccio.center;
                  let offset = { x: newPoint.x - oldCenter.x, y: newPoint.y - oldCenter.y, z: newPoint.z - oldCenter.z };
                  this.current.traliccio.center = newPoint;
                  this.current.pointA.base = { x: newPoint.x, y: newPoint.y + this.current.traliccio.height, z: newPoint.z };
                  if(this.current.traliccio.pegs) { this.current.traliccio.pegs.forEach(p => { p.x += offset.x; p.y += offset.y; p.z += offset.z; }); }
              } else { 
                  this.current.pointA.base = newPoint; 
              }
              
              if (type === 'File Custom') {
                  if(!this.current.custom3D) this.current.custom3D = { scale: 1.0, rotationY: 0, rotationX: 0, rotationZ: 0, assetIdx: 0 };
                  this.current.state = 'SIZE_ROTATE_3D';
                  if(this.menuUI) this.menuUI.setAttribute('visible', false);
                  this.refreshAll();
                  if (this.triangState === 2) this.triangState = 0; return;
              }

              this.current.state = this.current.state.startsWith('REPOSITION') ? 'REPOSITION_HEIGHT_A' : 'PLACE_HEIGHT_A'; 
              this.currentHeight = type === 'Verticale' ? this.getCalculatedLength() : 1.0; 
              this.setupVerticalPreviewMode(this.current.pointA.base);
            } 
            else if (this.current.state === 'PLACE_HEIGHT_A' || this.current.state === 'REPOSITION_HEIGHT_A') {
              this.current.pointA.top = { x: this.current.pointA.base.x, y: this.current.pointA.base.y + this.currentHeight, z: this.current.pointA.base.z }; this.resetVerticalPreviewMode();
              if(this.current.state === 'REPOSITION_HEIGHT_A' || type === 'Verticale' || type === 'MMANA-GAL') { this.current.state = 'IDLE'; if(this.menuUI) this.menuUI.setAttribute('visible', true); this.refreshAll(); } else { this.current.state = 'PLACE_GROUND_B'; }
            } 
            else if (this.current.state === 'PLACE_GROUND_B' || this.current.state === 'REPOSITION_GROUND_B') {
              let hitGround = this.getHitPoint(); if(!hitGround) return;
              this.current.pointB.base = this.getLocalPoint(hitGround.point); this.current.state = this.current.state.startsWith('REPOSITION') ? 'REPOSITION_HEIGHT_B' : 'PLACE_HEIGHT_B'; this.currentHeight = 1.0; this.setupVerticalPreviewMode(this.current.pointB.base);
            } 
            else if (this.current.state === 'PLACE_HEIGHT_B' || this.current.state === 'REPOSITION_HEIGHT_B') {
              this.current.pointB.top = { x: this.current.pointB.base.x, y: this.current.pointB.base.y + this.currentHeight, z: this.current.pointB.base.z }; this.resetVerticalPreviewMode(); this.current.state = 'IDLE'; if(this.menuUI) this.menuUI.setAttribute('visible', true); this.refreshAll(); 
            }
            if (this.triangState === 2) this.triangState = 0;
        } catch(e) { console.error("Errore onTriggerDown:", e); }
      },

      setupVerticalPreviewMode: function (basePos) { if(this.verticalCylinder) this.verticalCylinder.setAttribute('visible', 'true'); this.updateHeightPreview(); if(this.heightText) this.heightText.setAttribute('visible', 'true'); },
      resetVerticalPreviewMode: function () { if(this.verticalCylinder) this.verticalCylinder.setAttribute('visible', 'false'); if(this.heightText) this.heightText.setAttribute('visible', 'false'); },

      createBasePanel: function(pos, container) {
          if (!pos) return;
          let panel = document.createElement('a-plane'); panel.setAttribute('width', '0.4'); panel.setAttribute('height', '0.4');
          panel.setAttribute('color', '#00E676'); panel.setAttribute('material', 'opacity: 0.6; transparent: true; wireframe: true; shader: flat');
          panel.setAttribute('rotation', '-90 0 0'); panel.setAttribute('position', `${pos.x} ${pos.y + 0.001} ${pos.z}`); container.appendChild(panel);
      },

      createLabel: function(text, pos, color, scale, container) {
          let label = document.createElement('a-text'); label.setAttribute('value', text); label.setAttribute('align', 'center'); label.setAttribute('color', color); label.setAttribute('scale', `${scale} ${scale} ${scale}`); label.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`); label.setAttribute('look-at-camera', ''); container.appendChild(label);
          return label;
      },

      renderSelectorBox: function(ant, container, isCurrent, idx) {
          if (isCurrent) return; 
          let isMenuOpen = this.menuUI && (this.menuUI.getAttribute('visible') === 'true' || this.menuUI.getAttribute('visible') === true);
          if (!isMenuOpen) return;
          let basePos = ant.traliccio.active ? ant.traliccio.center : ant.pointA.base;
          if (!basePos) return;
          let hitBox = document.createElement('a-octahedron');
          hitBox.setAttribute('position', `${basePos.x} ${basePos.y + 0.4} ${basePos.z}`);
          hitBox.setAttribute('geometry', `primitive: octahedron; radius: 0.08`);
          hitBox.setAttribute('material', 'color: #FFEB3B; opacity: 0.9; shader: flat');
          hitBox.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear');
          hitBox.classList.add('clickable', 'antenna-selector'); hitBox.setAttribute('data-ant-idx', idx); hitBox.setAttribute('btn-interaction', ''); container.appendChild(hitBox);
          let lbl = this.antennaTypes[ant.antIdx] === 'File Custom' ? `SELEZIONA\nOGGETTO ${idx + 1}` : `SELEZIONA\nANTENNA ${idx + 1}`;
          this.createLabel(lbl, {x: basePos.x, y: basePos.y + 0.6, z: basePos.z}, '#FFEB3B', this.globalTextScale * 0.7, container);
      },

      renderAntenna: function(ant, container, isCurrent, idx) {
          let type = this.antennaTypes[ant.antIdx];

          if (type === 'File Custom') {
              if (!ant.ritagli) ant.ritagli = [];
              if (!ant.custom3D) ant.custom3D = { scale: 1.0, rotationX: 0, rotationY: 0, rotationZ: 0, assetIdx: 0 };

              // 1. RENDERIZZA SEMPRE I RITAGLI (Anche prima di piazzare il video)
              if (ant.ritagli.length > 0) {
                  ant.ritagli.forEach((rit) => {
                      let maskEl = document.createElement('a-plane');
                      maskEl.setAttribute('width', rit.width);
                      maskEl.setAttribute('height', rit.height);
                      maskEl.setAttribute('position', `${rit.center.x} ${rit.center.y} ${rit.center.z}`);
                      maskEl.setAttribute('rotation', `${ant.custom3D.rotationX} ${ant.custom3D.rotationY} ${ant.custom3D.rotationZ}`);
                      maskEl.setAttribute('ritaglio-mask', '');
                      container.appendChild(maskEl);

                      let bordo = document.createElement('a-plane');
                      bordo.setAttribute('width', rit.width);
                      bordo.setAttribute('height', rit.height);
                      bordo.setAttribute('position', `${rit.center.x} ${rit.center.y} ${rit.center.z}`);
                      bordo.setAttribute('rotation', `${ant.custom3D.rotationX} ${ant.custom3D.rotationY} ${ant.custom3D.rotationZ}`);
                      bordo.setAttribute('material', 'color: #00FFCC; wireframe: true; shader: flat; depthTest: false;');
                      container.appendChild(bordo);
                  });
              }

              // 2. RENDERIZZA IL CONTENUTO (SE PIAZZATO)
              if (ant.pointA.base) {
                  if (isCurrent && ant.state !== 'IDLE' && !ant.state.startsWith('DRAW_RITAGLIO')) {
                      this.createBasePanel(ant.pointA.base, container);
                  }
                  
                  let mediaEl = null;
                  if (this.assetLibrary.length > 0) {
                      let asset = this.assetLibrary[ant.custom3D.assetIdx || 0];
                      if (!asset) asset = this.assetLibrary[0];

                      if (asset.format === 'image' || asset.format === 'video') {
                          mediaEl = document.createElement('a-entity');
                          let w = 1.0;
                          let h = asset.aspect ? (1.0 / asset.aspect) : 1.0;
                          let depthThickness = 0.03; 

                          mediaEl.setAttribute('geometry', `primitive: box; width: ${w}; height: ${h}; depth: ${depthThickness}`);
                          
                          if (asset.format === 'video') {
                              mediaEl.setAttribute('material', `src: ${asset.elementId}; shader: flat; color: #FFFFFF`);
                              mediaEl.classList.add('clickable', 'video-toggle');
                              mediaEl.setAttribute('data-video-id', asset.elementId);
                              setTimeout(() => {
                                  let v = document.querySelector(asset.elementId);
                                  if (v && v.paused) v.play().catch(e => console.warn('Autoplay bloccato:', e));
                              }, 100);
                          } else {
                              mediaEl.setAttribute('material', `src: ${asset.elementId}; shader: flat; transparent: false;`);
                          }

                          let frameEl = document.createElement('a-entity');
                          frameEl.setAttribute('geometry', `primitive: box; width: ${w + 0.04}; height: ${h + 0.04}; depth: ${depthThickness - 0.01}`);
                          frameEl.setAttribute('material', 'color: #222222; shader: flat; roughness: 0.9');
                          frameEl.setAttribute('position', `0 0 -0.01`); 
                          mediaEl.appendChild(frameEl);

                          if (ant.ritagli && ant.ritagli.length > 0) {
                              mediaEl.setAttribute('ritaglio-content', '');
                              frameEl.setAttribute('ritaglio-content', '');
                          }
                      } 
                      else if (asset.format === 'glb') {
                          mediaEl = document.createElement('a-entity');
                          mediaEl.setAttribute('gltf-model', asset.url);
                          mediaEl.setAttribute('animation-mixer', '');
                      } else if (asset.format === 'obj') {
                          mediaEl = document.createElement('a-entity');
                          mediaEl.setAttribute('obj-model', `obj: ${asset.url}`);
                          mediaEl.setAttribute('material', 'color: #90A4AE; metalness: 0.4; roughness: 0.6');
                      } else if (asset.format === 'stl') {
                          mediaEl = document.createElement('a-entity');
                          mediaEl.setAttribute('stl-model', asset.url);
                      }

                      if (mediaEl && (asset.format === 'glb' || asset.format === 'obj')) {
                          mediaEl.addEventListener('model-loaded', () => {
                              let obj3D = mediaEl.getObject3D('mesh');
                              if (obj3D) {
                                  let box = new THREE.Box3().setFromObject(obj3D);
                                  let center = new THREE.Vector3(); box.getCenter(center);
                                  obj3D.position.x -= center.x;
                                  obj3D.position.y -= box.min.y; 
                                  obj3D.position.z -= center.z;
                              }
                          });
                      }
                  } else {
                      mediaEl = document.createElement('a-entity');
                      mediaEl.setAttribute('geometry', 'primitive: box; width: 0.4; height: 0.4; depth: 0.4');
                      mediaEl.setAttribute('material', 'color: #9C27B0; wireframe: true');
                      this.createLabel('NESSUN FILE IMPORTATO\nUSA IL MENU 2D', {x: ant.pointA.base.x, y: ant.pointA.base.y + 0.6, z: ant.pointA.base.z}, '#FF1744', this.globalTextScale, container);
                  }
                  
                  if (mediaEl) {
                      mediaEl.setAttribute('position', `${ant.pointA.base.x} ${ant.pointA.base.y} ${ant.pointA.base.z}`);
                      mediaEl.setAttribute('rotation', `${ant.custom3D.rotationX} ${ant.custom3D.rotationY} ${ant.custom3D.rotationZ}`);
                      mediaEl.setAttribute('scale', `${ant.custom3D.scale} ${ant.custom3D.scale} ${ant.custom3D.scale}`);
                      container.appendChild(mediaEl);
                  }
              }
              this.renderSelectorBox(ant, container, isCurrent, idx);
              return;
          }

          if (!ant.pointA.top) { this.renderSelectorBox(ant, container, isCurrent, idx); return; }
          if(ant.pointA.base && !ant.traliccio.active) this.createBasePanel(ant.pointA.base, container);
          
          this.renderSelectorBox(ant, container, isCurrent, idx);
      },

      updateGeometriesAndDrawings: function() {
        let containerEls = this.worldContentEl.querySelectorAll('.antenna-group');
        containerEls.forEach(el => el.parentNode.removeChild(el));
        this.antennas.forEach((ant, idx) => {
            let isCurrent = (idx === this.activeAntIdx);
            let container = document.createElement('a-entity'); container.classList.add('antenna-group');
            this.worldContentEl.appendChild(container); this.renderAntenna(ant, container, isCurrent, idx);
        });
        this.refreshRaycaster();
      },

      setupGlobalEventDelegation: function() {
        let scene = this.el.sceneEl; this.lastClickTime = 0; 
        scene.addEventListener('mousedown', (evt) => {
          let now = Date.now(); if (now - this.lastClickTime < 250) return; 
          let target = evt.target.closest('.clickable'); if(!target) return;
          let isVis = target.getAttribute('visible'); if (isVis === false || isVis === 'false') return;
          let parent = target.parentElement; if (parent && (parent.getAttribute('visible') === false || parent.getAttribute('visible') === 'false')) return;

          this.lastClickTime = now; let id = target.id; let mathRound = (num) => Math.round(num * 100) / 100;

          if (id === 'btn-laser-toggle') {
              let txt = document.querySelector('#txt-laser-toggle'); let btn = document.querySelector('#btn-laser-toggle');
              if (this.pointerMode === 'TOUCH') {
                  this.pointerMode = 'LIDAR'; txt.setAttribute('value', "PUNTAMENTO: LIDAR + TOCCO"); btn.setAttribute('color', '#D81B60');
              } else if (this.pointerMode === 'LIDAR') {
                  this.pointerMode = 'TRIANG'; this.hitTestSource = null; txt.setAttribute('value', "PUNTAMENTO: TRIANGOLAZIONE (CONTROLLER)"); btn.setAttribute('color', '#FF1744');
              } else {
                  this.pointerMode = 'TOUCH'; this.hitTestSource = null; this.triangState = 0; txt.setAttribute('value', "PUNTAMENTO: SOLO TOCCO"); btn.setAttribute('color', '#5E35B1');
              }
              this.refreshAll();
          }
          else if (id === 'btn-scene-new') { this.antennas.push(this.createEmptyAntenna()); this.activeAntIdx = this.antennas.length - 1; this.current = this.antennas[this.activeAntIdx]; this.refreshAll(); }
          else if (id === 'btn-scene-prev') { if (this.antennas.length <= 1) return; this.switchAntenna((this.activeAntIdx - 1 + this.antennas.length) % this.antennas.length); }
          else if (id === 'btn-scene-next') { if (this.antennas.length <= 1) return; this.switchAntenna((this.activeAntIdx + 1) % this.antennas.length); }
          else if (id === 'btn-delete-antenna') {
              if (this.antennas.length > 1) { this.antennas.splice(this.activeAntIdx, 1); this.activeAntIdx = Math.max(0, this.activeAntIdx - 1); this.current = this.antennas[this.activeAntIdx]; } else { this.antennas = [this.createEmptyAntenna()]; this.activeAntIdx = 0; this.current = this.antennas[0]; }
              this.refreshAll();
          }
          else if (id === 'btn-media-prev') {
              if (this.assetLibrary.length > 0) {
                  if(!this.current.custom3D) this.current.custom3D = { assetIdx: 0, scale: 1.0, rotationX: 0, rotationY: 0, rotationZ: 0 };
                  this.current.custom3D.assetIdx = (this.current.custom3D.assetIdx - 1 + this.assetLibrary.length) % this.assetLibrary.length;
                  this.refreshAll();
              }
          }
          else if (id === 'btn-media-next') {
              if (this.assetLibrary.length > 0) {
                  if(!this.current.custom3D) this.current.custom3D = { assetIdx: 0, scale: 1.0, rotationX: 0, rotationY: 0, rotationZ: 0 };
                  this.current.custom3D.assetIdx = (this.current.custom3D.assetIdx + 1) % this.assetLibrary.length;
                  this.refreshAll();
              }
          }
          else if (id === 'btn-draw-ritaglio') {
              this.current.state = 'DRAW_RITAGLIO_PT1';
              if(this.menuUI) this.menuUI.setAttribute('visible', false);
              this.refreshAll();
          }
          else if (id === 'btn-ant') { this.current.antIdx = (this.current.antIdx + 1) % this.antennaTypes.length; this.resetAntennaLengths(); this.refreshAll(); } 
          else if (id === 'btn-txt-minus') { this.globalTextScale = Math.max(0.15, mathRound(this.globalTextScale - 0.05)); this.refreshAll(); this.updateHeightPreview(); } 
          else if (id === 'btn-txt-plus') { this.globalTextScale = Math.min(1.2, mathRound(this.globalTextScale + 0.05)); this.refreshAll(); this.updateHeightPreview(); } 
          else if (id === 'btn-repo-a') { this.current.state = 'REPOSITION_GROUND_A'; if(this.menuUI) this.menuUI.setAttribute('visible', false); } 
          else if (id === 'btn-global-reset') {
             let containerEls = this.worldContentEl.querySelectorAll('.antenna-group');
             containerEls.forEach(el => el.parentNode.removeChild(el));
             this.antennas = [this.createEmptyAntenna()]; this.activeAntIdx = 0; this.current = this.antennas[0];
             if(this.anchorRootEl) { this.anchorRootEl.object3D.position.set(0,0,0); this.anchorRootEl.object3D.rotation.set(0,0,0); }
             if(this.worldPivotEl) { this.worldPivotEl.object3D.position.set(0,0,0); this.worldPivotEl.object3D.rotation.set(0,0,0); }
             if(this.worldContentEl) { this.worldContentEl.object3D.position.set(0,0,0); this.worldContentEl.setAttribute('visible', 'true'); }
             this.calibLocal1 = null; this.calibLocal2 = null;
             if(this.diamondRef1) this.diamondRef1.setAttribute('visible', 'false'); if(this.diamondRef2) this.diamondRef2.setAttribute('visible', 'false');
             localStorage.removeItem('antennaArProV21'); this.refreshAll();
          }
        });
      },

      setupFileLoaders: function() {
        let fileInputCustom = document.querySelector('#file-custom-media');
        if(fileInputCustom) {
            fileInputCustom.addEventListener('change', (evt) => {
                let files = evt.target.files;
                if(files.length > 0) {
                    let added = 0;
                    for(let i = 0; i < files.length; i++) {
                        let file = files[i];
                        let name = file.name.toLowerCase();
                        let url = URL.createObjectURL(file);
                        let format = 'unknown';
                        
                        if (name.endsWith('.glb') || name.endsWith('.gltf')) format = 'glb';
                        else if (name.endsWith('.obj')) format = 'obj';
                        else if (name.endsWith('.stl')) format = 'stl';
                        else if (name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg')) format = 'image';
                        else if (name.endsWith('.mp4') || name.endsWith('.webm')) format = 'video';
                        
                        if(format !== 'unknown') {
                            let assetObj = { name: file.name, url: url, format: format };
                            
                            if (format === 'image' || format === 'video') {
                                let assetsEl = document.querySelector('a-assets');
                                if (!assetsEl) {
                                    assetsEl = document.createElement('a-assets');
                                    document.querySelector('a-scene').appendChild(assetsEl);
                                }
                                
                                if (format === 'image') {
                                    let imgEl = document.createElement('img');
                                    imgEl.setAttribute('id', 'custom-img-' + Date.now() + i);
                                    imgEl.setAttribute('src', url);
                                    imgEl.setAttribute('crossorigin', 'anonymous');
                                    assetsEl.appendChild(imgEl);
                                    assetObj.elementId = '#' + imgEl.id;
                                    
                                    imgEl.onload = () => { assetObj.aspect = imgEl.naturalWidth / imgEl.naturalHeight; this.refreshAll(); };
                                } else {
                                    let vidEl = document.createElement('video');
                                    vidEl.setAttribute('id', 'custom-vid-' + Date.now() + i);
                                    vidEl.setAttribute('src', url);
                                    vidEl.setAttribute('crossorigin', 'anonymous');
                                    vidEl.setAttribute('autoplay', 'true');
                                    vidEl.setAttribute('loop', 'true');
                                    vidEl.setAttribute('muted', 'true');
                                    vidEl.setAttribute('playsinline', 'true');
                                    assetsEl.appendChild(vidEl);
                                    assetObj.elementId = '#' + vidEl.id;
                                    
                                    vidEl.onloadedmetadata = () => { 
                                        assetObj.aspect = vidEl.videoWidth / vidEl.videoHeight; 
                                        vidEl.play().catch(e => console.warn(e)); 
                                        this.refreshAll(); 
                                    };
                                }
                            }
                            this.assetLibrary.push(assetObj);
                            added++;
                        }
                    }
                    if (added > 0) {
                        this.current.antIdx = this.antennaTypes.indexOf('File Custom');
                        if(!this.current.custom3D) this.current.custom3D = { assetIdx: 0, scale: 1.0, rotationX: 0, rotationY: 0, rotationZ: 0 };
                        this.current.custom3D.assetIdx = this.assetLibrary.length - 1; 
                        alert(`${added} File Aggiunti alla Libreria!\nIndossa il visore, apri il menu "Nuova Antenna -> Tipo Oggetto -> File Custom".`);
                        this.refreshAll();
                    } else { alert("Nessun formato supportato trovato."); }
                }
                evt.target.value = ''; 
            });
        }
      },

      refreshAll: function() { 
          this.updateMenuText(); 
          this.updateGeometriesAndDrawings(); 
          this.updateLaserVisibility();
          this.saveToStorage(); 
      }
    });
  </script>
</head>
<body>
  
  <div id="ui-2d-container">
    <h3>DATABASE SCENE MULTIPLE</h3>
    <input type="text" id="save-name" placeholder="Es. Campo Scout">
    <button class="action" onclick="window.saveAntennaToDB()">SALVA SCENA NEL VISORE</button>
    <hr>
    <p>Carica una scena salvata:</p>
    <select id="load-list"></select>
    <button onclick="window.loadAntennaFromDB()">CARICA SCENA</button>
    <button style="background: #D32F2F; color:white;" onclick="window.deleteAntennaFromDB()">ELIMINA SCENA</button>
    <hr>
    <div class="import-box">
      <h3>LIBRERIA MULTIMEDIALE</h3>
      <p style="color:#FFF59D;">Carica PIU' file contemporaneamente: <b>.GLB, .OBJ, .STL, .PNG, .JPG, .MP4, .WEBM</b>. <br>I GLB supportano colori e animazioni.</p>
      <input type="file" id="file-custom-media" accept=".glb,.gltf,.obj,.stl,.png,.jpg,.jpeg,.mp4,.webm" multiple>
    </div>
  </div>

  <a-scene webxr="optionalFeatures: local-floor, hit-test, anchors, depth-sensing, plane-detection, mesh-detection;" vr-mode-ui="enabled: true">
    
    <a-entity id="cameraRig">
      <a-camera id="camera" position="0 1.6 0"></a-camera>
      
      <a-entity id="left-controller" oculus-touch-controls="hand: left">
        <a-text value="ANCORA FISICA (Non toccare)\nIl menu fluttua qui sopra." position="0 0.05 0" rotation="-90 0 0" align="center" scale="0.08 0.08 0.08" color="#FF1744"></a-text>

        <a-entity id="menu-ui" visible="false" position="0 0.15 -0.2" rotation="-30 0 0">
          <a-plane width="0.55" height="0.95" color="#1A1A1A" material="opacity: 0.96; shader: flat"></a-plane>
          
          <a-text value="CONFIGURATORE AR PORTALI" position="0 0.44 0.01" align="center" scale="0.11 0.11 0.11" color="#FFEB3B"></a-text>
          
          <a-plane width="0.52" height="0.08" color="#2A2A2A" position="0 0.38 0.01">
            <a-text id="info-text" value="Appoggia il controller destro a terra e premi il grilletto." position="0 0 0.01" align="center" scale="0.05 0.05 0.05" color="#00E676"></a-text>
          </a-plane>

          <a-text value="GESTIONE SCENA E SISTEMA PUNTAMENTO" position="0 0.31 0.01" align="center" scale="0.065 0.065 0.065" color="#00BFFF"></a-text>
          <a-plane id="btn-scene-prev" class="clickable" btn-interaction width="0.12" height="0.03" color="#00838F" position="-0.18 0.27 0.01"><a-text value="< PREV" align="center" scale="0.06 0.06 0.06"></a-text></a-plane>
          <a-plane id="btn-scene-new" class="clickable" btn-interaction width="0.22" height="0.03" color="#00C853" position="0 0.27 0.01"><a-text value="+ NUOVA ANTENNA" align="center" scale="0.06 0.06 0.06" color="#000"></a-text></a-plane>
          <a-plane id="btn-scene-next" class="clickable" btn-interaction width="0.12" height="0.03" color="#00838F" position="0.18 0.27 0.01"><a-text value="NEXT >" align="center" scale="0.06 0.06 0.06"></a-text></a-plane>
          
          <a-plane id="btn-delete-antenna" class="clickable" btn-interaction width="0.25" height="0.025" color="#D32F2F" position="0 0.235 0.01">
            <a-text value="[X] ELIMINA SELEZIONE" align="center" scale="0.05 0.05 0.05" color="#FFFFFF"></a-text>
          </a-plane>
          <a-text id="txt-scene-info" value="ANTENNA 1 DI 1" position="0 0.20 0.01" align="center" scale="0.055 0.055 0.055" color="#FFF"></a-text>
          
          <a-plane id="btn-laser-toggle" class="clickable" btn-interaction width="0.45" height="0.035" color="#5E35B1" position="0 0.16 0.01">
            <a-text id="txt-laser-toggle" value="PUNTAMENTO: SOLO TOCCO" align="center" scale="0.065 0.065 0.065" color="#FFFFFF"></a-text>
          </a-plane>

          <a-plane id="btn-ant" class="clickable" btn-interaction width="0.4" height="0.04" color="#37474F" position="0 0.09 0.01">
            <a-text value="TIPO OGGETTO:" align="center" scale="0.065 0.065 0.065" position="0 0.008 0.005" color="#B0BEC5"></a-text>
            <a-text id="txt-ant-val" value="-" align="center" scale="0.09 0.09 0.09" position="0 -0.008 0.005" color="#FFFFFF"></a-text>
          </a-plane>

          <!-- MENU LIBRERIA FILE -->
          <a-entity id="sub-media" position="0 0.02 0" visible="false">
            <a-text value="LIBRERIA FILE (MODELLI 3D E IMMAGINI)" align="center" scale="0.065 0.065 0.065" color="#B0BEC5" position="0 0.03 0"></a-text>
            <a-plane id="btn-media-prev" class="clickable" btn-interaction width="0.1" height="0.03" color="#006064" position="-0.16 -0.01 0.01"><a-text value="< PREV" align="center" scale="0.06 0.06 0.06"></a-text></a-plane>
            <a-plane id="btn-media-next" class="clickable" btn-interaction width="0.1" height="0.03" color="#006064" position="0.16 -0.01 0.01"><a-text value="NEXT >" align="center" scale="0.06 0.06 0.06"></a-text></a-plane>
            <a-text id="txt-media-name" value="-" align="center" scale="0.07 0.07 0.07" position="0 -0.01 0.01" color="#FFEB3B"></a-text>
            
            <!-- TASTO PER DISEGNARE RITAGLI (PORTALI) -->
            <a-plane id="btn-draw-ritaglio" class="clickable" btn-interaction width="0.32" height="0.025" color="#D81B60" position="0 -0.05 0.01">
                <a-text value="DISEGNA RITAGLIO (PORTALE)" align="center" scale="0.055 0.055 0.055"></a-text>
            </a-plane>
          </a-entity>

          <a-plane id="btn-txt-minus" class="clickable" btn-interaction width="0.1" height="0.022" color="#424242" position="-0.06 -0.06 0.01"><a-text value="TESTO [-]" align="center" scale="0.065 0.065 0.065"></a-text></a-plane>
          <a-plane id="btn-txt-plus" class="clickable" btn-interaction width="0.1" height="0.022" color="#424242" position="0.06 -0.06 0.01"><a-text value="TESTO [+]" align="center" scale="0.065 0.065 0.065"></a-text></a-plane>

          <a-text value="RIPOSIZIONAMENTO E MODIFICA ALTEZZE" position="0 -0.10 0.01" align="center" scale="0.065 0.065 0.065" color="#FF1744"></a-text>
          <a-plane id="btn-repo-a" class="clickable" btn-interaction width="0.11" height="0.025" color="#C62828" position="0 -0.14 0.01"><a-text value="SPOSTA A" align="center" scale="0.055 0.055 0.055"></a-text></a-plane>
          
          <a-plane id="btn-global-reset" class="clickable" btn-interaction width="0.45" height="0.025" color="#D32F2F" position="0 -0.42 0.01">
            <a-text value="RESET COMPLETO DI TUTTA LA SCENA" align="center" scale="0.065 0.065 0.065"></a-text>
          </a-plane>
        </a-entity>
      </a-entity>
      
      <a-entity id="right-controller" laser-controls="hand: right" oculus-touch-controls="hand: right" raycaster="objects: .clickable, .video-toggle; far: 10">
        <a-sphere id="touch-indicator" radius="0.015" material="color: #00FF00; shader: flat; transparent: true; opacity: 0.8" position="0 -0.07 0.02" visible="false"></a-sphere>
      </a-entity>
    </a-entity>

    <a-entity id="anchor-root">
        <!-- COMPONENTE CHE TRADUCE LA STANZA REALE IN OSTACOLI VIRTUALI INVISIBILI -->
        <a-entity ar-room-occlusion></a-entity>

        <a-entity id="world-pivot" position="0 0 0" rotation="0 0 0">
            <a-entity id="world-content" position="0 0 0" rotation="0 0 0"></a-entity>
        </a-entity>
    </a-entity>

    <a-entity ar-antenna-system></a-entity>
  </a-scene>
</body>
</html>
